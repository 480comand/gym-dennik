<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1222">
<title>Linka 112</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@500;600;700&family=Barlow+Condensed:wght@700;800&display=swap">
<style>
  :root{
    /* Rozloženie: dispečerský pult – pás s postupom hore, vľavo hovory a udalosti, v strede 3D mapa Košického kraja, vpravo posádky */
    --ink:#0a1222; --panel:#101b30; --card:#16233c; --line:#243450;
    --text:#e8edf6; --muted:#8e9bb4;
    --sodium:#f2b33d; --on-sodium:#1c1405;
    --good:#3ddc97; --bad:#ff4d5e;
    --p1:#ff4d5e; --p2:#ff9a3c; --p3:#f4d35e;
    --s1:#3ddc97; --s2:#2aa198; --s3:#ff9a3c; --s4:#ff4d5e; --s5:#b48cff; --s6:#5aa9ff;
    --t-med:#ff6b81; --t-traffic:#f4d35e; --t-fire:#ff8a3d; --t-tech:#c9a46a; --t-hazmat:#a6e22e;
    --t-police:#5aa9ff; --t-msp:#3fd0c9; --t-mountain:#e86a4a; --t-prank:#8e9bb4;
    --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
    --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{height:100%; margin:0; background:var(--ink); color:var(--text); font-family:var(--f-body); font-size:15px; line-height:1.4;}
  body{overflow:hidden; -webkit-tap-highlight-color:transparent;}
  button{font:inherit; color:inherit;}
  kbd{font:600 10px var(--f-mono); border:1px solid currentColor; border-radius:4px; padding:0 4px; opacity:.7;}
  .ico{width:18px; height:18px; flex:none; display:inline-block; vertical-align:-3px;}

  .app{position:relative; height:100%; display:grid; gap:12px;
    grid-template-columns:minmax(290px,340px) minmax(0,1fr) minmax(250px,300px);
    grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"bar bar bar" "left map right";
    padding-block:12px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    background:radial-gradient(1200px 500px at 50% -10%, color-mix(in srgb, var(--sodium) 7%, transparent), transparent 70%), var(--ink);}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; font-weight:700; font-size:14px;
    border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text);
    padding:8px 12px; min-height:38px; cursor:pointer; user-select:none; touch-action:manipulation;}
  .btn:hover{border-color:var(--muted);}
  .btn:focus-visible{outline:2px solid var(--sodium); outline-offset:2px;}
  .btn:disabled{opacity:.4; cursor:default;}
  .btn.go{background:var(--sodium); border-color:var(--sodium); color:var(--on-sodium); box-shadow:0 0 18px color-mix(in srgb, var(--sodium) 30%, transparent);}
  .btn.ghost{background:transparent;}
  .btn.sm{min-height:30px; padding:5px 9px; font-size:13px;}
  .btn .badge{font:700 11px var(--f-mono); background:var(--bad); color:#fff; border-radius:999px; padding:0 6px; line-height:17px;}

  /* ---------- horný pás ---------- */
  .bar{grid-area:bar; display:flex; align-items:center; gap:10px 20px; flex-wrap:wrap; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:8px 14px;}
  .brand{font:800 28px/1 var(--f-display); letter-spacing:.05em; text-transform:uppercase;}
  .brand b{color:var(--sodium); text-shadow:0 0 18px color-mix(in srgb, var(--sodium) 45%, transparent);}
  .brand small{display:block; font:600 10px var(--f-mono); letter-spacing:.12em; color:var(--muted); margin-top:4px;}
  .k{font:600 10px var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
  .clock{font:800 30px/1 var(--f-display); font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:8px;}
  .live{width:9px; height:9px; border-radius:50%; background:var(--bad); box-shadow:0 0 10px var(--bad); animation:blink 1.2s steps(2,start) infinite;}
  .app:not([data-mode="play"]) .live{visibility:hidden;}
  @keyframes blink{to{opacity:.25;}}
  .track{height:6px; background:var(--line); border-radius:3px; overflow:hidden;}
  .track i{display:block; height:100%; width:0; background:var(--sodium); border-radius:3px; transition:width .3s;}
  .lvl{display:grid; gap:5px; width:150px;}
  .lvl .v{font:800 18px/1 var(--f-display); letter-spacing:.04em; text-transform:uppercase;}
  .stat .v{font:800 26px/1.05 var(--f-display); font-variant-numeric:tabular-nums;}
  .rep{width:120px; display:grid; gap:6px;}
  .rep .track{height:9px;}
  .rep .track i{background:var(--good); box-shadow:0 0 10px var(--good);}
  .rep.low .track i{background:var(--bad); box-shadow:0 0 10px var(--bad);}
  .spacer{flex:1;}
  .ctrl{display:flex; gap:6px; flex-wrap:wrap;}

  /* ---------- bočné panely ---------- */
  .rail{background:var(--panel); border:1px solid var(--line); border-radius:12px; min-height:0; overflow:auto;
    padding:12px; display:flex; flex-direction:column; gap:16px; overscroll-behavior:contain;}
  .rail-left{grid-area:left;} .rail-right{grid-area:right;}
  .sec{display:grid; gap:8px; min-width:0;}
  .sec h2{font:800 17px/1 var(--f-display); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0; display:flex; align-items:center; gap:8px;}
  .count{font:600 11px var(--f-mono); letter-spacing:0; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--text);}
  .empty{margin:0; color:var(--muted); font-size:14px;}
  .row{display:flex; align-items:center; gap:8px; min-width:0;}
  .grow{flex:1; min-width:0;}

  .call{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; display:grid; gap:9px;}
  .call.ring{border-color:var(--sodium); animation:ring 1s ease-in-out infinite;}
  .call.ring .phone{color:var(--sodium); animation:wiggle .5s ease-in-out infinite; display:inline-flex;}
  @keyframes ring{50%{box-shadow:0 0 0 3px color-mix(in srgb, var(--sodium) 30%, transparent), 0 0 24px color-mix(in srgb, var(--sodium) 25%, transparent);}}
  @keyframes wiggle{25%{transform:rotate(-14deg);}75%{transform:rotate(14deg);}}
  .call.talk{border-color:var(--sodium); background:linear-gradient(180deg, color-mix(in srgb, var(--sodium) 9%, var(--card)), var(--card));}
  .call.shake{animation:shake .35s;}
  @keyframes shake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .lbl{font:600 11px var(--f-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--sodium); display:flex; align-items:center; gap:7px;}
  .wave{display:inline-flex; align-items:center; gap:2px; height:14px;}
  .wave i{width:3px; height:100%; background:var(--sodium); border-radius:2px; animation:wave .9s ease-in-out infinite;}
  .wave i:nth-child(2){animation-delay:-.2s;} .wave i:nth-child(3){animation-delay:-.45s;} .wave i:nth-child(4){animation-delay:-.65s;} .wave i:nth-child(5){animation-delay:-.3s;}
  @keyframes wave{0%,100%{transform:scaleY(.25);}50%{transform:scaleY(1);}}
  .quote{margin:0; font-size:16px; line-height:1.45;}
  .quote::before{content:"„";} .quote::after{content:"“";}
  .addr{font:500 12px var(--f-mono); color:var(--muted);}
  .call>.row>.lbl{flex:0 0 auto; white-space:nowrap;} .call>.row>.addr{flex:1 1 0; min-width:0; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* rozhovor s volajúcim */
  .log{display:grid; gap:6px; max-height:230px; overflow:auto; overscroll-behavior:contain;}
  .m{margin:0; padding:7px 10px; border-radius:10px; font-size:15px; line-height:1.4; max-width:92%;}
  .m.c{justify-self:start; background:color-mix(in srgb, var(--sodium) 9%, var(--ink)); border:1px solid color-mix(in srgb, var(--sodium) 28%, transparent);}
  .m.op{justify-self:end; background:var(--line); color:#c7d1e3; font-size:13px;}
  .m.sys{justify-self:center; padding:0; font:600 11px var(--f-mono); color:var(--muted);}
  .m.typing{display:flex; gap:4px; align-items:center; padding:10px 12px;}
  .m.typing i{width:6px; height:6px; border-radius:50%; background:var(--sodium); animation:dot 1s infinite;}
  .m.typing i:nth-child(2){animation-delay:.15s;} .m.typing i:nth-child(3){animation-delay:.3s;}
  @keyframes dot{50%{opacity:.25; transform:translateY(-2px);}}
  .qs{display:flex; flex-wrap:wrap; gap:6px;}
  .qs .btn{font-size:13px; font-weight:600; padding:6px 9px; min-height:34px; border-style:dashed;}
  .qs .btn kbd{margin-left:2px;}
  .qs .btn:disabled{opacity:.35;}
  .qs .btn.hint{border-color:var(--sodium); box-shadow:0 0 12px color-mix(in srgb, var(--sodium) 30%, transparent);}
  .qs .btn.interp{border-style:solid; border-color:var(--s6); color:var(--s6);}
  .chip{font:600 10px var(--f-mono); letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:999px; background:var(--s6); color:var(--ink); white-space:nowrap;}
  .chip.warn{background:var(--p2);} .chip.crit{background:var(--bad); color:#fff;}
  .harm{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:8px; font-size:13px;}
  .harm .hm{height:6px; background:var(--line); border-radius:3px; overflow:hidden;} .harm .hm i{display:block; height:100%; background:var(--muted);}
  .harm.t1 .hm i{background:var(--p2);} .harm.t2 .hm i, .harm.t3 .hm i{background:var(--bad);} .harm.t2 b, .harm.t3 b{color:var(--bad);}
  .notes{margin:0;}
  .qs.fq .btn{border-style:solid; border-color:color-mix(in srgb, var(--s6) 45%, var(--line));}
  .brief{display:grid; gap:3px;} .brief ul{margin:0; padding-left:18px; font-size:13px; color:var(--text); display:grid; gap:2px;}
  .fa{display:grid; gap:6px; border-top:1px solid var(--line); padding-top:8px;}
  .fahead{display:flex; align-items:center; gap:8px; background:none; border:0; padding:2px 0; cursor:pointer; text-align:left;}
  .fahead .k{flex:1; color:var(--sodium);} .fahead .chev{color:var(--muted); font-size:12px;}
  .faopts{display:grid; gap:5px;}
  .faopt{display:grid; grid-template-columns:18px minmax(0,1fr); gap:8px; align-items:start; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 9px; color:var(--text); font-size:13px; line-height:1.35; cursor:pointer;}
  .faopt:hover:not(:disabled){border-color:var(--muted);}
  .faopt i{width:16px; height:16px; border:1.5px solid var(--muted); border-radius:4px; display:grid; place-items:center; font-style:normal; font-size:11px; font-weight:800; margin-top:1px;}
  .faopt.ok{border-color:color-mix(in srgb, var(--good) 55%, transparent);} .faopt.ok i{background:var(--good); border-color:var(--good); color:#06281a;}
  .faopt.bad{border-color:color-mix(in srgb, var(--bad) 55%, transparent);} .faopt.bad i{background:var(--bad); border-color:var(--bad); color:#fff;}
  .faopt:disabled{cursor:default;} .faopt:disabled:not(.ok):not(.bad){opacity:.5;}
  .fareply{font-size:13px;} .fareply.bad{border-color:color-mix(in srgb, var(--bad) 50%, transparent);} .sub.warnt{color:var(--bad); font-weight:600;}
  .declist{margin:0; padding:0; list-style:none; display:grid; gap:4px; font-size:14px;} .declist b{color:var(--bad); font-variant-numeric:tabular-nums; margin-right:4px;}
  .locate{display:grid; gap:8px; padding:10px; border-radius:10px; border:1px dashed var(--sodium); background:color-mix(in srgb, var(--sodium) 7%, transparent);}
  .locate p{margin:0;}
  /* prevoz pacienta */
  .trans{background:var(--card); border:1px solid var(--s5); border-left:5px solid var(--s5); border-radius:10px; padding:9px 10px; display:grid; gap:7px;}
  .trans .hosps{display:grid; gap:5px;}
  .trans .hosps .btn{justify-content:space-between; font-size:13px; padding:6px 9px; min-height:36px; text-align:left;}
  .trans .hosps .btn .sub{font:600 11px var(--f-mono);}
  .trans .hosps .btn.rec{border-color:var(--sodium); box-shadow:0 0 12px color-mix(in srgb, var(--sodium) 25%, transparent);}
  /* vybraná posádka */
  .usel{background:var(--card); border:1px solid var(--sodium); border-radius:12px; padding:10px; display:grid; gap:8px;}
  .usel .acts .btn{font-size:12px; min-height:32px; padding:5px 9px;}
  /* čipy na mape */
  .mapchips{display:none; flex-wrap:wrap; gap:6px;}
  .mchip{display:inline-flex; align-items:center; gap:6px; font:600 12px var(--f-mono); padding:5px 10px; border-radius:999px; border:1px solid var(--line);
    background:color-mix(in srgb, var(--panel) 92%, transparent); color:var(--text); cursor:pointer;}
  .mchip.on{border-color:var(--sodium); color:var(--sodium);}
  .mchip.warn{border-color:var(--p2); color:var(--p2);} .mchip.bad{border-color:var(--bad); color:var(--bad);}
  .mchip i{width:8px; height:8px; border-radius:50%; background:currentColor; display:inline-block;}
  .mchip .ico{width:14px; height:14px;}
  .major{background:color-mix(in srgb, var(--bad) 12%, var(--card)); border:1px solid var(--bad); border-radius:12px; padding:10px; display:grid; gap:8px;}
  .major .grade{font-size:20px; color:var(--bad);}
  .inc .chip.mu, .disp .chip.mu{background:var(--bad); color:#fff;}
  .call.repeat{border-color:var(--p2);}
  /* rádio */
  .mapfoot{position:absolute; left:10px; bottom:44px; z-index:3; display:grid; gap:6px; justify-items:start; max-width:min(62%,520px); pointer-events:none;}
  .mapfoot .mapchips{pointer-events:auto;}
  .radio{display:grid; gap:4px;}
  .barchips{display:flex; flex-wrap:wrap; gap:6px; max-width:420px;}
  .rm{background:color-mix(in srgb, var(--panel) 92%, transparent); border:1px solid var(--line); border-left:3px solid var(--s6); border-radius:8px; padding:5px 9px; font-size:12px; animation:hin .2s ease-out;}
  .rm b{font:700 11px var(--f-mono); color:var(--s6); margin-right:4px;}
  .rm.bad{border-left-color:var(--bad);} .rm.bad b{color:var(--bad);}
  .rm.good{border-left-color:var(--good);} .rm.good b{color:var(--good);}
  .cls{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .cls .btn{justify-content:flex-start; text-align:left; border-left:4px solid var(--tc); font-size:13px; padding:7px 8px; gap:6px;}
  .cls .btn .ico{color:var(--tc);}
  .cls .btn kbd{margin-left:auto;}
  .cls .btn.hint{box-shadow:inset 0 0 0 1px var(--tc), 0 0 14px color-mix(in srgb, var(--tc) 35%, transparent);}

  .inc{background:var(--card); border:1px solid var(--line); border-left:5px solid var(--pc); border-radius:10px; padding:9px 10px; cursor:pointer; display:grid; gap:6px;}
  .inc:hover{border-color:var(--muted); border-left-color:var(--pc);}
  .inc.sel{border-color:var(--sodium); border-left-color:var(--pc); box-shadow:0 0 16px color-mix(in srgb, var(--sodium) 18%, transparent);}
  .inc .ico, .disp .ico{color:var(--pc);}
  .prio{font:700 11px var(--f-mono); padding:1px 6px; border-radius:5px; background:var(--pc); color:var(--ink); flex:none;}
  .ttl{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .timer{font:600 12px var(--f-mono); font-variant-numeric:tabular-nums; flex:none;}
  .needs{display:flex; flex-wrap:wrap; gap:4px;}
  .need{font:600 11px var(--f-mono); padding:1px 7px; border-radius:999px; border:1px dashed var(--muted); color:var(--muted);}
  .need.way{border-style:solid; border-color:var(--s3); color:var(--s3);}
  .need.on{border-style:solid; border-color:var(--good); background:var(--good); color:var(--ink);}
  .tbar{height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
  .tbar i{display:block; height:100%; background:var(--pc, var(--sodium));}
  .tbar.work i{background:var(--good);}

  .disp{background:var(--card); border:1px solid var(--sodium); border-radius:12px; padding:12px; display:grid; gap:10px; box-shadow:0 0 22px color-mix(in srgb, var(--sodium) 14%, transparent);}
  .disp .quote{font-size:14px; color:var(--muted);}
  .cand{display:grid; grid-template-columns:auto auto minmax(0,1fr) auto auto; align-items:center; gap:8px; font-size:14px;}
  .tag{font:700 11px var(--f-mono); padding:2px 6px; border-radius:5px; background:var(--sc); color:var(--ink); white-space:nowrap;}
  .eta{font:600 12px var(--f-mono); color:var(--muted); white-space:nowrap;}
  .sub{font-size:12px; color:var(--muted); font-weight:400;}
  .keys{margin:0; font-size:12px; color:var(--muted);}

  .unit{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:3px 10px; align-items:center; padding:8px 10px;
    background:var(--card); border:1px solid var(--line); border-left:4px solid var(--sc); border-radius:10px; cursor:pointer;}
  .unit:hover{border-color:var(--muted); border-left-color:var(--sc);}
  .unit.sel{border-color:var(--sodium); border-left-color:var(--sc);}
  .unit .veh{min-width:30px; height:32px; padding:0 6px; display:grid; place-items:center; border-radius:8px; background:color-mix(in srgb, var(--sc) 18%, transparent); color:var(--sc);}
  .unit .veh .ico{width:22px; height:22px;}
  .vimg{display:block; height:22px; width:auto; max-width:78px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));}
  .usel .veh{display:grid; place-items:center; height:30px;}
  .cand .vimg{height:16px; max-width:56px;}
  .hero{display:block; width:100%; height:auto; aspect-ratio:1280/360; border-radius:12px; border:1px solid var(--line); background:#1a2029; object-fit:cover;}
  .unit .nm{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .unit .st{font:600 11px var(--f-mono); color:var(--sc); white-space:nowrap;}
  .unit .what{grid-column:1/-1; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .unit .send{font:700 11px var(--f-mono); color:var(--on-sodium); background:var(--sodium); border-radius:5px; padding:1px 6px;}

  /* ---------- 3D mapa ---------- */
  .mapbox{grid-area:map; position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#070d19; min-height:0;}
  #map{display:block; width:100%; height:100%; touch-action:none; outline:none;}
  .labels{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  .l3{position:absolute; left:0; top:0; white-space:nowrap; will-change:transform;}
  .l3.town{font:800 13px/1 var(--f-display); letter-spacing:.08em; text-transform:uppercase; color:var(--text);
    text-shadow:0 1px 3px #000, 0 0 8px #000; transform-origin:50% 100%;}
  .l3.town.big{font-size:18px; color:var(--sodium);}
  .l3.poi{font:600 10px var(--f-mono); color:#d9e3f2; text-shadow:0 1px 2px #000, 0 0 6px #000;}
  .l3.poi::before{content:"▲ "; color:var(--t-mountain);}
  .l3.poi.lake::before{content:"≈ "; color:var(--s6);} .l3.poi.industry::before{content:"■ "; color:var(--t-hazmat);} .l3.poi.border::before{content:"⬥ "; color:var(--muted);}
  .l3.hosp{font:800 11px/1 var(--f-display); background:#fff; color:var(--bad); border-radius:3px; padding:2px 3px; box-shadow:0 0 10px color-mix(in srgb, var(--bad) 60%, transparent);}
  .l3.unit{pointer-events:auto; cursor:pointer; font:700 10px/1 var(--f-mono); color:var(--ink); background:var(--sc); border-radius:4px; padding:2px 5px; box-shadow:0 1px 4px rgba(0,0,0,.6);}
  .l3.unit.sel{outline:2px solid var(--sodium);}
  .l3.inc{pointer-events:auto; cursor:pointer; display:flex; align-items:center; gap:5px; font:700 11px/1 var(--f-mono); color:var(--text);
    background:color-mix(in srgb, var(--ink) 88%, transparent); border:1px solid var(--pc); border-radius:6px; padding:3px 6px; box-shadow:0 0 14px color-mix(in srgb, var(--pc) 45%, transparent);}
  .l3.inc .ico{width:14px; height:14px; color:var(--pc);}
  .l3.inc.sel{outline:2px solid var(--sodium);}
  .l3.inc.met{border-color:var(--good);}
  .l3.inc.lost{border-style:dashed; border-color:var(--sodium); box-shadow:0 0 14px color-mix(in srgb, var(--sodium) 45%, transparent);}
  .l3.fx{font:800 22px/1 var(--f-display); text-shadow:0 2px 6px #000; animation:rise 1.6s ease-out forwards;}

<script>
"use strict";
/* ============================================================
   Linka 112 — Košický kraj
   Hra na dispečera integrovaného záchranného systému: zdvíhaš hovory
   na linku 112, určíš druh udalosti a riadiš posádky po 3D mape kraja.
   Za zásahy získavaš skúsenosti a odomykáš nové posádky a schopnosti.
   1 sekunda = pol minúty hry (pri rýchlosti ×1).
   ============================================================ */

/* ---------- pomocné funkcie ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a+(b-a)*t;
const rand = (a,b) => a+Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const pad = n => String(n).padStart(2,'0');
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
/* náhoda pre hovory a udalosti – v dennej výzve má pevné semienko, aby všetci dostali rovnaké hovory */
let CR=Math.random, WR=Math.random;   // CR: hovory, WR: počasie a mimoriadne udalosti
const cr=(a,b)=>a+CR()*(b-a), cpick=a=>a[Math.floor(CR()*a.length)];
const wr=(a,b)=>a+WR()*(b-a), wpick=a=>a[Math.floor(WR()*a.length)];
const hashStr = t => { let h=2166136261; for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; };
function rng(seed){ return () => { seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15, 1|seed); t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- ikony ---------- */
const svg = (body, fill) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="${fill?'currentColor':'none'}" stroke="${fill?'none':'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;

function heightKm(x,z){
  if(DEM.length!==DEM_W*DEM_H) return heightProc(x,z);
  const gx=clamp(x+167,0,DEM_W-1.001), gz=clamp(z+113,0,DEM_H-1.001), i=Math.floor(gx), j=Math.floor(gz), fx=gx-i, fz=gz-j, k=j*DEM_W+i;
  const h=lerp(lerp(DEM[k],DEM[k+1],fx), lerp(DEM[k+DEM_W],DEM[k+DEM_W+1],fx), fz);
  return Math.max(.02, h/1000);
}
/* náhradný vymyslený reliéf (keby výškové dáta chýbali) */
function heightProc(x,z){
  let h=.12;
  for(const m of HILLS_XZ){ const dx=(x-m.x)/m.rx, dz=(z-m.z)/m.rz; h+=m.h*Math.exp(-(dx*dx+dz*dz)*1.4); }
  const low=Math.exp(-((x-LOW.x)**2+(z-LOW.z)**2)/(2*28*28));
  h += (fbm(x*.07+11, z*.07+5)-.45)*.38*(1-low*.85) + (fbm(x*.25, z*.25)-.5)*.06;
  h = lerp(h, .08, low*.75);
  const rd=riverDist(x,z); h -= .09*Math.exp(-((rd/1.6)**2));
  for(const l of LAKES_XZ){ const q=inLake(x,z,l); if(q<1.6) h=lerp(h, Math.min(h,.06), clamp(1.6-q,0,1)); }
  return Math.max(.02, h);
}
function groundY(x,z){ return heightKm(x,z)*EXAG; }

/* ---------- graf ciest ---------- */
const NODES={};   // id → {id,name,x,z,y,type,loc,pop,poi}
for(const [id,name,lo,la,pop,loc] of TOWNS){ const p=proj(lo,la); NODES[id]={id,name,...p,type:'town',pop,loc,r:clamp(.5+Math.sqrt(pop)/170,.6,3.4)}; }
for(const [id,name,lo,la,loc,kind] of WAYPOINTS){ const p=proj(lo,la); NODES[id]={id,name,...p,type:'wp',loc,poi:kind}; }
for(const [id,name,lo,la] of STATIONS){ const p=proj(lo,la); NODES[id]={id,name,...p,type:'st',loc:'v Košiciach'}; }
for(const [id,name,lo,la,loc,kind] of POIS){ const p=proj(lo,la); NODES[id]={id,name,...p,type:'poi',loc,poi:kind}; }
for(const n of Object.values(NODES)) n.y=groundY(n.x,n.z);
const EDGES=ROADS.map(([a,b,t])=>{ const A=NODES[a], B=NODES[b]; return {a,b,t, len:Math.hypot(A.x-B.x,A.z-B.z)*(t==='T'?1.35:1.15)}; });
const ADJ={}; for(const id in NODES) ADJ[id]=[];
for(const e of EDGES){ ADJ[e.a].push([e.b,e]); ADJ[e.b].push([e.a,e]); }

/* ============================================================
   HERNÁ LOGIKA
   ============================================================ */
const wxSpeed = u => G && G.weather && !KINDS[u.kind].air ? WEATHER[G.weather].speed : 1;
const speedOf = u => KINDS[u.kind].speed/60 * (has('d_green') ? 1.15 : 1) * wxSpeed(u);          // km za minútu hry
/* dopravná špička v Košiciach spomalí cesty v okolí mesta */
const KE_EDGES=new Set(EDGES.filter(e=>[e.a,e.b].every(id=>Math.hypot(NODES[id].x-NODES.ke.x, NODES[id].z-NODES.ke.z)<11)));
const rushOn = () => G && G.rush && G.t<G.rush;
const trailSpeed = u => (KINDS[u.kind].trail||8)/60 * (has('s_quad') ? 1.5 : 1);
function edgeSpeed(u, e){ return e.t==='T' ? trailSpeed(u) : speedOf(u)*(e.t==='M' ? 1.15 : 1)*(rushOn() && KE_EDGES.has(e) ? .6 : 1); }
const canUse = (u, e) => e.t!=='T' || u.kind==='HZS';
/* najrýchlejšie cesty pre daný druh posádky (čas v minútach hry) */
function dijkstra(src, u){ return dijkstraFrom({[src]:0}, u); }
function dijkstraFrom(init, u){
  const d={}, prev={}, done=new Set();
  for(const id in NODES) d[id]=init[id]===undefined ? Infinity : init[id];
  for(;;){
    let best=null, bv=Infinity;
    for(const id in d) if(!done.has(id) && d[id]<bv){ bv=d[id]; best=id; }
    if(best==null) break;
    done.add(best);
    for(const [v,e] of ADJ[best]) if(canUse(u,e)){ const nd=d[best]+e.len/edgeSpeed(u,e); if(nd<d[v]){ d[v]=nd; prev[v]=best; } }
  }
  return {d, prev};
}
function pathFor(u, from, to){
  if(from===to) return [];
  const {d,prev}=dijkstra(from, u);
  if(d[to]===Infinity) return null;
  const p=[]; for(let v=to; v!==from; v=prev[v]) p.push(v);
  return p.reverse();

function setStatus(u, s){ u.status=s; u.since=G.t; dirty(); }
/* trasa k uzlu a prípadne ďalej mimo cesty k presnému miestu */
function routeTo(u, node, dest){

  if(KINDS[u.kind].air){ u.path=[]; u.dest=dest || {x:n.x, z:n.z}; u.destNode=node; u.moving=true; return; }
  const from = u.path.length ? u.path[0] : u.node;
  const rest = pathFor(u, from, node) || [];

function goHome(u){ u.inc=null; setStatus(u,1); routeTo(u, u.post || u.home); }
/* pokrytie: za koľko minút dorazí najbližšia voľná záchranka do každej obce */
const COV={}; let COVPCT=100, covAt=-9, covShow=false;
const AMB_KINDS=['RZP','RLP','LZS'];
function computeCoverage(){
  const free=G.units.filter(u=>AMB_KINDS.includes(u.kind) && (u.status===1 || u.status===2) && !u.temp);
  const init={}, ground=free.filter(u=>!KINDS[u.kind].air);
  for(const u of ground){ const from=u.path.length ? u.path[0] : u.node, t=Math.hypot(NODES[from].x-u.x, NODES[from].z-u.z)/speedOf(u); if(init[from]===undefined || t<init[from]) init[from]=t; }

  for(const n of Object.values(NODES)) if(n.type==='town'){
    let t=d[n.id]===undefined ? Infinity : d[n.id];
    for(const u of air) t=Math.min(t, Math.hypot(n.x-u.x, n.z-u.z)/speedOf(u)+LAUNCH);

  if(G.mode==='play'){ G.stats.covSum+=COVPCT; G.stats.covN++; }

/* najhoršie pokryté obce – návrhy na presun posádky do zálohy */
function standbyTargets(u){
  return Object.values(NODES).filter(n=>n.type==='town' && n.id!==u.node && n.id!==u.post && COV[n.id]>11)
    .sort((a,b)=>(COV[b.id]-10)*Math.sqrt(b.pop)-(COV[a.id]-10)*Math.sqrt(a.pop)).slice(0,3);
}
function postUnit(u, node){
  if(!u || !(u.status===1 || u.status===2) || u.temp) return;
  u.post = node===u.home ? null : node;

const LAUNCH=4;
const heliOK = () => !G || !G.weather || WEATHER[G.weather].heli;   // vrtuľník potrebuje pár minút na štart
function moveUnit(u, dt){
  const air=KINDS[u.kind].air;
  if(air && u.launch && G.t<u.launch) return;
  let rem=dt;
  while(rem>1e-6){
    let tx, tz, sp;
    if(u.path.length){
      const n=NODES[u.path[0]]; tx=n.x; tz=n.z;
      const from=u.node, e=ADJ[from] && ADJ[from].find(([v])=>v===u.path[0]);

/* zostávajúci čas jazdy (minúty hry) */
function etaPath(u){
  let t=0, px=u.x, pz=u.z, from=u.node;

  if(u.dest) t+=Math.hypot(u.dest.x-px,u.dest.z-pz)/(KINDS[u.kind].air ? speedOf(u) : speedOf(u)*.6);

/* odhad dojazdu posádky k udalosti */
function etaTo(u, inc, cache){
  if(KINDS[u.kind].air) return Math.hypot(inc.x-u.x, inc.z-u.z)/speedOf(u) + (u.status===2 ? LAUNCH : Math.max(0,(u.launch||0)-G.t));
  const key=u.kind;   // každý druh má inú rýchlosť
  if(!cache[key]) cache[key]=dijkstra(inc.node, u).d;
  const from=u.path.length ? u.path[0] : u.node, d=cache[key][from];
  if(d===Infinity) return Infinity;
  const n=NODES[inc.node];
  return Math.hypot(NODES[from].x-u.x, NODES[from].z-u.z)/speedOf(u) + d + Math.hypot(inc.x-n.x, inc.z-n.z)/(speedOf(u)*.6);
}
function arrived(u){
  if(u.status===3){
    const inc=incById(u.inc);
    if(!inc){ goHome(u); return; }
    if(u.wrongTrip){
      u.wrongTrip=false;
      if(!needKinds(inc).has(u.kind)){ if(!quiet()) radio(u, 'Sme na mieste, ale na toto nie sme vybavení. Vraciame sa.', 'bad'); inc.units=inc.units.filter(x=>x!==u.id); goHome(u); return; }
    }
    setStatus(u,4);
    if(inc.prank){ wasted(inc); return; }
    if(inc.hidden && inc.hidden.length){
      for(const x of inc.hidden){ inc.needs.push(x.need); radio(u, 'Sme na mieste. '+x.rep, 'bad'); }
      inc.hidden=[]; inc.deadline=Math.max(inc.deadline, G.t+14); G.score-=20; G.stats.missed=(G.stats.missed||0)+1;
      say('#'+inc.no+': posádka hlási viac, ako si zistil pri hovore. Pošli ďalšiu pomoc. −20', 'bad');
    } else if(!inc.saidArrive && !quiet() && Math.random()<.5){ radio(u, ARRIVE[inc.cat]||'Sme na mieste.'); }
    inc.saidArrive=true;
    SND.blip();
  } else if(u.status===5){
    if(!u.hospId) return;
    const H=HOSP.find(h=>h.id===u.hospId); if(H){ H.pat=(H.pat||[]).filter(t=>t>G.t); H.pat.push(G.t+50); }
    setStatus(u,6); u.waitUntil=G.t+4+(u.secondary ? 12 : 0);
    if(quiet()){}
    else if(u.secondary){ dec('secondary'); radio(u, 'Pacient odovzdaný – '+u.hosp+', ale nemajú tu '+SPEC_ACC[u.pt]+'. Prevážame ho ďalej do centra, budeme mimo prevádzky o 12 min dlhšie.', 'bad'); }
    else radio(u, 'Pacient odovzdaný – '+u.hosp+'.', 'good');
  }
  else if(u.status===1){ u.blame=null; setStatus(u,2); }
}
/* zodpovedá posádka danej potrebe? (napr. 'RZP|LZS') */
const fits = (u, need) => need.split('|').includes(u.kind);
const needKinds = inc => new Set(inc.needs.flatMap(n=>n.split('|')));
const dispatchable = (u, inc) => (u.status===1 || u.status===2 || u.status===3) && u.inc!==inc.id;
function dispatch(u, inc){
  if(!u || !inc || !running()) return;
  if(inc.lost){ say('Najprv urči, kde volajúci je – ťukni na mapu v žltom kruhu.'); return; }
  if(!dispatchable(u, inc)){ say(u.inc===inc.id ? u.name+' už ide na túto udalosť.' : u.name+' je teraz obsadená ('+STATUS[u.status].toLowerCase()+').'); return; }
  if(KINDS[u.kind].air && u.status===2 && !heliOK()){ say('Vrtuľník pre počasie ('+WEATHER[G.weather].label.toLowerCase()+') nemôže vzlietnuť.', 'bad'); return; }
  if(!KINDS[u.kind].air && pathFor(u, u.path.length ? u.path[0] : u.node, inc.node)===null){ say(u.name+' sa tam nedostane – vedie tam len chodník pre horskú službu.','bad'); return; }
  judgeDispatch(u, inc);
  if(u.inc){ const old=incById(u.inc); if(old) old.units=old.units.filter(x=>x!==u.id); }
  u.inc=inc.id; if(!inc.units.includes(u.id)) inc.units.push(u.id);
  if(KINDS[u.kind].air && u.status===2) u.launch=G.t+LAUNCH;
  setStatus(u,3);
  routeTo(u, inc.node, {x:inc.x, z:inc.z});
  if(inc.prio===1 && G.t-(G.lastSiren||-9)>3){ G.lastSiren=G.t; SND.siren(); } else SND.blip();
}
/* hodnotenie vyslania – zlé rozhodnutie má dopad na udalosť, na posádku aj na zvyšok kraja */
const dec = (k, n=1) => { const d=G.stats.dec=G.stats.dec||{}; d[k]=(d[k]||0)+n; };
const blame = (u, type, inc) => { if(!u.blame) u.blame={type, no:inc.no, id:inc.id, prio:inc.prio}; };
function note(inc, text){ (inc.notes=inc.notes||[]).push(text); if(inc.notes.length>3) inc.notes.shift(); dirty(); }
function judgeDispatch(u, inc){
  const old=u.status===3 && u.inc && u.inc!==inc.id ? incById(u.inc) : null;
  const wasNeeded=old && needInfo(old).slots.some(s=>s.u===u);
  u.blame=null; u.late=null; u.wrongTrip=false;
  if(quiet() || inc.prank) return;
  /* stiahnutie posádky z cesty k vážnejšiemu prípadu */
  if(old && wasNeeded && old.prio<inc.prio && !old.metAt){
    old.harm=(old.harm||0)+HARM_MIN[old.prio]*5; note(old, u.name+' stiahnutá k menej vážnemu #'+inc.no);
    G.score-=30; G.rep-=repLoss(3); dec('pulled'); comboBreak();
    say(u.name+' išla na P'+old.prio+' #'+old.no+' – stiahol si ju k menej vážnemu prípadu. Pacient na #'+old.no+' čaká dlhšie. −30, −3 dôvery', 'bad'); checkRep();
  }
  const miss=needInfo(inc).missing, fit=miss.filter(n=>fits(u,n));
  if(!fit.length){
    if((inc.hidden||[]).some(x=>fits(u, x.need))) return;   // tušil si, čo volajúci nepovedal
    inc.extra=(inc.extra||0)+1;
    if(!needKinds(inc).has(u.kind)){
      u.wrongTrip=true; comboBreak();
      if(KINDS[u.kind].air && inc.prio>1){
        blame(u,'overkill',inc); G.score-=40; G.rep-=repLoss(2); dec('overkill');
        say('Vrtuľník k „'+inc.title.toLowerCase()+'“? Stačí sanitka. Let je drahý a vrtuľník teraz chýba pri vážnych prípadoch – na mieste sa otočí. −40, −2 dôvery', 'bad');
      } else {
        blame(u,'wrong',inc); G.score-=25; G.rep-=repLoss(2); dec('wrong');
        say(u.name+' sa na „'+inc.title.toLowerCase()+'“ nehodí – '+(u.kind==='RV' ? 'lekár v osobnom aute pacienta neodvezie, treba sanitku' : 'nemá na to výbavu ani výcvik')+'. Zbytočná jazda tam a späť. −25, −2 dôvery', 'bad');
      }
      checkRep();
    } else { G.score-=15; dec('extra'); say(u.name+' je navyše – udalosť ju nepotrebuje. −15', 'bad'); }
    return;
  }
  const mine=etaTo(u, inc, {}), cands=candidates(inc);
  /* bližšia vhodná posádka bola voľná → pomoc príde neskôr a pacientovi sa priťaží */
  let late=Infinity, best=null;
  for(const n of fit){
    let b=null; for(const c of cands) if(c.free && c.u!==u && fits(c.u,n) && (!b || c.eta<b.eta)) b=c;
    const d = b ? mine-b.eta : -Infinity;
    if(d<late){ late=d; best=b; }
  }
  if(best && late>3) inc.precise=false;
  if(best && late>LATE_TOL[inc.prio]){
    u.late={id:inc.id, min:late, harm:(late-LATE_TOL[inc.prio])*HARM_MIN[inc.prio]}; blame(u,'far',inc); dec('far');
    say('Bližšie bola '+best.u.name+' ('+fmtMin(best.eta)+' namiesto '+fmtMin(mine)+'). Pomoc príde o '+Math.round(late)+' min neskôr – '+(inc.prio===3 ? 'volajúci bude dlhšie čakať.' : 'stav sa môže zhoršiť.'), 'bad');
  }
  /* vážnejší prípad ešte čaká a táto posádka bola preň najlepšia */
  if(inc.prio>1) for(const o of G.incs){
    if(o===inc || o===old || o.prio>=inc.prio || o.lost || o.metAt || o.prank) continue;
    const on=needInfo(o).missing.filter(n=>fits(u,n)); if(!on.length) continue;
    const oc=candidates(o), me=oc.find(c=>c.u===u); if(!me) continue;
    const alt=oc.find(c=>c.free && c.u!==u && on.some(n=>fits(c.u,n)));
    if(!alt || alt.eta>me.eta+LATE_TOL[o.prio]){
      blame(u,'prio',inc); G.score-=20; G.rep-=repLoss(2); dec('prio'); comboBreak();
      note(o, u.name+' poslaná k menej vážnemu #'+inc.no);
      say('P'+o.prio+' #'+o.no+' '+o.title+' stále čaká a '+u.name+' bola preň najlepšia ('+fmtMin(me.eta)+'). Najprv najvážnejší prípad! −20, −2 dôvery', 'bad'); checkRep();
      break;
    }
  }
  /* lekár alebo vrtuľník na drobnosť */
  if(inc.prio===3 && !inc.needs.includes(DOC) && KINDS[u.kind].doc && cands.some(c=>c.free && c.u.kind==='RZP' && c.eta<=mine+5)){
    blame(u,'overkill',inc); G.score-=15; dec('overkill'); say('Lekára šetri na vážne prípady – RZP bola blízko. Ak teraz príde zástava srdca, lekár bude chýbať. −15', 'bad');
  }
  /* posledná voľná záchranka odchádza z okolia k drobnosti */
  if(inc.prio===3 && AMB_KINDS.includes(u.kind) && !KINDS[u.kind].air && !u.temp && mine>8){
    const h=homeCover(u);
    if(h>20){ blame(u,'gap',inc); dec('gap'); say('Pozor: '+u.name+' bola posledná voľná záchranka pre okolie – '+NODES[u.post||u.home].name+' teraz nemá pomoc '+(h===Infinity ? 'nablízku' : 'skôr ako za '+Math.round(h)+' min')+'. Ak tam príde vážny prípad, pôjde pomoc z ďaleka.', 'bad'); }
  }
}
/* za koľko minút by do miesta základne posádky prišla iná voľná záchranka */
function homeCover(u){
  const base=u.post||u.home, B=NODES[base], d=dijkstra(base, u).d;
  let t=Infinity;
  for(const v of G.units){
    if(v===u || !AMB_KINDS.includes(v.kind) || !(v.status===1 || v.status===2) || v.temp) continue;
    if(KINDS[v.kind].air){ if(heliOK()) t=Math.min(t, Math.hypot(B.x-v.x, B.z-v.z)/speedOf(v)+(v.status===2 ? LAUNCH : 0)); continue; }
    const from=v.path.length ? v.path[0] : v.node;
    if(d[from]!==undefined) t=Math.min(t, d[from]+Math.hypot(NODES[from].x-v.x, NODES[from].z-v.z)/speedOf(v));
  }
  return t;
}
/* nový vážny prípad: chýba pri ňom posádka, ktorú si predtým poslal zle? */
function consequences(inc, ghostBest){
  if(quiet() || inc.prank || inc.prio>2) return;
  for(const [need, gu, gEta] of ghostBest){
    if(!gu || !gu.blame || gu.status===1 || gu.status===2 || (KINDS[gu.kind].air && !heliOK())) continue;
    let real=Infinity; for(const c of candidates(inc)) if(c.free && fits(c.u, need)) real=Math.min(real, c.eta);
    if(real<=gEta+5) continue;
    const b=gu.blame; gu.blame=null;
    G.score-=20; G.rep-=repLoss(2); dec('conseq');
    note(inc, gu.name+' chýba – je na #'+b.no);
    say('Dôsledok rozhodnutia: k P'+inc.prio+' #'+inc.no+' by najrýchlejšie išla '+gu.name+', ale je na P'+b.prio+' #'+b.no+' ('+BLAME_L[b.type]+'). Pomoc pôjde '+(real===Infinity ? 'až keď sa niekto uvoľní' : 'o '+Math.round(real-gEta)+' min dlhšie')+'. −20, −2 dôvery', 'bad');
    fx(inc.x, inc.z, 'Chýba '+KINDS[gu.kind].short, 'bad'); checkRep();
    return;
  }
}
/* rada prvej pomoci volajúcemu: dobrá pomôže pacientovi aj získa čas, zlá mu ublíži */
function giveAid(inc, i){
  const f=inc && inc.fa, list=f && FA[inc.title], it=list && list[i];
  if(!it || f.given.includes(i) || inc.metAt || G.t<f.busy || !running()) return;
  aidEffect(inc, f, list, i);
  speak({id:'I'+inc.id, lang:'sk', vp:inc.vp, vr:inc.vr, vi:inc.vi, voiceSfx:inc.voiceSfx, textKey:inc.tpl && inc.tpl.texts && canonText(inc.tpl.texts[0]), tpl:inc.tpl}, it[2], it[2], it[1] ? 'ulava' : 'zdesenie');
}
function aidEffect(inc, f, list, i){
  const it=list[i];
  f.given.push(i); f.busy=G.t+1; f.last=it[2]; f.lastBad=!it[1];
  if(it[1]) inc.aidGood=(inc.aidGood||0)+1; else inc.aidBad=(inc.aidBad||0)+1;
  if(it[1]){
    inc.harm=Math.max(-.2, (inc.harm||0)-.08); inc.deadline+=FA_TIME[inc.prio]; G.score+=15; G.stats.faOk=(G.stats.faOk||0)+1;
    const got=f.given.filter(j=>list[j][1]).length;
    let msg='Dobrá rada – kým príde pomoc, volajúci pomáha. +15';
    if(inc.esc && got>=2){ inc.esc=null; msg='Prvá pomoc zabránila zhoršeniu stavu. +15'; }
    if(got===list.filter(x=>x[1]).length && got===f.given.length){ G.score+=25; msg='Volajúci urobil všetko správne – výborná prvá pomoc. +40'; }
    say('#'+inc.no+': '+msg, 'good'); SND.blip();
  } else {
    inc.harm=(inc.harm||0)+FA_HARM[inc.prio]; G.score-=30; G.rep-=repLoss(2); dec('aid'); comboBreak();
    note(inc, 'zlá rada: '+it[0][0].toLowerCase()+it[0].slice(1).replace(/\.$/,''));
    say('#'+inc.no+': zlá rada ublížila – '+it[3]+' −30, −2 dôvery', 'bad'); SND.bad(); checkRep();
  }
  dirty();
}
/* posádka na mieste zhodnotí, čo urobil volajúci podľa rád */
function aidReport(inc){
  if(!(inc.aidGood || inc.aidBad) || quiet()) return;
  const lead=inc.units.map(unitById).find(u=>u && u.inc===inc.id && u.status===4); if(!lead) return;
  const bad=!!inc.aidBad;
  radio(lead, bad ? 'Na mieste. To, čo volajúci urobil podľa pokynov z linky, situáciu zhoršilo.' : 'Na mieste. Volajúci postupoval podľa pokynov z linky, veľmi to pomohlo.', bad ? 'bad' : 'good');
}
/* stav udalosti: zdržania od posádok, ktoré k nej idú z ďaleka, sa prejavia pri príchode */
function harmOf(inc){
  let h=inc.harm||0; const seen=new Set();
  const mates=inc.units.map(unitById).filter(v=>v && v.inc===inc.id && (v.status===3 || v.status===4));
  for(const s of needInfo(inc).slots){
    const u=s.u; if(!u || seen.has(u) || !u.late || u.late.id!==inc.id) continue;
    seen.add(u);
    const eu=u.status===4 ? 0 : etaPath(u);
    if(mates.some(v=>v!==u && fits(v, s.need) && (v.status===4 || etaPath(v)<eu))) continue;   // bližšia posádka, ktorú si poslal dodatočne, to stihne skôr
    h+=u.late.harm;
  }
  return h;
}
const harmTier = (inc, h=inc.harm||0) => h<.2 ? 0 : h<.5 ? 1 : h<.85 || inc.prio>1 ? 2 : 3;
function applyLate(inc, info){
  for(const s of info.slots){
    const u=s.u; if(!u || !u.late || u.late.id!==inc.id) continue;
    inc.harm=(inc.harm||0)+u.late.harm; G.stats.lateMin=(G.stats.lateMin||0)+u.late.min;
    note(inc, 'zdržanie '+Math.round(u.late.min)+' min ('+u.name+')'); u.late=null;
  }
}
function needInfo(inc){
  const assigned=inc.units.map(unitById).filter(u=>u && u.inc===inc.id && (u.status===3 || u.status===4));
  const order=inc.needs.map((n,i)=>[n,i]).sort((a,b)=>a[0].split('|').length-b[0].split('|').length);
  const used=new Set(), slots=new Array(inc.needs.length);
  const shared=new Set();
  for(const st of [4,3]){
    for(const [need,i] of order){
      if(slots[i]) continue;
      const u=assigned.find(u=>u.status===st && !used.has(u.id) && fits(u,need));
      if(u){ used.add(u.id); slots[i]={need, st: st===4 ? 'on' : 'way', u}; }
    }
    shareDoc(inc, slots, shared);
  }
  for(let i=0;i<slots.length;i++) if(!slots[i]) slots[i]={need:inc.needs[i], st:'miss'};
  return {slots, met:slots.every(s=>s.st==='on'), missing:slots.filter(s=>s.st==='miss').map(s=>s.need)};
}
/* RLP a vrtuľník majú lekára aj prepravu: jedna posádka pokryje potrebu lekára aj jednej sanitky */
const BOTH=new Set(['RLP','LZS']);
function shareDoc(inc, slots, shared){
  for(let i=0;i<slots.length;i++) if(!slots[i]){
    const need=inc.needs[i], doc=need===DOC;
    const j=slots.findIndex((s,j)=>s && j!==i && BOTH.has(s.u.kind) && !shared.has(s.u.id) && (doc ? s.need!==DOC : s.need===DOC && fits(s.u, need)));
    if(j>=0){ shared.add(slots[j].u.id); slots[i]={...slots[j], need}; }
  }
}
function candidates(inc){
  const kinds=needKinds(inc), cache={};
  return G.units.filter(u=>kinds.has(u.kind) && dispatchable(u, inc) && !(KINDS[u.kind].air && u.status===2 && !heliOK()))
    .map(u=>({u, eta:etaTo(u, inc, cache), free:u.status!==3})).filter(c=>c.eta<Infinity)
    .sort((a,b)=>(b.free-a.free) || a.eta-b.eta);
}
function recommended(inc){
  const lc=new Map(), lastCover = c => {
    if(!AMB_KINDS.includes(c.u.kind) || KINDS[c.u.kind].air || c.u.temp || c.eta<=8) return false;
    if(!lc.has(c.u)) lc.set(c.u, homeCover(c.u)>20); return lc.get(c.u);
  };
  /* lekár ide na rad posledný: ak najbližšou sanitkou je RLP, lekára už netreba posielať zvlášť */
  const miss=needInfo(inc).missing.slice().sort((a,b)=>(a===DOC)-(b===DOC) || a.split('|').length-b.split('|').length), out=[], taken=new Set(), shared=new Set();
  const cands=candidates(inc).filter(c=>c.free);
  for(const need of miss){
    if(need===DOC){ const d=out.find(c=>BOTH.has(c.u.kind) && !shared.has(c.u.id)); if(d){ shared.add(d.u.id); continue; } }
    /* k drobnostiam (P3) radšej RZP než lekára, ak je RZP len o chvíľu ďalej, a nie poslednú záchranku z okolia */
    const cost = c => c.eta + (inc.prio===3 && need!==DOC && KINDS[c.u.kind].doc ? 6 : 0) + (inc.prio===3 && lastCover(c) ? 15 : 0);
    let c=null; for(const x of cands) if(!taken.has(x.u.id) && fits(x.u, need) && (!c || cost(x)<cost(c))) c=x;
    if(c){ taken.add(c.u.id); out.push(c); }
  }
  return out;
}
function sendRecommended(inc){
  if(inc.lost){ say('Najprv urči, kde volajúci je – ťukni na mapu v žltom kruhu.'); return; }
  const rec=recommended(inc);
  if(!rec.length){ say(needInfo(inc).missing.length ? 'Žiadna vhodná voľná posádka. Presmeruj inú alebo počkaj.' : 'Všetky potrebné posádky sú už na ceste.'); return; }
  for(const c of rec) dispatch(c.u, inc);
}

/* ---------- hovory ---------- */
const catOpen = c => !CATS[c].skill || has(CATS[c].skill);
const mspTowns = () => [...new Set(G.units.filter(u=>u.kind==='MSP').map(u=>u.home))];
function placeFor(tpl){
  const busy=new Set(G.incs.filter(i=>NODES[i.node].type!=='town').map(i=>i.node));
  const free = ids => { const f=ids.filter(id=>!busy.has(id)); return f.length ? f : ids; };
  const towns=Object.values(NODES).filter(n=>n.type==='town');
  const weightedTown = list => { let s=0; for(const n of list) s+=Math.sqrt(n.pop); let r=CR()*s; for(const n of list){ r-=Math.sqrt(n.pop); if(r<=0) return n.id; } return list[0].id; };
  if(G.ch && G.ch.focus && CR()<.65){
    const ok = id => tpl.place==='town' ? NODES[id].type==='town' : tpl.place==='msp' ? mspTowns().includes(id) : tpl.place==='lake' ? NODES[id].poi==='lake' : tpl.place==='mountain' ? NODES[id].poi==='mountain' : tpl.place==='river' ? NODES[id].type==='town' : false;
    const f=G.ch.focus.filter(ok); if(f.length) return cpick(f);
  }
  switch(tpl.place){
    case 'town': return weightedTown(towns);
    case 'msp': return cpick(mspTowns());
    case 'road': return cpick(free(['w_sl','w_ky','w_snm','w_ml','mo','tu','se','mg','me','ja','so','st']).concat(['ke','mi']));
    case 'forest': return cpick(free(['db','dd','gl','me','pl','tu','p_kh','p_vo','kr','so']));
    case 'river': return cpick(free(['vk','kc','mi','tv','mg','kr','rv','ct']));
    case 'lake': return cpick(free(['l_si','l_ru']));
    case 'border': return cpick(['w_ml','w_vn']);
    case 'mountain': return cpick(free(['p_sb','p_kl','p_vo','p_kh','p_zd','p_mo']));
    case 'cave': return cpick(free(['p_oc','p_dm']));
    default: return tpl.place;
  }
}
function addrOf(node){
  const n=NODES[node];
  if(n.type!=='town') return n.name;
  const st = node==='ke' ? cpick(KE_STREETS) : cpick(STREETS);

/* séria úspechov: násobí body */

function hospOptions(u){
  const air=KINDS[u.kind].air, d = air ? null : dijkstra(u.node, u).d;
  const eta = H => air ? Math.hypot(NODES[H.node].x-u.x, NODES[H.node].z-u.z)/speedOf(u) : d[H.node]+Math.hypot(NODES[u.node].x-u.x, NODES[u.node].z-u.z)/speedOf(u);
  const all=HOSP.map(H=>({H, eta:eta(H), match:hospMatch(H,u.pt), full:hospFull(H)})).filter(o=>o.eta<Infinity).sort((a,b)=>a.eta-b.eta);
  const pickd=[...all.filter(o=>o.match && u.pt!=='gen').slice(0,2), ...all.filter(o=>o.H.spec.includes('gen')).slice(0,2)];
  return [...new Set(pickd)].sort((a,b)=>a.eta-b.eta);
}

      else { u.secondary=true; G.rep-=repLoss(3); G.stats.badHosp=(G.stats.badHosp||0)+1; say('Pacienta ('+PT_L[u.pt]+') bude treba previezť do špecializovaného centra – '+u.name+' bude dlhšie mimo prevádzky. −3 dôvery', 'bad'); checkRep(); }
    }

}
function workRate(inc){
  let k=1;

  if(inc.cat==='med' && on.some(u=>KINDS[u.kind].doc)) k*=1/.75;   // lekár na mieste

function gainXP(x){

function resolve(inc){

  if(tier) pts=Math.round(pts*(tier===1 ? 1-inc.harm : .3));

  if(tier===2){ G.rep-=repLoss(3); comboBreak(); } else G.rep=Math.min(100, G.rep+(tier ? 1 : REP_OK[inc.prio]));

/* stav sa pre zdržania zhoršil natoľko, že pomoc prišla neskoro */
function lostVictim(inc){

/* ukážková služba v pozadí úvodnej obrazovky – hrá sama */
function demoBot(){

  G.bot=G.t+.9;

  if(talk && talk.kind==='repeat'){ calmCaller(talk); }
  else if(talk){ if(!talk.prank && !talk.asked.includes('hurt') && !talk.pend && !talk.silent) ask(talk,'hurt'); else if(!talk.pend && G.t-talk.talkAt>1.2) classify(talk, talk.prank ? 'prank' : talk.tpl.cat); }
  else { const r=G.calls.find(c=>c.state==='ring' && G.t-c.t0>1.5); if(r) answer(r); }
  for(const inc of G.incs){ if(inc.lost) inc.lost=null; for(const c of recommended(inc)) dispatch(c.u, inc); }
}
/* režim jednej udalosti: prípad je otvorený, kým trvá hovor, udalosť alebo čaká pacient na nemocnicu */
const caseOpen = () => G.calls.length>0 || G.incs.length>0 || G.units.some(u=>u.status===5 && !u.hospId);
function step(dt){
  G.t+=dt;
  if(G.single && caseOpen()) G.nextCall=Math.max(G.nextCall, G.t+(G.tempo==='busy' ? 1 : G.tempo==='calm' ? 4 : 2));
  if(G.t>=G.nextCall){
    spawnCall();
    const base=(G.ch && G.ch.rate ? G.ch.rate : lerp(15, 9, clamp(G.t/900,0,1)) * TEMPO[G.tempo].k) * (G.calls.length>=3 ? 1.6 : 1);
    G.nextCall=G.t + base*(.7+CR()*.6);
  }
  const P=patience();
  for(const c of [...G.calls]){
    if(c.state==='ring' && G.t-c.t0>RING*P){
      dropCall(c);
      if(c.kind==='repeat'){ G.rep-=repLoss(3); say('#'+c.inc+': volajúci znova volal a nikto nezdvihol. −3 dôvery', 'bad'); checkRep(); }
      else if(!c.prank){ G.rep-=repLoss(8); G.stats.hung++; comboBreak(); say('Volajúci zložil – nikto nezdvihol. −8 dôvery', 'bad'); SND.bad(); checkRep(); }
    } else if(c.state==='talk' && G.t-c.talkAt>TALK*P){
      dropCall(c);
      if(!c.prank && c.kind!=='repeat'){ G.rep-=repLoss(5); G.stats.hung++; say('Volajúci to vzdal – hovor trval príliš dlho. −5 dôvery', 'bad'); checkRep(); }
    }
  }
  if(!running()) return;
  for(const c of G.calls) stepCall(c);
  if(G.mode==='play') stepWorld();
  if(G.t-covAt>=1) computeCoverage();
  if(G.mode==='play' && G.t>=(G.covCheck||30)){
    G.covCheck=G.t+30;
    if(COVPCT>=90){ G.score+=50; G.rep=Math.min(100,G.rep+2); say('Kraj je dobre pokrytý záchrankami ('+COVPCT+' %). +50', 'good'); }
    else if(COVPCT<65){ G.rep-=repLoss(3); say('Veľká časť kraja nemá záchranku do 15 minút ('+COVPCT+' %). Presuň posádky do zálohy. −3 dôvery', 'bad'); checkRep(); }
  }
  for(const inc of G.incs) if(inc.lost && inc.lost.auto && G.t>=inc.lost.auto) located(inc, '#'+inc.no+': operátor mobilnej siete spresnil polohu.');
  if(G.mode==='demo') demoBot();
  if(G.calls.some(c=>c.state==='ring') && G.t-G.lastRing>3){ SND.ring(); G.lastRing=G.t; }
  for(const u of G.units){
    if(u.moving) moveUnit(u, dt);
    if(u.status===6 && G.t>=u.waitUntil){ u.hosp=null; u.hospId=null; u.secondary=false; goHome(u); }
    if(u.status===5 && !u.hospId && G.t>=u.chooseUntil) chooseHosp(u, (has('d_rec') || quiet() ? bestHosp(u) : nearestFree(u)).id, true);
  }
  for(const inc of [...G.incs]){
    if(inc.fa && inc.fa.busy && G.t>=inc.fa.busy){ inc.fa.busy=0; dirty(); }
    const info=needInfo(inc);
    if(info.met){
      if(!inc.metAt){ inc.metAt=G.t; inc.frac=clamp((inc.deadline-G.t)/(inc.deadline-inc.created),0,1); applyLate(inc, info); aidReport(inc); dirty(); }
      inc.progress+=dt*workRate(inc);
      if(!inc.saidHalf && inc.progress>=inc.work/2){ inc.saidHalf=true; const lead=inc.units.map(unitById).find(u=>u && u.status===4 && u.inc===inc.id); if(lead && !quiet() && Math.random()<.6) radio(lead, HALF[inc.cat]||'Pokračujeme.', 'good'); }
      if(inc.progress>=inc.work) resolve(inc);

    else if(inc.esc && !inc.metAt && G.t>=inc.esc.at) escalate(inc);
    if(!running()) return;
  }
}

function buildTerrain(){
  const W=330, D=230, SX=330, SZ=230;   // vrcholy presne na mriežke výškových dát (1 km)
  const geo=new THREE.PlaneGeometry(W, D, SX, SZ); geo.rotateX(-Math.PI/2);
  geo.translate(-2, 0, 2);
  const pos=geo.attributes.position, col=new Float32Array(pos.count*3), c=new THREE.Color(), R=rng(3);
  const fields=[0x6c9145,0x7e9e4c,0x94a157,0x628a41,0x9f9c5b].map(h=>new THREE.Color(h));
  const forest=new THREE.Color(0x2f5a33), forest2=new THREE.Color(0x24482a), rock=new THREE.Color(0x8a8f7a), water=new THREE.Color(0x2a6aa0), out=new THREE.Color(0x4a5368);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i), h=heightKm(x,z);
    pos.setY(i, h*EXAG);
    const cell=Math.floor(x/1.6)*7919+Math.floor(z/1.6)*104729, f=fields[Math.abs(cell)%fields.length], fn=fbm(x*.09+3,z*.09+9);
    const wood=clamp((h-.33)/.18,0,1), peak=clamp((h-1.05)/.25,0,1);
    c.copy(fields[0]).lerp(fields[2], clamp(fn*1.6-.4,0,1)).lerp(f,.28).lerp(fbm(x*.3,z*.3)>.5 ? forest : forest2, wood).lerp(rock, peak);
    if(riverDist(x,z)<.5) c.lerp(water,.5);
    if(!inRegion(x,z)) c.lerp(out,.62).multiplyScalar(.72);
    c.multiplyScalar(.9+R()*.12);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  geo.computeVertexNormals();
  /* pre satelitnú snímku: kraj svieti, okolie je stlmené */
  const mask=new Float32Array(pos.count*3);
  for(let i=0;i<pos.count;i++){ const inn=inRegion(pos.getX(i), pos.getZ(i)); mask[i*3]=inn ? 1 : .5; mask[i*3+1]=inn ? 1 : .53; mask[i*3+2]=inn ? 1 : .6; }

function loadSatellite(){
  const img=new Image();
  img.onload=()=>{
    try{
      const max=Math.min(R3.capabilities.maxTextureSize, 4096);
      let src=img;
      if(img.width>max || location.protocol==='file:'){
        const c=document.createElement('canvas'), k=Math.min(1, max/img.width); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
        const cx=c.getContext('2d'); cx.drawImage(img,0,0,c.width,c.height); cx.getImageData(0,0,1,1);   // pri file:// vyhodí chybu → zostane pôvodná mapa
        src=c;

/* pás (rieka, cesta, hranica) kopírujúci terén */
function ribbon(pts, width, lift, step=.5){
  const dense=[];
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i], n=Math.max(1, Math.ceil(Math.hypot(b.x-a.x,b.z-a.z)/step));
    for(let k=(i===1?0:1);k<=n;k++) dense.push({x:lerp(a.x,b.x,k/n), z:lerp(a.z,b.z,k/n)});
  }
  const v=[], idx=[];
  dense.forEach((p,i)=>{
    const q=dense[Math.min(i+1,dense.length-1)], o=dense[Math.max(i-1,0)];
    let dx=q.x-o.x, dz=q.z-o.z; const l=Math.hypot(dx,dz)||1; dx/=l; dz/=l;
    const nx=-dz*width/2, nz=dx*width/2;
    v.push(p.x+nx, groundY(p.x+nx,p.z+nz)+lift, p.z+nz, p.x-nx, groundY(p.x-nx,p.z-nz)+lift, p.z-nz);
    /* trojuholníky otočené lícom nahor, nech je pás vidno zhora */
    if(i>0){ const b=(i-1)*2; idx.push(b,b+2,b+1, b+1,b+2,b+3); }
  });
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v,3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function mergeGeos(list){
  let total=0, itotal=0; for(const g of list){ total+=g.attributes.position.count; itotal+=g.index.count; }
  const pos=new Float32Array(total*3), idx=new Uint32Array(itotal); let o=0, io=0;
  for(const g of list){ pos.set(g.attributes.position.array, o*3); const ix=g.index.array; for(let i=0;i<ix.length;i++) idx[io+i]=ix[i]+o; o+=g.attributes.position.count; io+=ix.length; }
  const m=new THREE.BufferGeometry(); m.setAttribute('position', new THREE.BufferAttribute(pos,3)); m.setIndex(new THREE.BufferAttribute(idx,1)); m.computeVertexNormals();
  return m;
}
function buildWater(){
  /* nakreslené rieky a jazerá – len kým sa nenačíta satelitná snímka, kde sú tie skutočné */

function buildBorder(){
  const dense=[]; const P=[...BXZ, BXZ[0]];
  for(let i=1;i<P.length;i++){ const a=P[i-1], b=P[i], n=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.z-a.z)/.6)); for(let k=0;k<n;k++) dense.push({x:lerp(a.x,b.x,k/n), z:lerp(a.z,b.z,k/n)}); }
  dense.push(dense[0]);
  const v=[], c=[], idx=[], top=new THREE.Color(0x000000), bot=new THREE.Color(0xf2b33d);

function buildRoads(){
  const N=id=>NODES[id];
  const main=[], road=[], trail=[];
  for(const e of EDGES){ const pts=[N(e.a),N(e.b)]; (e.t==='M' ? main : e.t==='R' ? road : trail).push(pts); }
  /* trasy posádok: na satelitnej snímke len jemné priesvitné pásy */
  const mat=(c,op)=>new THREE.MeshBasicMaterial({color:c, transparent:true, opacity:op, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-3, side:THREE.DoubleSide});
  scene.add(new THREE.Mesh(mergeGeos(main.map(p=>ribbon(p,.34,.22))), mat(0x1c2230, .55)));
  scene.add(new THREE.Mesh(mergeGeos(main.map(p=>ribbon(p,.07,.25))), mat(0xf2b33d, .85)));
  scene.add(new THREE.Mesh(mergeGeos(road.map(p=>ribbon(p,.2,.2))), mat(0xe8ecf2, .32)));
  for(const p of trail){
    const g=new THREE.BufferGeometry().setFromPoints(ribbonLine(p));
    const l=new THREE.Line(g, new THREE.LineDashedMaterial({color:0xffe4c4, dashSize:.5, gapSize:.4})); l.computeLineDistances(); scene.add(l);
  }

function ribbonLine([a,b]){ const n=Math.ceil(Math.hypot(b.x-a.x,b.z-a.z)/.4), out=[]; for(let k=0;k<=n;k++){ const x=lerp(a.x,b.x,k/n), z=lerp(a.z,b.z,k/n); out.push(new THREE.Vector3(x, groundY(x,z)+.25, z)); } return out; }
function buildTowns(){
  const R=rng(42), mats=[];
  const towns=Object.values(NODES).filter(n=>n.type==='town');
  let count=0; for(const n of towns) count+=Math.round(clamp(Math.sqrt(n.pop)/2.2, 8, 230));
  const geo=new THREE.BoxGeometry(1,1,1); geo.translate(0,.5,0);
  buildingsMat=new THREE.MeshStandardMaterial({color:0xffffff, roughness:.85, emissive:0xffb35a, emissiveIntensity:0});
  const im=new THREE.InstancedMesh(geo, buildingsMat, count);
  im.castShadow=true; im.receiveShadow=true;
  const m=new THREE.Matrix4(), q=new THREE.Quaternion(), s=new THREE.Vector3(), p=new THREE.Vector3(), col=new THREE.Color();
  const palette=[0xd9d4c7,0xc9c2b4,0xe6dfcf,0xb9b4aa,0xd0c6b8,0xe9e3d6].map(h=>new THREE.Color(h)), roofRed=new THREE.Color(0xa8553a);
  let i=0;
  for(const n of towns){
    const k=Math.round(clamp(Math.sqrt(n.pop)/2.2, 8, 230)), big=n.pop>30000;
    for(let j=0;j<k;j++){
      const a=R()*Math.PI*2, d=Math.pow(R(),.7)*n.r;
      const x=n.x+Math.cos(a)*d, z=n.z+Math.sin(a)*d;
      const panel=big && R()<.45 && d>n.r*.25;
      const w=panel ? .18+R()*.12 : .12+R()*.14, l=panel ? .5+R()*.5 : .12+R()*.16;
      const h=panel ? .35+R()*.55 : (big && d<n.r*.3 ? .15+R()*.25 : .08+R()*.12);
      q.setFromAxisAngle(new THREE.Vector3(0,1,0), R()*Math.PI); s.set(w,h,l); p.set(x, groundY(x,z)-.02, z);
      m.compose(p,q,s); im.setMatrixAt(i,m);
      col.copy(panel ? palette[Math.floor(R()*3)] : (R()<.4 ? roofRed : palette[Math.floor(R()*palette.length)])); im.setColorAt(i,col);

  }

}

function mkLabel(cls, html, x, y, z, act, maxD){

function buildStaticLabels(){
  for(const n of Object.values(NODES)){
    if(n.type==='town'){ const L=mkLabel('town'+(n.pop>30000?' big':''), esc(n.name), n.x, n.y+1.6, n.z, null, n.pop>=30000 ? 0 : n.pop>=6000 ? 300 : 190); L.pop=n.pop; staticLabels.push(L); }
    else if(n.type==='poi') staticLabels.push(mkLabel('poi '+n.poi, esc(n.name), n.x, n.y+.8, n.z, null, 165));
    else if(n.poi==='border') staticLabels.push(mkLabel('poi border', esc(n.name.replace(' – hraničný priechod','')), n.x, n.y+.8, n.z, null, 165));
  }
  for(const h of HOSPITALS){ const n=NODES[h]; const L=mkLabel('hosp','H', n.x+n.r*.7, n.y+2, n.z-n.r*.4, null, 230); L.keep=true; staticLabels.push(L); }
  /* dôležitejšie popisky (väčšie mestá) majú prednosť pri prekrytí */
  const rank = L => L.keep ? 0 : L.el.classList.contains('town') ? 1+1/(1+(L.pop||0)) : 3;
  staticLabels.sort((a,b)=>rank(a)-rank(b));
}
/* popisky, ktoré by sa prekrývali s dôležitejšími, sa skryjú */
function declutter(){
  const placed=[];
  for(const L of staticLabels){
    if(L.keep || L.el.style.display==='none') continue;
    if(!L.w){ L.w=L.el.offsetWidth; L.h=L.el.offsetHeight; }
    const r=[L.sx-L.w/2-4, L.sy-L.h-2, L.sx+L.w/2+4, L.sy+2];
    const hide=placed.some(q=>r[0]<q[2] && r[2]>q[0] && r[1]<q[3] && r[3]>q[1]);
    const v=hide ? 'hidden' : '';
    if(L.el.style.visibility!==v) L.el.style.visibility=v;
    if(!hide) placed.push(r);
  }
}

function placeLabel(L, extraY=0){
  V3.set(L.x, L.y+extraY, L.z).project(camera);
  const vis = V3.z<1 && V3.x>-1.1 && V3.x<1.1 && V3.y>-1.1 && V3.y<1.1 && !(L.maxD && CD>L.maxD*LODK);
  if(!vis){ if(L.el.style.display!=='none') L.el.style.display='none'; return; }

  const x=(V3.x+1)/2*LW, y=(1-V3.y)/2*LH; L.sx=x; L.sy=y;

let camAnim=null;
let camFree=false;   // hráč pohol kamerou – po zmene veľkosti mapy sa prehľad už neprepočíta
function viewAll(instant){
  camFree=false;
  const asp=Math.max(.3, LBL.clientWidth/Math.max(1,LBL.clientHeight)), tv=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const W = asp<.8 ? 150 : 166;   // na úzkej obrazovke sa okraje kraja mierne orežú
  const d=Math.max((W/2)/(tv*asp), (78/2)/tv)*1.04, pitch=THREE.MathUtils.degToRad(60);
  const tgt=new THREE.Vector3(-1, 0, 2), pos=new THREE.Vector3(-1, d*Math.sin(pitch), 2+d*Math.cos(pitch));
  animateCam(tgt, pos, instant);
}
function focusOn(x,z){
  if(!controls) return;
  camFree=true;
  const off=camera.position.clone().sub(controls.target);
  if(off.length()>110) off.setLength(110);
  const tgt=new THREE.Vector3(x, groundY(x,z), z);
  animateCam(tgt, tgt.clone().add(off));
}
function focusAt(x,z,dist){
  if(!controls) return;
  camFree=true;
  const off=camera.position.clone().sub(controls.target).setLength(clamp(dist, 25, 200));
  const tgt=new THREE.Vector3(x, groundY(x,z), z);
  animateCam(tgt, tgt.clone().add(off));
}
function animateCam(tgt, pos, instant){
  if(!controls) return;
  if(instant || REDUCED){ controls.target.copy(tgt); camera.position.copy(pos); controls.update(); return; }
  camAnim={t0:performance.now(), from:[controls.target.clone(), camera.position.clone()], to:[tgt,pos]};
}
function onMapTap(e){
  const d=cv._d; cv._d=null;
  if(!d || Math.hypot(e.clientX-d.x, e.clientY-d.y)>6 || !G || G.mode!=='play') return;
  const r=cv.getBoundingClientRect(), ray=new THREE.Raycaster();
  ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1, y:-(e.clientY-r.top)/r.height*2+1}, camera);
  const hit=ray.intersectObjects(pickables, false).find(h=>!h.object.userData.off);
  if(hit){ const {kind,id}=hit.object.userData; if(kind==='unit') return unitClick(unitById(id)); if(kind==='inc') return select(id); }
  const lostInc=incById(G.sel.inc);
  if(lostInc && lostInc.lost){ const th=ray.intersectObject(terrain, false)[0]; if(th) tryLocate(lostInc, th.point.x, th.point.z); return; }
  G.sel.inc=null; G.sel.unit=null; dirty();
}
function resize3D(){
  if(!R3) return;
  const r=cv.parentElement.getBoundingClientRect(); if(!r.width || !r.height) return;
  R3.setSize(r.width, r.height, false); camera.aspect=r.width/r.height; camera.updateProjectionMatrix();
  LODK = r.width<520 ? .62 : r.width<900 ? .8 : 1;
  if(!camFree && controls) viewAll(true);

}
/* počasie na mape: hmla, dážď/sneh, blesky */
let precip=null, flashUntil=0, nextBolt=0;
const WXFOG={clear:[320,820], rain:[170,600], fog:[35,240], ice:[230,720], storm:[120,480], heat:[360,900]};
function buildPrecip(){
  const N=1800, pos=new Float32Array(N*6);
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  precip=new THREE.LineSegments(geo, new THREE.LineBasicMaterial({color:0xbcd4f0, transparent:true, opacity:.45, depthWrite:false}));
  precip.frustumCulled=false; precip.visible=false; precip.userData.v=new Float32Array(N); scene.add(precip);
  for(let i=0;i<N;i++) resetDrop(i, true);
}
function resetDrop(i, any){
  const P=precip.geometry.attributes.position.array, t=controls ? controls.target : {x:0,y:0,z:0}, k=i*6;
  const x=t.x+rand(-70,70), z=t.z+rand(-70,70), y=t.y+(any ? rand(0,60) : rand(45,60));
  P[k]=x; P[k+1]=y; P[k+2]=z; P[k+3]=x; P[k+4]=y; P[k+5]=z;
  precip.userData.v[i]=rand(.8,1.2);
}
function stepPrecip(dt){
  if(!precip) return;
  const w=G && (G.mode==='play' || G.mode==='pause') ? G.weather : 'clear', on=w==='rain' || w==='storm' || w==='ice';
  precip.visible=on && !REDUCED; if(!precip.visible) return;
  const snow=w==='ice', P=precip.geometry.attributes.position.array, V=precip.userData.v, t=controls.target, N=V.length;
  const sp=(snow ? 9 : 70)*dt, len=snow ? .35 : 2.6, drift=(snow ? 2 : 6)*dt;
  precip.material.color.setHex(snow ? 0xffffff : 0xbcd4f0); precip.material.opacity=snow ? .8 : .42;
  for(let i=0;i<N;i++){
    const k=i*6; P[k+1]-=sp*V[i]; P[k]+=drift; P[k+3]=P[k]-drift*.4; P[k+4]=P[k+1]+len; P[k+5]=P[k+2];
    if(P[k+1]<t.y-6 || Math.abs(P[k]-t.x)>80 || Math.abs(P[k+2]-t.z)>80) resetDrop(i);
  }
  precip.geometry.attributes.position.needsUpdate=true;
}
function applyWeatherFx(){
  if(!R3) return;
  const w=G && (G.mode==='play' || G.mode==='pause') ? G.weather : 'clear', f=WXFOG[w]||WXFOG.clear;
  scene.fog.near=f[0]; scene.fog.far=f[1];
}
function applyLight(){
  if(!R3) return;
  const L=LIGHTS[PROG.light];
  hemi.color.setHex(L.sky); hemi.groundColor.setHex(L.ground); hemi.intensity=L.hemi;
  sun.color.setHex(L.sun); sun.intensity=L.sunI; sun.position.set(...L.pos); sun.target.position.set(0,0,0);
  scene.background=new THREE.Color(L.fog); scene.fog.color.setHex(L.fog);
  buildingsMat.emissiveIntensity=L.night*.22;
  for(const g of townGlows) g.material.opacity=g.userData.base*L.night;
  $('#btnLight').textContent=L.label;
  applyWeatherFx();
}
let lastNow=0;
/* kruhy pokrytia pri obciach (zapnú sa čipom „Pokrytie“) */
const covDiscs=[];
function buildCoverage(){
  for(const n of Object.values(NODES)) if(n.type==='town'){
    const m=new THREE.Mesh(new THREE.CircleGeometry(n.r*1.15+2.2, 40), new THREE.MeshBasicMaterial({color:0x3ddc97, transparent:true, opacity:.34, depthTest:false, depthWrite:false}));
    m.rotation.x=-Math.PI/2; m.position.set(n.x, n.y+.4, n.z); m.renderOrder=2; m.visible=false; m.userData.id=n.id; scene.add(m); covDiscs.push(m);
  }
}
function syncCoverage(){
  const on=covShow && G && (G.mode==='play' || G.mode==='pause');
  for(const m of covDiscs){ m.visible=on; if(on){ const t=COV[m.userData.id]; m.material.color.setHex(t<=10 ? 0x3ddc97 : t<=15 ? 0xf4d35e : 0xff4d5e); } }
}
function render3D(now){
  if(!R3) return;
  syncCoverage();
  stepPrecip(Math.min(.05,(now-(lastNow||now))/1000));
  /* blesk pri búrke */
  const baseHemi=LIGHTS[PROG.light].hemi;
  if(G && G.mode==='play' && G.weather==='storm' && !REDUCED){
    if(now>nextBolt){ nextBolt=now+rand(4000,9000); flashUntil=now+140; SND.thunder(); }
    hemi.intensity = now<flashUntil ? baseHemi+1.6 : baseHemi;
  } else if(hemi.intensity!==baseHemi) hemi.intensity=baseHemi;
  const dt=Math.min(.05,(now-(lastNow||now))/1000); lastNow=now;
  if(camAnim){
    const k=clamp((now-camAnim.t0)/650,0,1), e=k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    controls.target.lerpVectors(camAnim.from[0], camAnim.to[0], e); camera.position.lerpVectors(camAnim.from[1], camAnim.to[1], e);
    if(k>=1) camAnim=null;
  }
  controls.update();
  LW=LBL.clientWidth; LH=LBL.clientHeight; CD=camera.position.distanceTo(controls.target);
  syncUnits(now); syncIncidents(now);
  for(const id of [...incObj.keys()]) if(!incById(id)) dropIncMesh(id);
  stepParticles(addP, dt); stepParticles(norP, dt);
  for(const L of staticLabels) placeLabel(L);
  declutter();
  for(let i=FX.length-1;i>=0;i--){ const L=FX[i]; if(now-L.t0>1600){ L.el.remove(); FX.splice(i,1); } else placeLabel(L); }
  R3.render(scene, camera);
}

function updateTimers(){

  if(rep!==lastRep){ lastRep=rep; $('#repBar').style.width=rep+'%'; $('#repTxt').textContent=rep+' %'; $('#repBox').classList.toggle('low', rep<35); }

    const full=el.dataset.full, n=Math.floor((performance.now()-(+el.dataset.t0))/24);
    if(n>=full.length){ el.textContent=full; delete el.dataset.full; } else el.textContent=full.slice(0, Math.max(0,n))+'▍';
