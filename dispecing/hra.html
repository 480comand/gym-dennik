<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1222">
<title>Linka 112</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
  :root{
    /* Rozloženie: dispečerský pult – pás s postupom hore, vľavo hovory a udalosti, v strede 3D mapa Košického kraja, vpravo posádky */
    --ink:#0a1222; --panel:#101b30; --card:#16233c; --line:#243450;
    --text:#e8edf6; --muted:#8e9bb4;
    --sodium:#f2b33d; --on-sodium:#1c1405;
    --good:#3ddc97; --bad:#ff4d5e;
    --p1:#ff4d5e; --p2:#ff9a3c; --p3:#f4d35e;
    --s1:#3ddc97; --s2:#2aa198; --s3:#ff9a3c; --s4:#ff4d5e; --s5:#b48cff; --s6:#5aa9ff;
    --t-med:#ff6b81; --t-traffic:#f4d35e; --t-fire:#ff8a3d; --t-tech:#c9a46a; --t-hazmat:#a6e22e;
    --t-police:#5aa9ff; --t-msp:#3fd0c9; --t-mountain:#e86a4a; --t-prank:#8e9bb4;
    --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
    --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{height:100%; margin:0; background:var(--ink); color:var(--text); font-family:var(--f-body); font-size:15px; line-height:1.4;}
  body{overflow:hidden; -webkit-tap-highlight-color:transparent;}
  button{font:inherit; color:inherit;}
  kbd{font:600 10px var(--f-mono); border:1px solid currentColor; border-radius:4px; padding:0 4px; opacity:.7;}
  .ico{width:18px; height:18px; flex:none; display:inline-block; vertical-align:-3px;}

  .app{position:relative; height:100%; display:grid; gap:12px;
    grid-template-columns:minmax(290px,340px) minmax(0,1fr) minmax(250px,300px);
    grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"bar bar bar" "left map right";
    padding-block:12px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    background:radial-gradient(1200px 500px at 50% -10%, color-mix(in srgb, var(--sodium) 7%, transparent), transparent 70%), var(--ink);}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; font-weight:700; font-size:14px;
    border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text);
    padding:8px 12px; min-height:38px; cursor:pointer; user-select:none; touch-action:manipulation;}
  .btn:hover{border-color:var(--muted);}
  .btn:focus-visible{outline:2px solid var(--sodium); outline-offset:2px;}
  .btn:disabled{opacity:.4; cursor:default;}
  .btn.go{background:var(--sodium); border-color:var(--sodium); color:var(--on-sodium); box-shadow:0 0 18px color-mix(in srgb, var(--sodium) 30%, transparent);}
  .btn.ghost{background:transparent;}
  .btn.sm{min-height:30px; padding:5px 9px; font-size:13px;}
  .btn .badge{font:700 11px var(--f-mono); background:var(--bad); color:#fff; border-radius:999px; padding:0 6px; line-height:17px;}

  /* ---------- horný pás ---------- */
  .bar{grid-area:bar; display:flex; align-items:center; gap:10px 20px; flex-wrap:wrap; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:8px 14px;}
  .brand{font:800 28px/1 var(--f-display); letter-spacing:.05em; text-transform:uppercase;}
  .brand b{color:var(--sodium); text-shadow:0 0 18px color-mix(in srgb, var(--sodium) 45%, transparent);}
  .brand small{display:block; font:600 10px var(--f-mono); letter-spacing:.12em; color:var(--muted); margin-top:4px;}
  .k{font:600 10px var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
  .clock{font:800 30px/1 var(--f-display); font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:8px;}
  .live{width:9px; height:9px; border-radius:50%; background:var(--bad); box-shadow:0 0 10px var(--bad); animation:blink 1.2s steps(2,start) infinite;}
  .app:not([data-mode="play"]) .live{visibility:hidden;}
  @keyframes blink{to{opacity:.25;}}
  .track{height:6px; background:var(--line); border-radius:3px; overflow:hidden;}
  .track i{display:block; height:100%; width:0; background:var(--sodium); border-radius:3px; transition:width .3s;}
  .lvl{display:grid; gap:5px; width:150px;}
  .lvl .v{font:800 18px/1 var(--f-display); letter-spacing:.04em; text-transform:uppercase;}
  .stat .v{font:800 26px/1.05 var(--f-display); font-variant-numeric:tabular-nums;}
  .rep{width:120px; display:grid; gap:6px;}
  .rep .track{height:9px;}
  .rep .track i{background:var(--good); box-shadow:0 0 10px var(--good);}
  .rep.low .track i{background:var(--bad); box-shadow:0 0 10px var(--bad);}
  .spacer{flex:1;}
  .ctrl{display:flex; gap:6px; flex-wrap:wrap;}

  /* ---------- bočné panely ---------- */
  .rail{background:var(--panel); border:1px solid var(--line); border-radius:12px; min-height:0; overflow:auto;
    padding:12px; display:flex; flex-direction:column; gap:16px; overscroll-behavior:contain;}
  .rail-left{grid-area:left;} .rail-right{grid-area:right;}
  .sec{display:grid; gap:8px; min-width:0;}
  .sec h2{font:800 17px/1 var(--f-display); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0; display:flex; align-items:center; gap:8px;}
  .count{font:600 11px var(--f-mono); letter-spacing:0; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--text);}
  .empty{margin:0; color:var(--muted); font-size:14px;}
  .row{display:flex; align-items:center; gap:8px; min-width:0;}
  .grow{flex:1; min-width:0;}

  .call{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; display:grid; gap:9px;}
  .call.ring{border-color:var(--sodium); animation:ring 1s ease-in-out infinite;}
  .call.ring .phone{color:var(--sodium); animation:wiggle .5s ease-in-out infinite; display:inline-flex;}
  @keyframes ring{50%{box-shadow:0 0 0 3px color-mix(in srgb, var(--sodium) 30%, transparent), 0 0 24px color-mix(in srgb, var(--sodium) 25%, transparent);}}
  @keyframes wiggle{25%{transform:rotate(-14deg);}75%{transform:rotate(14deg);}}
  .call.talk{border-color:var(--sodium); background:linear-gradient(180deg, color-mix(in srgb, var(--sodium) 9%, var(--card)), var(--card));}
  .call.shake{animation:shake .35s;}
  @keyframes shake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .lbl{font:600 11px var(--f-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--sodium); display:flex; align-items:center; gap:7px;}
  .wave{display:inline-flex; align-items:center; gap:2px; height:14px;}
  .wave i{width:3px; height:100%; background:var(--sodium); border-radius:2px; animation:wave .9s ease-in-out infinite;}
  .wave i:nth-child(2){animation-delay:-.2s;} .wave i:nth-child(3){animation-delay:-.45s;} .wave i:nth-child(4){animation-delay:-.65s;} .wave i:nth-child(5){animation-delay:-.3s;}
  @keyframes wave{0%,100%{transform:scaleY(.25);}50%{transform:scaleY(1);}}
  .quote{margin:0; font-size:16px; line-height:1.45;}
  .quote::before{content:"„";} .quote::after{content:"“";}
  .addr{font:500 12px var(--f-mono); color:var(--muted);}
  .call>.row>.lbl{flex:0 0 auto; white-space:nowrap;} .call>.row>.addr{flex:1 1 0; min-width:0; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cls{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .cls .btn{justify-content:flex-start; text-align:left; border-left:4px solid var(--tc); font-size:13px; padding:7px 8px; gap:6px;}
  .cls .btn .ico{color:var(--tc);}
  .cls .btn kbd{margin-left:auto;}
  .cls .btn.hint{box-shadow:inset 0 0 0 1px var(--tc), 0 0 14px color-mix(in srgb, var(--tc) 35%, transparent);}

  .inc{background:var(--card); border:1px solid var(--line); border-left:5px solid var(--pc); border-radius:10px; padding:9px 10px; cursor:pointer; display:grid; gap:6px;}
  .inc:hover{border-color:var(--muted); border-left-color:var(--pc);}
  .inc.sel{border-color:var(--sodium); border-left-color:var(--pc); box-shadow:0 0 16px color-mix(in srgb, var(--sodium) 18%, transparent);}
  .inc .ico, .disp .ico{color:var(--pc);}
  .prio{font:700 11px var(--f-mono); padding:1px 6px; border-radius:5px; background:var(--pc); color:var(--ink); flex:none;}
  .ttl{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .timer{font:600 12px var(--f-mono); font-variant-numeric:tabular-nums; flex:none;}
  .needs{display:flex; flex-wrap:wrap; gap:4px;}
  .need{font:600 11px var(--f-mono); padding:1px 7px; border-radius:999px; border:1px dashed var(--muted); color:var(--muted);}
  .need.way{border-style:solid; border-color:var(--s3); color:var(--s3);}
  .need.on{border-style:solid; border-color:var(--good); background:var(--good); color:var(--ink);}
  .tbar{height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
  .tbar i{display:block; height:100%; background:var(--pc, var(--sodium));}
  .tbar.work i{background:var(--good);}

  .disp{background:var(--card); border:1px solid var(--sodium); border-radius:12px; padding:12px; display:grid; gap:10px; box-shadow:0 0 22px color-mix(in srgb, var(--sodium) 14%, transparent);}
  .disp .quote{font-size:14px; color:var(--muted);}
  .cand{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center; gap:8px; font-size:14px;}
  .tag{font:700 11px var(--f-mono); padding:2px 6px; border-radius:5px; background:var(--sc); color:var(--ink); white-space:nowrap;}
  .eta{font:600 12px var(--f-mono); color:var(--muted); white-space:nowrap;}
  .sub{font-size:12px; color:var(--muted); font-weight:400;}
  .keys{margin:0; font-size:12px; color:var(--muted);}

  .unit{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:3px 10px; align-items:center; padding:8px 10px;
    background:var(--card); border:1px solid var(--line); border-left:4px solid var(--sc); border-radius:10px; cursor:pointer;}
  .unit:hover{border-color:var(--muted); border-left-color:var(--sc);}
  .unit.sel{border-color:var(--sodium); border-left-color:var(--sc);}
  .unit .veh{width:30px; height:30px; display:grid; place-items:center; border-radius:8px; background:color-mix(in srgb, var(--sc) 18%, transparent); color:var(--sc);}
  .unit .veh .ico{width:22px; height:22px;}
  .unit .nm{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .unit .st{font:600 11px var(--f-mono); color:var(--sc); white-space:nowrap;}
  .unit .what{grid-column:1/-1; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .unit .send{font:700 11px var(--f-mono); color:var(--on-sodium); background:var(--sodium); border-radius:5px; padding:1px 6px;}

  /* ---------- 3D mapa ---------- */
  .mapbox{grid-area:map; position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#070d19; min-height:0;}
  #map{display:block; width:100%; height:100%; touch-action:none; outline:none;}
  .labels{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  .l3{position:absolute; left:0; top:0; white-space:nowrap; will-change:transform;}
  .l3.town{font:800 13px/1 var(--f-display); letter-spacing:.08em; text-transform:uppercase; color:var(--text);
    text-shadow:0 1px 3px #000, 0 0 8px #000; transform-origin:50% 100%;}
  .l3.town.big{font-size:18px; color:var(--sodium);}
  .l3.poi{font:600 10px var(--f-mono); color:#d9e3f2; text-shadow:0 1px 2px #000, 0 0 6px #000;}
  .l3.poi::before{content:"▲ "; color:var(--t-mountain);}
  .l3.poi.lake::before{content:"≈ "; color:var(--s6);} .l3.poi.industry::before{content:"■ "; color:var(--t-hazmat);} .l3.poi.border::before{content:"⬥ "; color:var(--muted);}
  .l3.hosp{font:800 11px/1 var(--f-display); background:#fff; color:var(--bad); border-radius:3px; padding:2px 3px; box-shadow:0 0 10px color-mix(in srgb, var(--bad) 60%, transparent);}
  .l3.unit{pointer-events:auto; cursor:pointer; font:700 10px/1 var(--f-mono); color:var(--ink); background:var(--sc); border-radius:4px; padding:2px 5px; box-shadow:0 1px 4px rgba(0,0,0,.6);}
  .l3.unit.sel{outline:2px solid var(--sodium);}
  .l3.inc{pointer-events:auto; cursor:pointer; display:flex; align-items:center; gap:5px; font:700 11px/1 var(--f-mono); color:var(--text);
    background:color-mix(in srgb, var(--ink) 88%, transparent); border:1px solid var(--pc); border-radius:6px; padding:3px 6px; box-shadow:0 0 14px color-mix(in srgb, var(--pc) 45%, transparent);}
  .l3.inc .ico{width:14px; height:14px; color:var(--pc);}
  .l3.inc.sel{outline:2px solid var(--sodium);}
  .l3.inc.met{border-color:var(--good);}
  .l3.fx{font:800 22px/1 var(--f-display); text-shadow:0 2px 6px #000; animation:rise 1.6s ease-out forwards;}
  .l3.fx.good{color:var(--good);} .l3.fx.bad{color:var(--bad);}
  @keyframes rise{to{margin-top:-46px; opacity:0;}}
  .hints{position:absolute; top:10px; left:50%; transform:translateX(-50%); display:grid; gap:6px; justify-items:center; pointer-events:none; width:min(92%,560px); z-index:3;}
  .hint{background:color-mix(in srgb, var(--panel) 94%, transparent); border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:13px; font-weight:700; text-align:center; animation:hin .2s ease-out; box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .hint.good{border-color:var(--good);} .hint.bad{border-color:var(--bad);}
  @keyframes hin{from{opacity:0; transform:translateY(-6px);}}
  .mapbtns{position:absolute; right:10px; bottom:10px; display:grid; gap:6px; z-index:3;}
  .mapbtns .btn{background:color-mix(in srgb, var(--panel) 90%, transparent); min-height:34px; padding:6px 10px; font-size:13px;}
  .legend{position:absolute; left:10px; bottom:10px; display:flex; flex-wrap:wrap; gap:4px 10px; max-width:calc(100% - 20px); z-index:3;
    background:color-mix(in srgb, var(--panel) 88%, transparent); border:1px solid var(--line); border-radius:8px; padding:5px 9px; font:500 11px var(--f-mono); color:var(--muted); pointer-events:none;}
  .legend span::before{content:""; display:inline-block; width:8px; height:8px; border-radius:2px; background:var(--sc); margin-right:5px;}
  .nogl{position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:20px; color:var(--muted);}

  /* ---------- prekryvné okná ---------- */
  .overlay{position:absolute; inset:0; z-index:20; display:grid; place-items:center; overflow:auto;
    background:radial-gradient(closest-side, color-mix(in srgb, var(--ink) 72%, transparent), color-mix(in srgb, var(--ink) 40%, transparent));
    padding-block:16px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));}
  .overlay.menu{background:linear-gradient(90deg, color-mix(in srgb, var(--ink) 84%, transparent), color-mix(in srgb, var(--ink) 40%, transparent) 60%, transparent);}
  @media (min-width:1100px){ .overlay.menu{justify-items:start; padding-left:max(48px, env(safe-area-inset-left, 0px));} .overlay.menu .sheet{max-width:600px;} }
  .sheet{width:100%; max-width:660px; background:color-mix(in srgb, var(--panel) 95%, transparent); border:1px solid var(--line); border-radius:16px;
    padding:24px; display:grid; gap:16px; box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px color-mix(in srgb, var(--sodium) 10%, transparent); backdrop-filter:blur(6px);}
  .sheet.wide{max-width:1180px;}
  .title{margin:0; font:800 clamp(52px, 10vw, 84px)/.88 var(--f-display); text-transform:uppercase; letter-spacing:.03em; text-wrap:balance;}
  .title b{color:var(--sodium); text-shadow:0 0 30px color-mix(in srgb, var(--sodium) 50%, transparent);}
  .title small{display:block; font-size:.36em; letter-spacing:.14em; color:var(--muted); margin-top:8px;}
  .lead{margin:0; font-size:17px; max-width:58ch;}
  .how{margin:0; padding-left:20px; display:grid; gap:6px; max-width:62ch;}
  .how li::marker{color:var(--sodium); font-family:var(--f-mono); font-weight:700;}
  .prog{display:flex; gap:14px; align-items:center; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px;}
  .prog b{font:800 22px/1 var(--f-display); letter-spacing:.04em;}
  .diffs{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;}
  .diff{text-align:left; padding:13px; border-radius:12px; background:var(--card); border:1px solid var(--line); cursor:pointer; display:grid; gap:4px; align-content:start; transition:transform .15s, border-color .15s;}
  .diff:hover, .diff:focus-visible{border-color:var(--sodium); outline:none; transform:translateY(-2px);}
  .diff b{font:800 22px/1 var(--f-display); text-transform:uppercase; letter-spacing:.05em;}
  .diff span{font-size:13px; color:var(--muted);}
  .sumgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px;}
  .sumgrid div{background:var(--card); border-radius:10px; padding:10px 12px;}
  .sumgrid b{display:block; font:800 28px/1.05 var(--f-display); font-variant-numeric:tabular-nums;}
  .grade{margin:0; font:800 30px/1 var(--f-display); text-transform:uppercase; letter-spacing:.05em; color:var(--sodium);}
  .acts{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .credit{margin:0; font-size:11px; color:var(--muted);}
  .credit a{color:var(--muted);}
  .linkbtn{background:none; border:none; padding:0; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:12px;}

  /* strom schopností */
  .tree{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px;}
  .branch{display:grid; gap:8px; align-content:start; min-width:0;}
  .branch h3{margin:0; display:flex; align-items:center; gap:7px; font:800 17px/1 var(--f-display); letter-spacing:.08em; text-transform:uppercase; color:var(--bc);}
  .sk{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 10px; display:grid; gap:5px; position:relative;}
  .sk b{font-size:14px;}
  .sk p{margin:0; font-size:12px; color:var(--muted);}
  .sk .row .btn{min-height:28px; padding:3px 9px; font-size:12px;}
  .sk.own{border-color:var(--bc); background:color-mix(in srgb, var(--bc) 12%, var(--card));}
  .sk.lock{opacity:.55;}
  .sk .cost{font:700 11px var(--f-mono); color:var(--sodium);}
  .sk .ok{font:700 11px var(--f-mono); color:var(--bc);}

  .mtabs{display:none; grid-area:tabs; gap:6px;}
  .mtabs .btn{flex:1; gap:6px; padding-inline:6px;}
  .mtabs .btn.on{background:var(--sodium); border-color:var(--sodium); color:var(--on-sodium);}
  .mtabs .btn .badge{background:var(--line); color:var(--text);}
  .mtabs .btn .badge.hot{background:var(--bad); color:#fff;}
  .mtabs .btn.on .badge{background:var(--on-sodium); color:var(--sodium);}
  .mtabs .grip{flex:0 0 46px; font-size:18px;}
  .ringbar{display:none;}
  #btnPause .ico{display:none;} #btnPause .pi, #btnPause .pl{width:16px; height:16px;}
  #btnSkills .m, .ctrl .more, .xpline{display:none;}

  /* filtre posádok */
  .uf{display:flex; gap:5px; flex-wrap:wrap;}
  .uf .btn{min-height:28px; padding:3px 9px; font-size:12px; border-radius:999px;}
  .uf .btn.on{background:var(--sodium); border-color:var(--sodium); color:var(--on-sodium);}

  @media (max-width:1180px){ .tree{grid-template-columns:repeat(3,minmax(0,1fr));} }
  /* ---------- telefón: mapa na celú plochu, dole vysúvací panel so záložkami ---------- */
  @media (max-width:860px){
    .app{gap:0; padding:0; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto auto;
      grid-template-areas:"bar" "map" "rail" "tabs";}
    .bar{position:relative; border-radius:0; border-width:0 0 1px; gap:6px 9px; flex-wrap:wrap;
      padding:6px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px));
      padding-top:max(6px, env(safe-area-inset-top, 0px));}
    .brand{font-size:23px;} .brand .t, .brand small{display:none;}
    .svc .k, .lvl, .score .k{display:none;}
    .clock{font-size:21px; gap:6px;}
    .stat .v{font-size:19px;}

for(const [id,name,lo,la,pop,loc] of TOWNS){ const p=proj(lo,la); NODES[id]={id,name,...p,type:'town',pop,loc,r:clamp(.5+Math.sqrt(pop)/170,.6,3.4)}; }
for(const [id,name,lo,la,loc,kind] of WAYPOINTS){ const p=proj(lo,la); NODES[id]={id,name,...p,type:'wp',loc,poi:kind}; }
for(const [id,name,lo,la] of STATIONS){ const p=proj(lo,la); NODES[id]={id,name,...p,type:'st',loc:'v Košiciach'}; }
for(const [id,name,lo,la,loc,kind] of POIS){ const p=proj(lo,la); NODES[id]={id,name,...p,type:'poi',loc,poi:kind}; }
for(const n of Object.values(NODES)) n.y=groundY(n.x,n.z);
const EDGES=ROADS.map(([a,b,t])=>{ const A=NODES[a], B=NODES[b]; return {a,b,t, len:Math.hypot(A.x-B.x,A.z-B.z)*(t==='T'?1.35:1.15)}; });
const ADJ={}; for(const id in NODES) ADJ[id]=[];
for(const e of EDGES){ ADJ[e.a].push([e.b,e]); ADJ[e.b].push([e.a,e]); }

let AC=null, muted=false;

function tone(freq, dur, type='sine', vol=.1, when=0){
  if(muted || !AC || quiet()) return;

    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.03);
  }catch(e){}
}
const SND={

/* ============================================================
   HERNÁ LOGIKA
   ============================================================ */
const speedOf = u => KINDS[u.kind].speed/60 * (has('d_green') ? 1.15 : 1);          // km za minútu hry
const trailSpeed = u => (KINDS[u.kind].trail||8)/60 * (has('s_quad') ? 1.5 : 1);
function edgeSpeed(u, e){ return e.t==='T' ? trailSpeed(u) : speedOf(u)*(e.t==='M' ? 1.15 : 1); }
const canUse = (u, e) => e.t!=='T' || u.kind==='HZS';
/* najrýchlejšie cesty pre daný druh posádky (čas v minútach hry) */
function dijkstra(src, u){
  const d={}, prev={}, done=new Set();
  for(const id in NODES) d[id]=Infinity;
  d[src]=0;
  for(;;){
    let best=null, bv=Infinity;
    for(const id in d) if(!done.has(id) && d[id]<bv){ bv=d[id]; best=id; }
    if(best==null) break;
    done.add(best);
    for(const [v,e] of ADJ[best]) if(canUse(u,e)){ const nd=d[best]+e.len/edgeSpeed(u,e); if(nd<d[v]){ d[v]=nd; prev[v]=best; } }
  }
  return {d, prev};
}
function pathFor(u, from, to){
  if(from===to) return [];
  const {d,prev}=dijkstra(from, u);
  if(d[to]===Infinity) return null;
  const p=[]; for(let v=to; v!==from; v=prev[v]) p.push(v);
  return p.reverse();
}
function setStatus(u, s){ u.status=s; u.since=G.t; dirty(); }
/* trasa k uzlu a prípadne ďalej mimo cesty k presnému miestu */
function routeTo(u, node, dest){
  const n=NODES[node];
  if(KINDS[u.kind].air){ u.path=[]; u.dest=dest || {x:n.x, z:n.z}; u.destNode=node; u.moving=true; return; }
  const from = u.path.length ? u.path[0] : u.node;
  const rest = pathFor(u, from, node) || [];
  u.path = (u.path.length || u.off) ? [from, ...rest] : rest;
  u.dest = dest || null; u.destNode=node;
  u.moving = u.path.length>0 || !!u.dest;
  if(!u.moving) arrived(u);
}
function goHome(u){ u.inc=null; setStatus(u,1); routeTo(u, u.home); }
const LAUNCH=4;   // vrtuľník potrebuje pár minút na štart
function moveUnit(u, dt){
  const air=KINDS[u.kind].air;
  if(air && u.launch && G.t<u.launch) return;
  let rem=dt;
  while(rem>1e-6){
    let tx, tz, sp;
    if(u.path.length){
      const n=NODES[u.path[0]]; tx=n.x; tz=n.z;
      const from=u.node, e=ADJ[from] && ADJ[from].find(([v])=>v===u.path[0]);
      sp = e ? edgeSpeed(u, e[1]) : speedOf(u);
    } else if(u.dest){ tx=u.dest.x; tz=u.dest.z; sp=air ? speedOf(u) : speedOf(u)*.6; }
    else break;
    if(u.status===1) sp*=.8;
    const dx=tx-u.x, dz=tz-u.z, d=Math.hypot(dx,dz), step=sp*rem;
    if(d>1e-4) u.ang=Math.atan2(dx,dz);
    if(d<=step){
      u.x=tx; u.z=tz; rem-=d/sp;
      if(u.path.length){ u.node=u.path.shift(); u.off=false; }
      else { u.dest=null; u.off=!air; if(air) u.node=u.destNode; }
    } else { u.x+=dx/d*step; u.z+=dz/d*step; rem=0; if(!u.path.length && u.dest && !air) u.off=true; }
  }
  if(u.moving && !u.path.length && !u.dest){ u.moving=false; arrived(u); }
}
/* zostávajúci čas jazdy (minúty hry) */
function etaPath(u){
  let t=0, px=u.x, pz=u.z, from=u.node;
  for(const id of u.path){ const n=NODES[id], e=ADJ[from].find(([v])=>v===id); t+=Math.hypot(n.x-px,n.z-pz)/(e ? edgeSpeed(u,e[1]) : speedOf(u)); px=n.x; pz=n.z; from=id; }
  if(u.dest) t+=Math.hypot(u.dest.x-px,u.dest.z-pz)/(KINDS[u.kind].air ? speedOf(u) : speedOf(u)*.6);
  return t*(u.status===1 ? 1.25 : 1);
}
/* odhad dojazdu posádky k udalosti */
function etaTo(u, inc, cache){
  if(KINDS[u.kind].air) return Math.hypot(inc.x-u.x, inc.z-u.z)/speedOf(u) + (u.status===2 ? LAUNCH : Math.max(0,(u.launch||0)-G.t));
  const key=u.kind;   // každý druh má inú rýchlosť
  if(!cache[key]) cache[key]=dijkstra(inc.node, u).d;
  const from=u.path.length ? u.path[0] : u.node, d=cache[key][from];
  if(d===Infinity) return Infinity;
  const n=NODES[inc.node];
  return Math.hypot(NODES[from].x-u.x, NODES[from].z-u.z)/speedOf(u) + d + Math.hypot(inc.x-n.x, inc.z-n.z)/(speedOf(u)*.6);
}
function arrived(u){
  if(u.status===3){
    const inc=incById(u.inc);
    if(!inc){ goHome(u); return; }
    setStatus(u,4);
    if(inc.prank){ wasted(inc); return; }
    SND.blip();
  } else if(u.status===5){ setStatus(u,6); u.waitUntil=G.t+4; }
  else if(u.status===1){ setStatus(u,2); }
}
/* zodpovedá posádka danej potrebe? (napr. 'RZP|LZS') */
const fits = (u, need) => need.split('|').includes(u.kind);
const needKinds = inc => new Set(inc.needs.flatMap(n=>n.split('|')));
const dispatchable = (u, inc) => (u.status===1 || u.status===2 || u.status===3) && u.inc!==inc.id;
function dispatch(u, inc){
  if(!u || !inc || !running()) return;
  if(!dispatchable(u, inc)){ say(u.inc===inc.id ? u.name+' už ide na túto udalosť.' : u.name+' je teraz obsadená ('+STATUS[u.status].toLowerCase()+').'); return; }
  if(!KINDS[u.kind].air && pathFor(u, u.path.length ? u.path[0] : u.node, inc.node)===null){ say(u.name+' sa tam nedostane – vedie tam len chodník pre horskú službu.','bad'); return; }
  if(u.inc){ const old=incById(u.inc); if(old) old.units=old.units.filter(x=>x!==u.id); }
  u.inc=inc.id; if(!inc.units.includes(u.id)) inc.units.push(u.id);
  if(KINDS[u.kind].air && u.status===2) u.launch=G.t+LAUNCH;
  setStatus(u,3);
  routeTo(u, inc.node, {x:inc.x, z:inc.z});
  SND.blip();
}
/* priradenie posádok k potrebám (hľadá sa najlepšie pokrytie) */
function needInfo(inc){
  const assigned=inc.units.map(unitById).filter(u=>u && u.inc===inc.id && (u.status===3 || u.status===4));
  const order=inc.needs.map((n,i)=>[n,i]).sort((a,b)=>a[0].split('|').length-b[0].split('|').length);
  const used=new Set(), slots=new Array(inc.needs.length);
  const shared=new Set();
  for(const st of [4,3]){
    for(const [need,i] of order){
      if(slots[i]) continue;
      const u=assigned.find(u=>u.status===st && !used.has(u.id) && fits(u,need));
      if(u){ used.add(u.id); slots[i]={need, st: st===4 ? 'on' : 'way', u}; }
    }
    shareDoc(inc, slots, shared);
  }
  for(let i=0;i<slots.length;i++) if(!slots[i]) slots[i]={need:inc.needs[i], st:'miss'};
  return {slots, met:slots.every(s=>s.st==='on'), missing:slots.filter(s=>s.st==='miss').map(s=>s.need)};
}
/* RLP a vrtuľník majú lekára aj prepravu: jedna posádka pokryje potrebu lekára aj jednej sanitky */
const BOTH=new Set(['RLP','LZS']);
function shareDoc(inc, slots, shared){
  for(let i=0;i<slots.length;i++) if(!slots[i]){
    const need=inc.needs[i], doc=need===DOC;
    const j=slots.findIndex((s,j)=>s && j!==i && BOTH.has(s.u.kind) && !shared.has(s.u.id) && (doc ? s.need!==DOC : s.need===DOC && fits(s.u, need)));
    if(j>=0){ shared.add(slots[j].u.id); slots[i]={...slots[j], need}; }
  }
}
function candidates(inc){
  const kinds=needKinds(inc), cache={};
  return G.units.filter(u=>kinds.has(u.kind) && dispatchable(u, inc))
    .map(u=>({u, eta:etaTo(u, inc, cache), free:u.status!==3})).filter(c=>c.eta<Infinity)
    .sort((a,b)=>(b.free-a.free) || a.eta-b.eta);
}
function recommended(inc){
  /* lekár ide na rad posledný: ak najbližšou sanitkou je RLP, lekára už netreba posielať zvlášť */
  const miss=needInfo(inc).missing.slice().sort((a,b)=>(a===DOC)-(b===DOC) || a.split('|').length-b.split('|').length), out=[], taken=new Set(), shared=new Set();
  const cands=candidates(inc).filter(c=>c.free);
  for(const need of miss){
    if(need===DOC){ const d=out.find(c=>BOTH.has(c.u.kind) && !shared.has(c.u.id)); if(d){ shared.add(d.u.id); continue; } }
    const c=cands.find(c=>!taken.has(c.u.id) && fits(c.u, need));
    if(c){ taken.add(c.u.id); out.push(c); }
  }
  return out;
}
function sendRecommended(inc){
  const rec=recommended(inc);
  if(!rec.length){ say(needInfo(inc).missing.length ? 'Žiadna vhodná voľná posádka. Presmeruj inú alebo počkaj.' : 'Všetky potrebné posádky sú už na ceste.'); return; }
  for(const c of rec) dispatch(c.u, inc);
}

/* ---------- hovory ---------- */
const catOpen = c => !CATS[c].skill || has(CATS[c].skill);
const mspTowns = () => [...new Set(G.units.filter(u=>u.kind==='MSP').map(u=>u.home))];
function placeFor(tpl){
  const busy=new Set(G.incs.filter(i=>NODES[i.node].type!=='town').map(i=>i.node));
  const free = ids => { const f=ids.filter(id=>!busy.has(id)); return f.length ? f : ids; };
  const towns=Object.values(NODES).filter(n=>n.type==='town');
  const weightedTown = list => { let s=0; for(const n of list) s+=Math.sqrt(n.pop); let r=Math.random()*s; for(const n of list){ r-=Math.sqrt(n.pop); if(r<=0) return n.id; } return list[0].id; };
  switch(tpl.place){
    case 'town': return weightedTown(towns);
    case 'msp': return pick(mspTowns());
    case 'road': return pick(free(['w_sl','w_ky','w_snm','w_ml','mo','tu','se','mg','me','ja','so','st']).concat(['ke','mi']));
    case 'forest': return pick(free(['db','dd','gl','me','pl','tu','p_kh','p_vo','kr','so']));
    case 'river': return pick(free(['vk','kc','mi','tv','mg','kr','rv','ct']));
    case 'lake': return pick(free(['l_si','l_ru']));
    case 'border': return pick(['w_ml','w_vn']);
    case 'mountain': return pick(free(['p_sb','p_kl','p_vo','p_kh','p_zd','p_mo']));
    case 'cave': return pick(free(['p_oc','p_dm']));
    default: return tpl.place;
  }
}
function addrOf(node){
  const n=NODES[node];
  if(n.type!=='town') return n.name;
  const st = node==='ke' ? pick(KE_STREETS) : pick(STREETS);
  return st+' '+Math.floor(rand(1,90))+', '+n.name;
}
function weightedTpl(list){
  let sum=0; for(const t of list) sum+=t.w;
  let r=Math.random()*sum;
  for(const t of list){ r-=t.w; if(r<=0) return t; }
  return list[list.length-1];
}
function availableTpl(){
  return TPL.filter(t=>catOpen(t.cat) && t.needs.every(n=>n.split('|').some(k=>G.units.some(u=>u.kind===k))) && (t.place!=='msp' || mspTowns().length));
}
function spawnCall(){
  let prank=Math.random()<.09, tpl=null, node;
  if(!prank){ tpl=weightedTpl(availableTpl()); node=placeFor(tpl); }
  else node=placeFor({place:'town'});
  const n=NODES[node];
  const text = prank ? pick(PRANKS) : pick(tpl.texts).replace('{loc}', n.loc || '');
  G.calls.push({id:'C'+(++G.cseq), tpl, prank, text, node, addr:addrOf(node), t0:G.t, state:'ring', talkAt:0});
  SND.ring(); G.lastRing=G.t;
  dirty();
}
const patience = () => has('d_calm') ? 1.5 : 1;
const RING=16, TALK=30;
function answer(c){
  if(!c || c.state!=='ring' || !running()) return;
  if(G.calls.some(x=>x.state==='talk')){ say('Najprv dokonči hovor, ktorý máš na linke.'); return; }
  c.state='talk'; c.talkAt=G.t;
  if(G.t-c.t0<5) G.score+=10;
  if(!quiet()) openSheet('calls');
  dirty();
}
function dropCall(c){ G.calls=G.calls.filter(x=>x!==c); dirty(); }
const repLoss = v => v*(has('d_rep') ? .7 : 1);
function classify(c, cat){
  if(!c || c.state!=='talk' || !running()) return;
  if(c.prank){
    if(cat==='prank'){ G.score+=40; G.stats.pranks++; gainXP(4); say('Zneužitie linky odhalené. Linka je voľná pre skutočné tiesne. +40', 'good'); dropCall(c); }
    else { createIncident(c, cat); dropCall(c); }
    return;
  }
  if(cat===c.tpl.cat){ G.score+=25; gainXP(2); createIncident(c, cat); dropCall(c); return; }
  if(cat==='prank'){
    G.rep-=repLoss(15); G.stats.rejected++; SND.bad();
    say('Bol to skutočný hovor! Volajúci ostal bez pomoci. −15 dôvery', 'bad');
    dropCall(c); checkRep(); return;
  }
  G.score-=20; G.rep-=repLoss(3); G.stats.wrong++;
  say('Nesedí to – vypočuj si volajúceho ešte raz. −20', 'bad');
  const el=document.querySelector('.call.talk');
  if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  checkRep();
}
const PRANK_UNIT={med:'RZP',traffic:'PZ',fire:'HAS',tech:'HAS',hazmat:'CBRN',police:'PZ',msp:'MSP',mountain:'HZS'};
function createIncident(c, cat){
  const tpl=c.tpl, prank=c.prank, prio=prank ? 3 : tpl.prio, n=NODES[c.node];
  let needs = prank ? [PRANK_UNIT[cat]] : tpl.needs.slice();
  if(prank && !G.units.some(u=>u.kind===needs[0])) needs=['PZ'];
  const jr = n.type==='town' ? n.r*.55 : 0, ja=Math.random()*6.28, jd=Math.sqrt(Math.random())*jr;
  const inc={id:'I'+(++G.seq), no:G.seq, cat, title: prank ? CATS[cat].label : tpl.title, prio, needs, prank,
    work: prank ? 5 : tpl.work, tr: !prank && !!tpl.tr, search: !prank && !!tpl.search,
    node:c.node, x:n.x+Math.cos(ja)*jd, z:n.z+Math.sin(ja)*jd, addr:c.addr, text:c.text,
    created:G.t, deadline:0, progress:0, metAt:0, frac:0, units:[]};
  /* limit = základ podľa priority + dojazd najbližšej vhodnej posádky z jej základne */
  let worst=0;
  for(const need of needs){
    let best=Infinity;
    for(const u of G.units) if(fits(u, need)){
      const ghost={...u, x:NODES[u.home].x, z:NODES[u.home].z, node:u.home, path:[], status:2};
      best=Math.min(best, etaTo(ghost, inc, {}));
    }
    if(best<Infinity) worst=Math.max(worst, best);
  }
  inc.deadline = G.t + DL_BASE[prio] + 1.3*worst + 4*(needs.length-1);
  G.incs.push(inc);
  if(!quiet()) select(inc.id, true);
  if(!quiet() && !prank && prio===3 && has('d_auto')) sendRecommended(inc);
  SND.blip();
}
function select(id, auto){
  G.sel.inc=id; G.sel.unit=null;
  if(id && !quiet()) openSheet('incs');
  const inc=incById(id);
  if(inc && !quiet() && (!auto || offScreen(inc.x, inc.z))) focusOn(inc.x, inc.z);   // nová udalosť mimo obrazovky → kamera sa k nej presunie
  dirty();
}
function offScreen(x,z){
  if(!R3) return false;
  V3.set(x, groundY(x,z), z).project(camera);
  return V3.z>1 || Math.abs(V3.x)>.8 || Math.abs(V3.y)>.8;
}
/* ---------- výsledky zásahov ---------- */
function removeInc(inc){ G.incs=G.incs.filter(x=>x!==inc); if(G.sel.inc===inc.id) G.sel.inc=null; dropIncMesh(inc.id); dirty(); }
function releaseUnits(inc, keep){ for(const id of inc.units){ const u=unitById(id); if(u && u!==keep && u.inc===inc.id) goHome(u); } }
function nearestHospital(u){
  const {d}=dijkstra(u.node, u);
  return HOSPITALS.reduce((a,h)=>d[h]<d[a] ? h : a);
}
function workRate(inc){
  let k=1;
  const on=inc.units.map(unitById).filter(u=>u && u.inc===inc.id && u.status===4);
  if(inc.cat==='med' && on.some(u=>KINDS[u.kind].doc)) k*=1/.75;   // lekár na mieste
  if((inc.cat==='traffic' || inc.cat==='tech') && has('h_tech')) k*=1/.7;
  if(inc.cat==='hazmat' && has('h_deko')) k*=1/.7;
  if(inc.cat==='mountain' && has('s_rope')) k*=1/.7;
  if(inc.search && has('p_dog')) k*=1/.6;
  return k;
}
function gainXP(x){
  if(quiet()) return;
  x=Math.round(x); PROG.xp+=x; G.stats.xp+=x;
  while(PROG.xp>=xpNeed(PROG.level)){
    PROG.xp-=xpNeed(PROG.level); PROG.level++; PROG.points++;
    say('Postup na úroveň '+PROG.level+'! Máš nový bod na schopnosti.', 'good'); SND.level();
  }
  saveProg(); dirty();
}
function resolve(inc){
  const pts=Math.round(BASE_PTS[inc.prio]*(.5+.5*inc.frac));
  G.score+=pts; G.rep=Math.min(100, G.rep+REP_OK[inc.prio]);
  G.stats.resolved++; G.stats.resp.push(inc.metAt-inc.created);
  gainXP(pts/8);
  fx(inc.x, inc.z, '+'+pts, 'good'); burst(inc.x, inc.z, 0x3ddc97);
  let tr=null;
  if(inc.tr) tr=inc.units.map(unitById).find(u=>u && u.inc===inc.id && u.status===4 && ['RZP','RLP','LZS','HZS'].includes(u.kind)) || null;
  releaseUnits(inc, tr);
  if(tr){ const h=nearestHospital(tr); tr.inc=null; tr.hosp=NODES[h].name; setStatus(tr,5); routeTo(tr, h); }
  removeInc(inc); SND.ok();
}
function fail(inc){
  if(inc.prank){ say('#'+inc.no+': ukázalo sa, že hovor bol zneužitie linky.'); releaseUnits(inc); removeInc(inc); return; }
  const loss=repLoss(REP_FAIL[inc.prio]);
  G.rep-=loss; G.stats.failed++;
  fx(inc.x, inc.z, 'Neskoro', 'bad'); burst(inc.x, inc.z, 0xff4d5e);
  say('#'+inc.no+' '+inc.title+': pomoc neprišla včas. −'+Math.round(loss)+' dôvery', 'bad');
  releaseUnits(inc); removeInc(inc); SND.bad(); checkRep();
}
function wasted(inc){
  G.score-=40; G.rep-=repLoss(5); G.stats.wasted++;
  fx(inc.x, inc.z, 'Planý výjazd', 'bad');
  say('Na mieste nikto nie je – hovor bol zneužitie linky. −40', 'bad');
  releaseUnits(inc); removeInc(inc); SND.bad(); checkRep();
}
function checkRep(){ if(G.rep<=0){ G.rep=0; endGame(); } dirty(); }

/* ukážková služba v pozadí úvodnej obrazovky – hrá sama */
function demoBot(){
  if(G.t<G.bot) return;
  G.bot=G.t+.9;
  const talk=G.calls.find(c=>c.state==='talk');
  if(talk){ if(G.t-talk.talkAt>1.2) classify(talk, talk.prank ? 'prank' : talk.tpl.cat); }
  else { const r=G.calls.find(c=>c.state==='ring' && G.t-c.t0>1.5); if(r) answer(r); }
  for(const inc of G.incs) for(const c of recommended(inc)) dispatch(c.u, inc);
}
function step(dt){
  G.t+=dt;
  if(G.t>=G.nextCall){
    spawnCall();
    const base=lerp(13, 6.5, clamp(G.t/900,0,1)) * TEMPO[G.tempo].k * (G.calls.length>=3 ? 1.6 : 1);
    G.nextCall=G.t + base*(.7+Math.random()*.6);
  }
  const P=patience();
  for(const c of [...G.calls]){
    if(c.state==='ring' && G.t-c.t0>RING*P){
      dropCall(c);
      if(!c.prank){ G.rep-=repLoss(8); G.stats.hung++; say('Volajúci zložil – nikto nezdvihol. −8 dôvery', 'bad'); SND.bad(); checkRep(); }
    } else if(c.state==='talk' && G.t-c.talkAt>TALK*P){
      dropCall(c);
      if(!c.prank){ G.rep-=repLoss(5); G.stats.hung++; say('Volajúci to vzdal – hovor trval príliš dlho. −5 dôvery', 'bad'); checkRep(); }
    }
  }
  if(!running()) return;
  if(G.mode==='demo') demoBot();
  if(G.calls.some(c=>c.state==='ring') && G.t-G.lastRing>3){ SND.ring(); G.lastRing=G.t; }
  for(const u of G.units){
    if(u.moving) moveUnit(u, dt);
    if(u.status===6 && G.t>=u.waitUntil){ u.hosp=null; goHome(u); }
  }
  for(const inc of [...G.incs]){
    const info=needInfo(inc);
    if(info.met){
      if(!inc.metAt){ inc.metAt=G.t; inc.frac=clamp((inc.deadline-G.t)/(inc.deadline-inc.created),0,1); dirty(); }
      inc.progress+=dt*workRate(inc);
      if(inc.progress>=inc.work) resolve(inc);
    } else if(!inc.metAt && G.t>inc.deadline) fail(inc);
    if(!running()) return;
  }
}

function buildTerrain(){
  const W=330, D=230, SX=250, SZ=175;
  const geo=new THREE.PlaneGeometry(W, D, SX, SZ); geo.rotateX(-Math.PI/2);
  geo.translate(-2, 0, 2);
  const pos=geo.attributes.position, col=new Float32Array(pos.count*3), c=new THREE.Color(), R=rng(3);
  const fields=[0x6c9145,0x7e9e4c,0x94a157,0x628a41,0x9f9c5b].map(h=>new THREE.Color(h));
  const forest=new THREE.Color(0x2f5a33), forest2=new THREE.Color(0x24482a), rock=new THREE.Color(0x8a8f7a), water=new THREE.Color(0x2a6aa0), out=new THREE.Color(0x4a5368);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i), h=heightKm(x,z);
    pos.setY(i, h*EXAG);
    const cell=Math.floor(x/1.6)*7919+Math.floor(z/1.6)*104729, f=fields[Math.abs(cell)%fields.length], fn=fbm(x*.09+3,z*.09+9);
    const wood=clamp((h-.33)/.18,0,1), peak=clamp((h-1.05)/.25,0,1);
    c.copy(fields[0]).lerp(fields[2], clamp(fn*1.6-.4,0,1)).lerp(f,.28).lerp(fbm(x*.3,z*.3)>.5 ? forest : forest2, wood).lerp(rock, peak);
    if(riverDist(x,z)<.5) c.lerp(water,.5);
    if(!inRegion(x,z)) c.lerp(out,.62).multiplyScalar(.72);
    c.multiplyScalar(.9+R()*.12);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  geo.computeVertexNormals();
  terrain=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors:true, roughness:.95, metalness:0}));
  terrain.receiveShadow=true; scene.add(terrain);
}
/* pás (rieka, cesta, hranica) kopírujúci terén */
function ribbon(pts, width, lift, step=.5){
  const dense=[];
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i], n=Math.max(1, Math.ceil(Math.hypot(b.x-a.x,b.z-a.z)/step));
    for(let k=(i===1?0:1);k<=n;k++) dense.push({x:lerp(a.x,b.x,k/n), z:lerp(a.z,b.z,k/n)});
  }
  const v=[], idx=[];
  dense.forEach((p,i)=>{
    const q=dense[Math.min(i+1,dense.length-1)], o=dense[Math.max(i-1,0)];
    let dx=q.x-o.x, dz=q.z-o.z; const l=Math.hypot(dx,dz)||1; dx/=l; dz/=l;
    const nx=-dz*width/2, nz=dx*width/2;
    v.push(p.x+nx, groundY(p.x+nx,p.z+nz)+lift, p.z+nz, p.x-nx, groundY(p.x-nx,p.z-nz)+lift, p.z-nz);
    if(i>0){ const b=(i-1)*2; idx.push(b,b+1,b+2, b+1,b+3,b+2); }
  });
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v,3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function mergeGeos(list){
  let total=0, itotal=0; for(const g of list){ total+=g.attributes.position.count; itotal+=g.index.count; }
  const pos=new Float32Array(total*3), idx=new Uint32Array(itotal); let o=0, io=0;
  for(const g of list){ pos.set(g.attributes.position.array, o*3); const ix=g.index.array; for(let i=0;i<ix.length;i++) idx[io+i]=ix[i]+o; o+=g.attributes.position.count; io+=ix.length; }
  const m=new THREE.BufferGeometry(); m.setAttribute('position', new THREE.BufferAttribute(pos,3)); m.setIndex(new THREE.BufferAttribute(idx,1)); m.computeVertexNormals();
  return m;
}
function buildWater(){

function buildBorder(){

  for(let i=1;i<P.length;i++){ const a=P[i-1], b=P[i], n=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.z-a.z)/.6)); for(let k=0;k<n;k++) dense.push({x:lerp(a.x,b.x,k/n), z:lerp(a.z,b.z,k/n)}); }
  dense.push(dense[0]);
  const v=[], c=[], idx=[], top=new THREE.Color(0x000000), bot=new THREE.Color(0xf2b33d);
  dense.forEach((p,i)=>{ const y=groundY(p.x,p.z); v.push(p.x,y+.05,p.z, p.x,y+1.6,p.z); c.push(bot.r,bot.g,bot.b, top.r,top.g,top.b); if(i>0){ const b=(i-1)*2; idx.push(b,b+1,b+2, b+1,b+3,b+2); } });
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v,3)); g.setAttribute('color', new THREE.Float32BufferAttribute(c,3)); g.setIndex(idx);
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true, transparent:true, opacity:.75, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, fog:false})));
  const lg=new THREE.BufferGeometry().setFromPoints(dense.map(p=>new THREE.Vector3(p.x, groundY(p.x,p.z)+.1, p.z)));

}
function buildRoads(){
  const N=id=>NODES[id];
  const main=[], road=[], trail=[];
  for(const e of EDGES){ const pts=[N(e.a),N(e.b)]; (e.t==='M' ? main : e.t==='R' ? road : trail).push(pts); }
  const mat=(c,em)=>new THREE.MeshStandardMaterial({color:c, roughness:.8, emissive:em||0x000000, emissiveIntensity:1, polygonOffset:true, polygonOffsetFactor:-3});
  scene.add(new THREE.Mesh(mergeGeos(main.map(p=>ribbon(p,.75,.07))), mat(0x3a3f4a, 0x241a06)));
  scene.add(new THREE.Mesh(mergeGeos(main.map(p=>ribbon(p,.12,.09))), new THREE.MeshBasicMaterial({color:0xf2b33d, polygonOffset:true, polygonOffsetFactor:-4})));
  scene.add(new THREE.Mesh(mergeGeos(road.map(p=>ribbon(p,.5,.07))), mat(0x4a4f58)));
  for(const p of trail){
    const g=new THREE.BufferGeometry().setFromPoints(ribbonLine(p));
    const l=new THREE.Line(g, new THREE.LineDashedMaterial({color:0xffe4c4, dashSize:.5, gapSize:.4})); l.computeLineDistances(); scene.add(l);
  }
}
function ribbonLine([a,b]){ const n=Math.ceil(Math.hypot(b.x-a.x,b.z-a.z)/.4), out=[]; for(let k=0;k<=n;k++){ const x=lerp(a.x,b.x,k/n), z=lerp(a.z,b.z,k/n); out.push(new THREE.Vector3(x, groundY(x,z)+.12, z)); } return out; }
function buildTowns(){
  const R=rng(42), mats=[];
  const towns=Object.values(NODES).filter(n=>n.type==='town');
  let count=0; for(const n of towns) count+=Math.round(clamp(Math.sqrt(n.pop)/2.2, 8, 230));
  const geo=new THREE.BoxGeometry(1,1,1); geo.translate(0,.5,0);
  buildingsMat=new THREE.MeshStandardMaterial({color:0xffffff, roughness:.85, emissive:0xffb35a, emissiveIntensity:0});
  const im=new THREE.InstancedMesh(geo, buildingsMat, count);
  im.castShadow=true; im.receiveShadow=true;
  const m=new THREE.Matrix4(), q=new THREE.Quaternion(), s=new THREE.Vector3(), p=new THREE.Vector3(), col=new THREE.Color();
  const palette=[0xd9d4c7,0xc9c2b4,0xe6dfcf,0xb9b4aa,0xd0c6b8,0xe9e3d6].map(h=>new THREE.Color(h)), roofRed=new THREE.Color(0xa8553a);
  let i=0;
  for(const n of towns){
    const k=Math.round(clamp(Math.sqrt(n.pop)/2.2, 8, 230)), big=n.pop>30000;
    for(let j=0;j<k;j++){
      const a=R()*Math.PI*2, d=Math.pow(R(),.7)*n.r;
      const x=n.x+Math.cos(a)*d, z=n.z+Math.sin(a)*d;
      const panel=big && R()<.45 && d>n.r*.25;
      const w=panel ? .18+R()*.12 : .12+R()*.14, l=panel ? .5+R()*.5 : .12+R()*.16;
      const h=panel ? .35+R()*.55 : (big && d<n.r*.3 ? .15+R()*.25 : .08+R()*.12);
      q.setFromAxisAngle(new THREE.Vector3(0,1,0), R()*Math.PI); s.set(w,h,l); p.set(x, groundY(x,z)-.02, z);
      m.compose(p,q,s); im.setMatrixAt(i,m);
      col.copy(panel ? palette[Math.floor(R()*3)] : (R()<.4 ? roofRed : palette[Math.floor(R()*palette.length)])); im.setColorAt(i,col);
      i++;
    }
    const g=glowSprite(0xffb35a, n.r*4.2, .0); g.position.set(n.x, groundY(n.x,n.z)+.6, n.z); g.userData.base=clamp(.35+n.pop/400000,.35,.9); scene.add(g); townGlows.push(g);
  }
  im.count=i; im.instanceMatrix.needsUpdate=true; if(im.instanceColor) im.instanceColor.needsUpdate=true;
  scene.add(im);
}

function mkLabel(cls, html, x, y, z, act, maxD){

function buildStaticLabels(){
  for(const n of Object.values(NODES)){
    if(n.type==='town'){ const L=mkLabel('town'+(n.pop>30000?' big':''), esc(n.name), n.x, n.y+1.6, n.z, null, n.pop>=30000 ? 0 : n.pop>=6000 ? 300 : 190); L.pop=n.pop; staticLabels.push(L); }
    else if(n.type==='poi') staticLabels.push(mkLabel('poi '+n.poi, esc(n.name), n.x, n.y+.8, n.z, null, 165));
    else if(n.poi==='border') staticLabels.push(mkLabel('poi border', esc(n.name.replace(' – hraničný priechod','')), n.x, n.y+.8, n.z, null, 165));
  }
  for(const h of HOSPITALS){ const n=NODES[h]; const L=mkLabel('hosp','H', n.x+n.r*.7, n.y+2, n.z-n.r*.4, null, 230); L.keep=true; staticLabels.push(L); }
  /* dôležitejšie popisky (väčšie mestá) majú prednosť pri prekrytí */
  const rank = L => L.keep ? 0 : L.el.classList.contains('town') ? 1+1/(1+(L.pop||0)) : 3;
  staticLabels.sort((a,b)=>rank(a)-rank(b));
}
/* popisky, ktoré by sa prekrývali s dôležitejšími, sa skryjú */
function declutter(){
  const placed=[];
  for(const L of staticLabels){
    if(L.keep || L.el.style.display==='none') continue;
    if(!L.w){ L.w=L.el.offsetWidth; L.h=L.el.offsetHeight; }
    const r=[L.sx-L.w/2-4, L.sy-L.h-2, L.sx+L.w/2+4, L.sy+2];
    const hide=placed.some(q=>r[0]<q[2] && r[2]>q[0] && r[1]<q[3] && r[3]>q[1]);
    const v=hide ? 'hidden' : '';
    if(L.el.style.visibility!==v) L.el.style.visibility=v;
    if(!hide) placed.push(r);
  }
}
const V3=window.THREE ? new THREE.Vector3() : null;
let LW=1, LH=1, CD=0, LODK=1;   // LODK: na malej obrazovke sa popisky skrývajú skôr   // rozmery vrstvy popiskov a vzdialenosť kamery – čítajú sa raz za snímok
function placeLabel(L, extraY=0){
  V3.set(L.x, L.y+extraY, L.z).project(camera);
  const vis = V3.z<1 && V3.x>-1.1 && V3.x<1.1 && V3.y>-1.1 && V3.y<1.1 && !(L.maxD && CD>L.maxD*LODK);
  if(!vis){ if(L.el.style.display!=='none') L.el.style.display='none'; return; }
  if(L.el.style.display==='none') L.el.style.display='';
  const x=(V3.x+1)/2*LW, y=(1-V3.y)/2*LH; L.sx=x; L.sy=y;
  L.el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)`;
  L.el.style.zIndex=String(1000-Math.round(V3.z*1000));
}

function box(w,h,l,color,em){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,l), new THREE.MeshStandardMaterial({color, roughness:.5, metalness:.2, emissive:em||0x000000})); m.castShadow=true; return m; }
function vehicleModel(kind){
  const g=new THREE.Group(), K=KINDS[kind], S=1.8;
  const body=new THREE.Group(); g.add(body);

let addP=null, norP=null;
function particleSystem(n, additive){
  const g=new THREE.BufferGeometry();
  const pos=new Float32Array(n*3), col=new Float32Array(n*3), al=new Float32Array(n), sz=new Float32Array(n);
  g.setAttribute('position', new THREE.BufferAttribute(pos,3)); g.setAttribute('pcolor', new THREE.BufferAttribute(col,3));
  g.setAttribute('alpha', new THREE.BufferAttribute(al,1)); g.setAttribute('size', new THREE.BufferAttribute(sz,1));
  const mat=new THREE.ShaderMaterial({
    uniforms:{map:{value:glowTex}, scale:{value:400}},
    vertexShader:'attribute vec3 pcolor; attribute float alpha; attribute float size; uniform float scale; varying vec3 vC; varying float vA;'+
      'void main(){ vC=pcolor; vA=alpha; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=min(size*scale/max(1.0,-mv.z),70.0); gl_Position=projectionMatrix*mv; }',
    fragmentShader:'uniform sampler2D map; varying vec3 vC; varying float vA; void main(){ vec4 t=texture2D(map, gl_PointCoord); gl_FragColor=vec4(vC, t.a*vA); if(gl_FragColor.a<.01) discard; }',
    transparent:true, depthWrite:false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
  });
  const pts=new THREE.Points(g, mat); pts.frustumCulled=false; scene.add(pts);
  return {pts, n, pos, col, al, sz, list:[], g};
}
function buildParticles(){ addP=particleSystem(700, true); norP=particleSystem(300, false); }
function emit(S, x,y,z, vx,vy,vz, life, size, r,gc,b){ if(S && S.list.length<S.n) S.list.push({x,y,z,vx,vy,vz,life:0,max:life,size,r,g:gc,b}); }
function burst(x,z,hex){ if(!addP) return; const c=new THREE.Color(hex), y=groundY(x,z)+1; for(let i=0;i<40;i++){ const a=Math.random()*6.28, v=rand(1,4); emit(addP, x,y,z, Math.cos(a)*v, rand(1,5), Math.sin(a)*v, rand(.6,1.2), rand(.8,1.6), c.r,c.g,c.b); } }
function stepParticles(S, dt){
  let j=0;
  for(const p of S.list){
    p.life+=dt; if(p.life>=p.max) continue;
    p.vy-= S===addP ? .6*dt : -.1*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    const k=p.life/p.max;
    S.pos[j*3]=p.x; S.pos[j*3+1]=p.y; S.pos[j*3+2]=p.z;
    S.col[j*3]=p.r; S.col[j*3+1]=p.g*(S===addP ? 1-k*.6 : 1); S.col[j*3+2]=p.b*(1-k*.5);

  S.g.setDrawRange(0, Math.max(1,j));

function unitWhat(u){
  const inc=u.inc ? incById(u.inc) : null;
  if(u.status===3 && inc) return `→ #${inc.no} ${inc.title} · ${fmtMin(etaPath(u))}`;
  if(u.status===4 && inc) return `zasahuje na #${inc.no}, ${inc.addr}`;
  if(u.status===5) return `vezie pacienta: ${u.hosp} · ${fmtMin(etaPath(u))}`;
  if(u.status===6) return `odovzdáva pacienta: ${u.hosp}`;
  if(u.status===1) return `vracia sa na základňu · ${fmtMin(etaPath(u))}`;
  return 'základňa '+NODES[u.home].name;
}
const unitLine = u => u.status===2 ? NODES[u.home].name : unitWhat(u);

const UFILTERS=[['all','Všetky'],['free','Voľné'],['zzs','Záchranka'],['has','Hasiči'],['pz','Polícia'],['hzs','Horská']];
const UF_KINDS={zzs:['RZP','RLP','RV','LZS'], has:['HAS','CBRN'], pz:['PZ','MSP'], hzs:['HZS']};
let UF='all';
const ufMatch = u => UF==='all' || (UF==='free' ? u.status<=2 : UF_KINDS[UF].includes(u.kind));
function renderUnits(){
  const sel=incById(G.sel.inc), kinds=sel ? needKinds(sel) : null;
  const avail=UFILTERS.filter(([k])=>k==='all' || k==='free' || G.units.some(u=>UF_KINDS[k].includes(u.kind)));

let lastScore=null, lastRep=null;
function updateTimers(){
  const demo=G.mode==='demo';
  $('#clock').textContent=demo ? '0:00' : clockOf(G.t);
  const sc=demo ? 0 : G.score;
  if(sc!==lastScore){ lastScore=sc; $('#score').textContent=sc; }
  const rep=demo ? 100 : Math.max(0,Math.round(G.rep));
  if(rep!==lastRep){ lastRep=rep; $('#repBar').style.width=rep+'%'; $('#repTxt').textContent=rep+' %'; $('#repBox').classList.toggle('low', rep<35); }
  for(const el of document.querySelectorAll('.rail [data-to]')){
    const to=+el.dataset.to;
    if(el.dataset.txt) el.textContent=fmtMin(to-G.t);
    else { const from=+el.dataset.from; el.style.width=(clamp((to-G.t)/(to-from),0,1)*100)+'%'; }
  }
  for(const el of document.querySelectorAll('[data-work]')){ const inc=incById(el.dataset.work); if(inc) el.style.width=(clamp(inc.progress/inc.work,0,1)*100)+'%'; }
}

function buySkill(id){
  const s=SKILLS.find(x=>x.id===id);
  if(!s || has(id) || !s.req.every(has) || PROG.points<s.cost) return;
  PROG.points-=s.cost; PROG.skills.push(id); saveProg();
  for(const d of UNITS_DEF) if(d[3]===id && !G.units.some(u=>u.id===d[0])){ G.units.push(makeUnit(d)); }
  SND.level(); dirty(); if(showSkills.draw) showSkills.draw();
}

/* telefón: záložky dolného panelu; ťuknutie na otvorenú záložku panel zbalí */
const isPhone = () => window.innerWidth<=860;
const wideLandscape = () => isPhone() && window.innerHeight<=520 && window.innerWidth>window.innerHeight;
function setTab(t){
  const app=$('#app');
  if(app.dataset.tab===t && app.dataset.sheet!=='min' && !wideLandscape()) app.dataset.sheet='min';
  else { app.dataset.tab=t; if(app.dataset.sheet==='min') app.dataset.sheet='half'; }

}
function openSheet(t){ if(!isPhone()) return; const app=$('#app'); app.dataset.tab=t; if(app.dataset.sheet==='min') app.dataset.sheet='half'; syncTabs(); }
function syncTabs(){
  const app=$('#app'), open=app.dataset.sheet!=='min' || wideLandscape();
  for(const [id,t] of [['tabCalls','calls'],['tabIncs','incs'],['tabUnits','units']]) $('#'+id).classList.toggle('on', open && app.dataset.tab===t);
  $('#btnGrip').textContent = app.dataset.sheet==='full' ? '▾' : '▴';

/* ---------- ovládanie ---------- */
let resetArmed=0;
function act(el){
  const a=el.dataset.act, id=el.dataset.id;
  if(a==='start') return start(el.dataset.tempo);
  if(a==='menu'){ restartDemo(); showMenu(); return dirty(); }
  if(a==='tab') return setTab(el.dataset.tab);
  if(a==='grip'){ const app=$('#app'); app.dataset.sheet = app.dataset.sheet==='half' ? 'full' : 'half'; return syncTabs(); }
  if(a==='more'){ const app=$('#app'), on=app.dataset.more!=='1'; app.dataset.more=on ? '1' : ''; el.setAttribute('aria-expanded', String(on)); return; }
  if(a==='uf'){ UF=el.dataset.id; return dirty(); }
  if(a==='mute'){ muted=!muted; el.textContent=muted ? 'Zvuk vyp.' : 'Zvuk'; return; }
  if(a==='light'){ const ks=Object.keys(LIGHTS); PROG.light=ks[(ks.indexOf(PROG.light)+1)%ks.length]; saveProg(); return applyLight(); }
  if(a==='view') return viewAll();
  if(a==='skills') return showSkills();
  if(a==='closeSkills') return closeSkills();
  if(a==='buy') return buySkill(id);
  if(a==='reset'){
    if(Date.now()-resetArmed>4000){ resetArmed=Date.now(); el.textContent='Naozaj vymazať? Klikni znova.'; return; }
    PROG={v:1, xp:0, level:1, points:1, skills:[], best:0, light:PROG.light, sessions:0}; saveProg(); restartDemo(); showMenu(); return dirty();
  }
  if(a==='pause' || a==='resume') return togglePause();
  if(a==='quit'){ G.mode='play'; return endGame(); }
  if(a==='speed'){ if(G.mode!=='play') return; G.speed = G.speed===1 ? 2 : G.speed===2 ? 4 : 1; el.textContent='×'+G.speed; return; }
  if(G.mode!=='play') return;
  if(a==='answer') answer(callById(id));
  else if(a==='cls') classify(callById(id), el.dataset.type);
  else if(a==='inc') select(G.sel.inc===id ? null : id);
  else if(a==='desel'){ G.sel.inc=null; dirty(); }
  else if(a==='send') dispatch(unitById(el.dataset.unit), incById(id));
  else if(a==='sendall') sendRecommended(incById(id));
  else if(a==='unit') unitClick(unitById(id));
}
function unitClick(u){
  if(!u) return;
  const inc=incById(G.sel.inc);
  if(inc && dispatchable(u, inc)) return dispatch(u, inc);
  G.sel.unit = G.sel.unit===u.id ? null : u.id; dirty();
  if(G.sel.unit) focusOn(u.x, u.z);
}
/* akcia sa vykoná pri pustení prsta/myši na tom istom prvku */
let down=null;
const keyOf = el => ['act','id','type','unit','tempo','tab'].map(k=>el.dataset[k]||'').join('|');
document.addEventListener('pointerdown', e=>{
  audio();
  const el=e.target.closest('[data-act]');
  down = el && !el.disabled ? {key:keyOf(el), x:e.clientX, y:e.clientY} : null;
});
document.addEventListener('pointerup', e=>{
  if(!down) return;
  const d=down; down=null;
  if(Math.hypot(e.clientX-d.x, e.clientY-d.y)>12) return;
  const t=document.elementFromPoint(e.clientX, e.clientY), el=t && t.closest('[data-act]');
  if(el && !el.disabled && keyOf(el)===d.key){ e.preventDefault(); act(el); }
});
document.addEventListener('pointercancel', ()=>{ down=null; });
document.addEventListener('click', e=>{ if(e.detail!==0) return; const el=e.target.closest('[data-act]'); if(el && !el.disabled) act(el); });
document.addEventListener('keydown', e=>{
  if(!G) return;
  const onBtn=e.target.closest && e.target.closest('button');
  if(e.key===' '){ if(onBtn) return; e.preventDefault(); if(G.mode==='play' || (G.mode==='pause' && !$('#overlay').dataset.resume)) togglePause(); return; }
  if(G.mode!=='play' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k=e.key.toLowerCase();
  if(k==='a'){ answer(G.calls.find(c=>c.state==='ring')); }
  else if(k.length===1 && k>='1' && k<='9'){ const cats=CAT_ORDER.filter(catOpen); const c=cats[+k-1]; if(c) classify(G.calls.find(c=>c.state==='talk'), c); }
  else if(k==='enter' && !onBtn){ const inc=incById(G.sel.inc); if(inc){ e.preventDefault(); sendRecommended(inc); } }
  else if(k==='escape'){ G.sel.inc=null; G.sel.unit=null; dirty(); }
});
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && G && G.mode==='play') togglePause(); });

/* ---------- slučka ---------- */
let last=performance.now(), lastUI=0;
function frame(now){
  const dt=Math.min(.1, (now-last)/1000); last=now;
  if(running()){
    let left=dt*G.speed;
    while(left>0 && running()){ const s=Math.min(.05,left); step(s); left-=s; }
  }
  render3D(now);
  if(uiDirty || (running() && now-lastUI>450)){ uiDirty=false; lastUI=now; renderUI(); }
  updateTimers();
  requestAnimationFrame(frame);
}

/* ---------- štart ---------- */
$('#legend').innerHTML=[1,2,3,4,5,6].map(s=>`<span style="--sc:var(--s${s})">${s} ${STATUS[s]}</span>`).join('');
G=newGame('normal','demo');
init3D();
new ResizeObserver(()=>{ resize3D(); }).observe($('#mapbox'));
showMenu();
renderUI();
requestAnimationFrame(frame);
</script>
