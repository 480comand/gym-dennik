<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Linka 155</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Barlow+Condensed:wght@700;800&display=swap">
<style>
  :root{
    /* Vzhľad A – pracovná stanica: svetlé pozadie, biele karty, jedna modrá; červená, oranžová, zelená a modrošedá len pre naliehavosť K/N/M/O */
    --ink:#EEF1F5; --panel:#FFFFFF; --card:#F7F9FB; --line:#DCE2EA;
    --text:#14202E; --muted:#5B6878; --on-c:#FFFFFF;
    --sodium:#0F5FA8; --on-sodium:#FFFFFF; --soft:#E8F0FA; --soft-t:#0B4A84;
    --good:#15803D; --bad:#B91C1C;
    --p1:#B91C1C; --p2:#C2410C; --p3:#15803D; --p4:#4A5F86;
    --s1:#15803D; --s2:#0E7C86; --s3:#C2410C; --s4:#B91C1C; --s5:#7C3AED; --s6:#2563EB;
    --t-med:#BE123C; --t-traffic:#A16207; --t-fire:#C2410C; --t-tech:#8A6A35; --t-hazmat:#4D7C0F;
    --t-police:#1D4ED8; --t-msp:#0E7C86; --t-mountain:#B4532A; --t-prank:#5B6878;
    --shadow:0 1px 2px rgba(20,32,46,.06), 0 4px 14px rgba(20,32,46,.06);
    --f-display:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",sans-serif;
    --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{height:100%; margin:0; background:var(--ink); color:var(--text); font-family:var(--f-body); font-size:15px; line-height:1.4;}
  body{overflow:hidden; -webkit-tap-highlight-color:transparent;}
  button{font:inherit; color:inherit;}
  kbd{font:600 10px var(--f-mono); border:1px solid currentColor; border-radius:4px; padding:0 4px; opacity:.7;}
  .ico{width:18px; height:18px; flex:none; display:inline-block; vertical-align:-3px;}

  .app{position:relative; height:100%; display:grid; gap:12px;
    grid-template-columns:minmax(290px,340px) minmax(0,1fr) minmax(250px,300px);
    grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"bar bar bar" "left map right";
    padding-block:12px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    background:var(--ink);}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; font-weight:600; font-size:14px;
    border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text);
    padding:8px 12px; min-height:38px; cursor:pointer; user-select:none; touch-action:manipulation;}
  .btn:hover{border-color:#B7C2CF;}
  .btn:focus-visible{outline:2px solid var(--sodium); outline-offset:2px;}
  .btn:disabled{opacity:.4; cursor:default;}
  .btn.go{background:var(--sodium); border-color:var(--sodium); color:var(--on-sodium);} .btn.go:hover{background:#0B4A84; border-color:#0B4A84;}
  .btn.ghost{background:transparent;}
  .btn.sm{min-height:30px; padding:5px 9px; font-size:13px;}
  .btn .badge{font:700 11px var(--f-mono); background:var(--bad); color:#fff; border-radius:999px; padding:0 6px; line-height:17px;}

  /* ---------- horný pás ---------- */
  .bar{grid-area:bar; display:flex; align-items:center; gap:10px 20px; flex-wrap:wrap; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:8px 14px; box-shadow:var(--shadow);}
  .brand{font:700 24px/1 var(--f-display); letter-spacing:.01em;}
  .brand b{color:var(--sodium);}
  .brand small{display:block; font:500 11px var(--f-body); letter-spacing:.02em; color:var(--muted); margin-top:3px;}
  .k{font:600 10.5px var(--f-body); letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
  .clock{font:600 26px/1 var(--f-mono); font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:8px;}
  .live{width:9px; height:9px; border-radius:50%; background:var(--bad); animation:blink 1.2s steps(2,start) infinite;}
  .app:not([data-mode="play"]) .live{visibility:hidden;}
  @keyframes blink{to{opacity:.25;}}
  .track{height:6px; background:var(--line); border-radius:3px; overflow:hidden;}
  .track i{display:block; height:100%; width:0; background:var(--sodium); border-radius:3px; transition:width .3s;}
  .lvl{display:grid; gap:5px; width:150px;}
  .lvl .v{font:600 16px/1 var(--f-body);}
  .stat .v{font:600 22px/1.05 var(--f-mono); font-variant-numeric:tabular-nums;}
  .rep{width:120px; display:grid; gap:6px;}
  .rep .track{height:9px;}
  .rep .track i{background:var(--good);}
  .rep.low .track i{background:var(--bad);}
  .spacer{flex:1;}
  .ctrl{display:flex; gap:6px; flex-wrap:wrap;}

  /* ---------- bočné panely ---------- */
  .rail{background:var(--panel); border:1px solid var(--line); border-radius:12px; min-height:0; overflow:auto; box-shadow:var(--shadow);
    padding:12px; display:flex; flex-direction:column; gap:16px; overscroll-behavior:contain;}
  .rail-left{grid-area:left;} .rail-right{grid-area:right;}
  .sec{display:grid; gap:8px; min-width:0;}
  .sec h2{font:600 12px/1 var(--f-body); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:0; display:flex; align-items:center; gap:8px;}
  .count{font:600 11px var(--f-mono); letter-spacing:0; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--text);}
  .empty{margin:0; color:var(--muted); font-size:14px;}
  .row{display:flex; align-items:center; gap:8px; min-width:0;}
  .grow{flex:1; min-width:0;}

  .call{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; display:grid; gap:9px;}
  .call.ring{border-color:var(--sodium); animation:ring 1s ease-in-out infinite;}
  .call.ring .phone{color:var(--sodium); animation:wiggle .5s ease-in-out infinite; display:inline-flex;}
  @keyframes ring{50%{box-shadow:0 0 0 3px color-mix(in srgb, var(--sodium) 30%, transparent), 0 0 24px color-mix(in srgb, var(--sodium) 25%, transparent);}}
  @keyframes wiggle{25%{transform:rotate(-14deg);}75%{transform:rotate(14deg);}}
  .call.talk{border-color:var(--sodium); background:var(--panel);}
  .call.shake{animation:shake .35s;}
  @keyframes shake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .lbl{font:600 11px var(--f-body); letter-spacing:.06em; text-transform:uppercase; color:var(--sodium); display:flex; align-items:center; gap:7px;}
  .wave{display:inline-flex; align-items:center; gap:2px; height:14px;}
  .wave i{width:3px; height:100%; background:var(--sodium); border-radius:2px; animation:wave .9s ease-in-out infinite;}
  .wave i:nth-child(2){animation-delay:-.2s;} .wave i:nth-child(3){animation-delay:-.45s;} .wave i:nth-child(4){animation-delay:-.65s;} .wave i:nth-child(5){animation-delay:-.3s;}
  @keyframes wave{0%,100%{transform:scaleY(.25);}50%{transform:scaleY(1);}}
  .quote{margin:0; font-size:16px; line-height:1.45;}
  .quote::before{content:"„";} .quote::after{content:"“";}
  .addr{font:500 12px var(--f-mono); color:var(--muted);}
  .call>.row>.lbl{flex:0 0 auto; white-space:nowrap;} .call>.row>.addr{flex:1 1 0; min-width:0; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* rozhovor s volajúcim */
  .log{display:grid; gap:6px; max-height:230px; overflow:auto; overscroll-behavior:contain;}
  .m{margin:0; padding:7px 10px; border-radius:10px; font-size:15px; line-height:1.4; max-width:92%;}
  .m.c{justify-self:start; background:var(--panel); border:1px solid var(--line); font-weight:500;}
  .m.op{justify-self:end; background:var(--soft); color:var(--soft-t); font-size:13px;}
  .m.sys{justify-self:center; padding:0; font:600 11px var(--f-mono); color:var(--muted);}
  .m.typing{display:flex; gap:4px; align-items:center; padding:10px 12px;}
  .m.typing i{width:6px; height:6px; border-radius:50%; background:var(--sodium); animation:dot 1s infinite;}
  .m.typing i:nth-child(2){animation-delay:.15s;} .m.typing i:nth-child(3){animation-delay:.3s;}
  @keyframes dot{50%{opacity:.25; transform:translateY(-2px);}}
  .qs{display:flex; flex-wrap:wrap; gap:6px;}
  .qs .btn{font-size:13px; font-weight:500; padding:6px 10px; min-height:36px; background:var(--panel);}
  .qs .btn kbd{margin-left:2px;}
  .qs .btn:disabled{opacity:.35;}
  .qs .btn.hint{border-color:var(--sodium); box-shadow:0 0 0 1px var(--sodium) inset;}
  .qs .btn.interp{border-style:solid; border-color:var(--s6); color:var(--s6);}
  .chip{font:600 10px var(--f-body); letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border-radius:999px; background:var(--soft); color:var(--soft-t); white-space:nowrap;}
  .chip.warn{background:var(--p2); color:#fff;} .chip.crit{background:var(--bad); color:#fff;}
  .harm{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:8px; font-size:13px;}
  .harm .hm{height:6px; background:var(--line); border-radius:3px; overflow:hidden;} .harm .hm i{display:block; height:100%; background:var(--muted);}
  .harm.t1 .hm i{background:var(--p2);} .harm.t2 .hm i, .harm.t3 .hm i{background:var(--bad);} .harm.t2 b, .harm.t3 b{color:var(--bad);}
  .notes{margin:0;}
  .qs.fq .btn{border-style:solid; border-color:color-mix(in srgb, var(--s6) 45%, var(--line));}
  .brief{display:grid; gap:3px;} .brief ul{margin:0; padding-left:18px; font-size:13px; color:var(--text); display:grid; gap:2px;}
  .fa{display:grid; gap:6px; border-top:1px solid var(--line); padding-top:8px;}
  .fahead{display:flex; align-items:center; gap:8px; background:none; border:0; padding:2px 0; cursor:pointer; text-align:left;}
  .fahead .k{flex:1; color:var(--sodium);} .fahead .chev{color:var(--muted); font-size:12px;}
  .faopts{display:grid; gap:5px;}
  .faopt{display:grid; grid-template-columns:18px minmax(0,1fr); gap:8px; align-items:start; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 9px; color:var(--text); font-size:13px; line-height:1.35; cursor:pointer;}
  .faopt:hover:not(:disabled){border-color:var(--muted);}
  .faopt i{width:16px; height:16px; border:1.5px solid var(--muted); border-radius:4px; display:grid; place-items:center; font-style:normal; font-size:11px; font-weight:800; margin-top:1px;}
  .faopt.ok{border-color:color-mix(in srgb, var(--good) 55%, transparent); background:#EEF8F1;} .faopt.ok i{background:var(--good); border-color:var(--good); color:#fff;}
  .faopt.bad{border-color:color-mix(in srgb, var(--bad) 55%, transparent); background:#FDF0F0;} .faopt.bad i{background:var(--bad); border-color:var(--bad); color:#fff;}
  .faopt:disabled{cursor:default;} .faopt:disabled:not(.ok):not(.bad){opacity:.5;}
  .fareply{font-size:13px;} .fareply.bad{border-color:color-mix(in srgb, var(--bad) 50%, transparent);} .sub.warnt{color:var(--bad); font-weight:600;}
  .declist{margin:0; padding:0; list-style:none; display:grid; gap:4px; font-size:14px;} .declist b{color:var(--bad); font-variant-numeric:tabular-nums; margin-right:4px;}
  .locate{display:grid; gap:8px; padding:10px; border-radius:10px; border:1px dashed var(--sodium); background:color-mix(in srgb, var(--sodium) 7%, transparent);}
  .locate p{margin:0;}
  /* prevoz pacienta */
  .trans{background:var(--panel); border:1px solid var(--s5); border-left:5px solid var(--s5); border-radius:10px; padding:9px 10px; display:grid; gap:7px;}
  .trans .hosps{display:grid; gap:5px;}
  .trans .hosps .btn{justify-content:space-between; font-size:13px; padding:6px 9px; min-height:36px; text-align:left;}
  .trans .hosps .btn .sub{font:600 11px var(--f-mono);}
  .trans .hosps .btn.rec{border-color:var(--sodium); box-shadow:0 0 0 1px var(--sodium) inset;}
  /* vybraná posádka */
  .usel{background:var(--panel); border:1px solid var(--sodium); border-radius:12px; padding:10px; display:grid; gap:8px;}
  .usel .acts .btn{font-size:12px; min-height:32px; padding:5px 9px;}
  /* čipy na mape */
  .mapchips{display:none; flex-wrap:wrap; gap:6px;}
  .mchip{display:inline-flex; align-items:center; gap:6px; font:600 12px var(--f-body); padding:5px 10px; border-radius:8px; border:1px solid var(--line);
    background:color-mix(in srgb, var(--panel) 94%, transparent); color:var(--text); cursor:pointer; box-shadow:var(--shadow);}
  .mchip.on{border-color:var(--sodium); color:var(--sodium);}
  .mchip.warn{border-color:var(--p2); color:var(--p2);} .mchip.bad{border-color:var(--bad); color:var(--bad);}
  .mchip i{width:8px; height:8px; border-radius:50%; background:currentColor; display:inline-block;}
  .mchip .ico{width:14px; height:14px;}
  .major{background:#FDF0F0; border:1px solid var(--bad); border-radius:12px; padding:10px; display:grid; gap:8px;}
  .major .grade{font-size:20px; color:var(--bad);}
  .inc .chip.mu, .disp .chip.mu{background:var(--bad); color:#fff;}
  .call.repeat{border-color:var(--p2);}
  /* rádio */
  .mapfoot{position:absolute; left:10px; bottom:44px; z-index:3; display:grid; gap:6px; justify-items:start; max-width:min(62%,520px); pointer-events:none;}
  .mapfoot .mapchips{pointer-events:auto;}
  .radio{display:grid; gap:4px;}
  .barchips{display:flex; flex-wrap:wrap; gap:6px; max-width:420px;}
  .rm{background:color-mix(in srgb, var(--panel) 96%, transparent); border:1px solid var(--line); border-left:3px solid var(--s6); border-radius:8px; padding:5px 9px; font-size:12px; animation:hin .2s ease-out; box-shadow:var(--shadow);}
  .rm b{font:700 11px var(--f-mono); color:var(--s6); margin-right:4px;}
  .rm.bad{border-left-color:var(--bad);} .rm.bad b{color:var(--bad);}
  .rm.good{border-left-color:var(--good);} .rm.good b{color:var(--good);}
  .cls{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .cls .btn{justify-content:flex-start; text-align:left; border-left:4px solid var(--tc); font-size:13px; padding:7px 8px; gap:6px;}
  .cls .btn .ico{color:var(--tc);}
  .cls .btn kbd{margin-left:auto;}
  .cls .btn.hint{box-shadow:inset 0 0 0 1px var(--sodium); border-color:var(--sodium);}
  /* štruktúrovaný rozhovor linky 155 */
  .ctime{font:700 15px var(--f-mono); font-variant-numeric:tabular-nums; padding:1px 7px; border-radius:6px; background:color-mix(in srgb, var(--good) 18%, transparent); color:var(--good);}
  .ctime.late{background:color-mix(in srgb, var(--bad) 22%, transparent); color:var(--bad);}
  .sr{display:grid; gap:6px;}
  .srg{display:grid; grid-template-columns:76px minmax(0,1fr); gap:6px; align-items:start;}
  .srg > .k{padding-top:9px; line-height:1.2;}
  .cls.form{grid-template-columns:repeat(3, minmax(0,1fr)); gap:5px;}
  .cls.form .btn{font-size:12px; padding:6px 6px; min-height:36px; gap:5px; line-height:1.15; border-left-width:3px;}
  .cls.form .btn.on{background:var(--sodium); border-color:var(--sodium); color:#fff; box-shadow:none;} .cls.form .btn.on .ico{color:#fff;}
  .declist.tri b{color:var(--text);}
  .lvtree{display:grid; gap:6px; margin-top:2px;}
  .lv{display:grid; grid-template-columns:96px minmax(0,1fr); gap:8px; align-items:start; border:1px solid var(--line); border-left:4px solid var(--lc); border-radius:8px; padding:6px 8px; background:var(--panel);}
  .lv.off{opacity:.45;}
  .lv.on{box-shadow:0 0 0 1px var(--lc) inset;}
  .lv ul{margin:0; padding-left:16px; font-size:12.5px; line-height:1.35; color:var(--text);}
  .lv li + li{margin-top:2px;}
  .lvb{flex-direction:column; align-items:flex-start; gap:0; min-height:44px; padding:5px 8px; border-color:var(--lc);}
  .lvb b{font:700 20px/1 var(--f-display); color:var(--lc);}
  .lvb span{font-size:11px; font-weight:600; color:var(--muted); line-height:1.2;}
  .lvb kbd{display:none;}
  .oopts{display:grid; gap:5px; margin-top:6px;}
  .oopts .btn{justify-content:flex-start; text-align:left; font-size:13px; border-left:4px solid var(--p4); background:var(--panel);}
  .intakebar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 8px; border-radius:8px; background:var(--soft); border:1px solid color-mix(in srgb, var(--sodium) 30%, var(--line));}
  .intakebar .sub{font-size:12px; color:var(--muted);}
  .tanr{border:1px solid var(--line); border-radius:10px; padding:8px 10px; display:grid; gap:6px;}
  .tanr.hot{border-color:var(--p1); background:#FDF0F0;}
  .tanr.on{border-color:var(--good); background:#EEF8F1;}
  .tanr .tap{min-height:58px; font-size:20px; letter-spacing:.04em;}
  .tanr .tap .sub{font:600 12px var(--f-mono); opacity:.8;}
  .izs{display:grid; gap:6px;}
  .izsb{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:5px;}
  .izt{flex-direction:column; gap:2px; font-size:12px; padding:6px 4px; min-height:52px; line-height:1.15; text-align:center;}
  .izt .ico{width:20px; height:20px;}
  .izt .sub{font-size:10.5px; font-weight:600; color:var(--muted);}
  .izt.on{border-color:var(--sodium); background:var(--soft); color:var(--soft-t); opacity:1;}
  .izs .keys{font-size:11.5px;}
  .app.intake .clock::after{content:"príjem"; font:600 10px var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--sodium); margin-left:4px;}

  .inc{background:var(--panel); border:1px solid var(--line); border-left:5px solid var(--pc); border-radius:10px; padding:9px 10px; cursor:pointer; display:grid; gap:6px;}
  .inc:hover{border-color:#B7C2CF; border-left-color:var(--pc);}
  .inc.sel{border-color:var(--sodium); border-left-color:var(--pc); box-shadow:0 0 0 1px var(--sodium) inset;}
  .inc .ico, .disp .ico{color:var(--pc);}
  .prio{font:700 11px var(--f-mono); padding:1px 6px; border-radius:5px; background:var(--pc); color:var(--on-c); flex:none;}
  .ttl{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .timer{font:600 12px var(--f-mono); font-variant-numeric:tabular-nums; flex:none;}
  .needs{display:flex; flex-wrap:wrap; gap:4px;}
  .need{font:600 11px var(--f-mono); padding:1px 7px; border-radius:999px; border:1px dashed var(--muted); color:var(--muted);}
  .need.way{border-style:solid; border-color:var(--s3); color:var(--s3);}
  .need.on{border-style:solid; border-color:var(--good); background:var(--good); color:#fff;}
  .tbar{height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
  .tbar i{display:block; height:100%; background:var(--pc, var(--sodium));}
  .tbar.work i{background:var(--good);}

  .disp{background:var(--panel); border:1px solid var(--sodium); border-radius:12px; padding:12px; display:grid; gap:10px; box-shadow:var(--shadow);}
  .disp .quote{font-size:14px; color:var(--muted);}
  .cand{display:grid; grid-template-columns:auto auto minmax(0,1fr) auto auto; align-items:center; gap:8px; font-size:14px;}
  .tag{font:700 11px var(--f-mono); padding:2px 6px; border-radius:5px; background:var(--sc); color:#fff; white-space:nowrap;}
  .eta{font:600 12px var(--f-mono); color:var(--muted); white-space:nowrap;}
  .sub{font-size:12px; color:var(--muted); font-weight:400;}
  .keys{margin:0; font-size:12px; color:var(--muted);}

  .unit{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:3px 10px; align-items:center; padding:8px 10px;
    background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--sc); border-radius:10px; cursor:pointer;}
  .unit:hover{border-color:#B7C2CF; border-left-color:var(--sc);}
  .unit.sel{border-color:var(--sodium); border-left-color:var(--sc);}
  .unit .veh{min-width:30px; height:32px; padding:0 6px; display:grid; place-items:center; border-radius:8px; background:color-mix(in srgb, var(--sc) 10%, #fff); color:var(--sc);}
  .unit .veh .ico{width:22px; height:22px;}
  .vimg{display:block; height:22px; width:auto; max-width:78px; filter:drop-shadow(0 1px 1px rgba(20,32,46,.25));}

  return Math.max(.02, h/1000);
}
/* náhradný vymyslený reliéf (keby výškové dáta chýbali) */
function heightProc(x,z){
  let h=.12;
  for(const m of HILLS_XZ){ const dx=(x-m.x)/m.rx, dz=(z-m.z)/m.rz; h+=m.h*Math.exp(-(dx*dx+dz*dz)*1.4); }
  const low=Math.exp(-((x-LOW.x)**2+(z-LOW.z)**2)/(2*28*28));
  h += (fbm(x*.07+11, z*.07+5)-.45)*.38*(1-low*.85) + (fbm(x*.25, z*.25)-.5)*.06;
  h = lerp(h, .08, low*.75);
  const rd=riverDist(x,z); h -= .09*Math.exp(-((rd/1.6)**2));
  for(const l of LAKES_XZ){ const q=inLake(x,z,l); if(q<1.6) h=lerp(h, Math.min(h,.06), clamp(1.6-q,0,1)); }
  return Math.max(.02, h);
}
function groundY(x,z){ return heightKm(x,z)*EXAG; }

const caseById = id => CASES.find(x=>x.id===id);
const caseTpl = id => { const C=caseById(id); return C ? TPL.find(t=>t.title===C.tpl) : null; };
/* kontrola kroku kazuistiky podľa toho, čo hráč v hovore urobil */
function caseCheck(k, f, d){
  if(!k || !f) return null;
  const F=d.fa||{}, T=d.tri||{};
  if(k.startsWith('q:')) return f.asked.includes(k.slice(2));
  if(k.startsWith('cq:')) return f.cqAsked.includes(k.slice(3));
  if(k==='cat') return !!T.catOk;
  if(k==='lvl') return !!T.lvlOk;
  if(k==='h1') return f.hMark===1;
  if(k==='disp') return F.dispSec!=null && F.dispSec<=90;
  if(k==='tanr') return !!F.tanr && !F.tanr.none;
  if(k==='aed') return ['used','late','fetch'].includes(F.aed);
  if(k==='fa') return F.must ? !!F.done : (F.given||[]).some(x=>x.ok);
  if(k==='izs') return !(F.izsMiss||[]).length;
  return null;
}
function caseExtra(C, f, d){
  const steps=C.steps.map(s=>{ const ok=caseCheck(s[2], f, d); return `<li>${DK(ok)}<b>${esc(s[0])}</b>${s[1] ? `<span class="why">${esc(s[1])}</span>` : ''}</li>`; }).join('');
  return `<section class="deb case"><h3>5. Ideálny postup krok po kroku</h3><ul class="dlist csteps">${steps}</ul></section>
    <section class="deb"><h3>Čo si z toho zobrať</h3><ul class="dlist">${C.learn.map(x=>`<li>${DK()}${esc(x)}</li>`).join('')}</ul>
    <p class="keys src">Zdroj: ${C.src.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(' · ')}. Prípad je prerozprávaný podľa typického priebehu z literatúry a anonymizovaný. Mená, miesta a čísla sú vymyslené.</p></section>`;
}
function showCase(id){
  const C=caseById(id); if(!C) return;
  const i=CASES.indexOf(C), st=(PROG.cases||{})[id], ov=$('#overlay'); ov.hidden=false; ov.classList.remove('menu');
  ov.innerHTML=`<div class="sheet"><div class="k">Kazuistika ${i+1} z ${CASES.length}${st===2 ? ' · zvládnutá' : st===1 ? ' · skús znova' : ''}</div><h2 class="grade">${esc(C.name)}</h2>
    <p class="lead">${esc(C.intro)}</p>
    <p class="keys">Zameranie: <b>${esc(C.focus)}</b>. Hovor prijmi a postupuj ako v službe. Príjem beží v reálnom čase. Rozbor krok po kroku uvidíš po príchode posádky na miesto.</p>
    <p class="keys src">Inšpirácia: ${C.src.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(' · ')}</p>
    <div class="acts"><button class="btn go" data-act="cstart" data-id="${C.id}">Začať kazuistiku</button><button class="btn" data-act="mtab" data-id="cases">Späť</button></div></div>`;
}
/* kazuistika: rozbor po príchode posádky (alebo keď udalosť skončí bez nej) */
function caseArrived(inc){
  const sc=G.script; if(!sc || sc.kind!=='cases' || !inc.deb || inc.deb.caseDone) return;
  const C=caseById(sc.id); if(!C) return;
  inc.deb.caseDone=true; inc.deb.ready=true;
  inc.deb.extra=caseExtra(C, inc.call, inc.deb);
  scriptResult(inc.deb); G.debCase=inc.deb;
  showDebrief(inc.deb, true);
}

function earnedMedals(){
  const s=G.stats, a=avg(s.ans), p1=avg(s.respP1), out=[], d=s.dec||{};
  if(s.ans.length>=8 && a<=3) out.push('quick');
  if((s.triN||0)>=8 && !s.under && !s.over && !s.undero) out.push('triage');
  if(s.respP1.length>=3 && p1<=12) out.push('golden');
  if((s.calls||0)>=10 && !s.hung) out.push('nohang');
  if((G.comboMax||0)>=10) out.push('combo');
  if((s.found||0)>=3) out.push('detective');

  if((s.goodHosp||0)>=3 && !s.badHosp) out.push('hosp');

  if((s.izsOk||0)>=4 && !d.izsx) out.push('izs');
  if((s.faOk||0)>=6 && !d.aid) out.push('angel');
  if(s.resolved>=10 && !Object.values(d).some(Boolean) && !s.harmed && !s.died) out.push('clean');
  return out;
}

/* poškodené alebo neúplné uloženie nesmie zhodiť hru: chýbajúce a zlé časti sa doplnia, platné ostanú */
function normProg(p){
  const obj = x => x && typeof x==='object' && !Array.isArray(x), num = (x, d) => Number.isFinite(x) ? x : d;
  p.xp=num(p.xp,0); p.level=Math.max(1, num(p.level,1)); p.points=num(p.points,1); p.best=num(p.best,0); p.sessions=num(p.sessions,0);
  if(!Array.isArray(p.skills)) p.skills=[];
  if(!obj(p.stars)) delete p.stars;
  if(p.course!==undefined){ if(!obj(p.course)) p.course={}; if(!obj(p.course.best)) p.course.best={}; p.course.open=Math.max(1, num(p.course.open,1)); }
  if(p.cases!==undefined && !obj(p.cases)) p.cases={};
  if(p.exam!==undefined){ if(!obj(p.exam)) p.exam={}; p.exam.best=num(p.exam.best,0); p.exam.passed=num(p.exam.passed,0); }
  if(p.daily!==undefined && !obj(p.daily)) delete p.daily;
  return p;
}
function loadProg(){
  try{ const p=JSON.parse(localStorage.getItem(PKEY)||'null');
    if(p && p.v===1){ normProg(p); if(p.voiceV!==2){ p.voice=false; p.voiceV=2; } for(const id of p.skills) if(!SKILLS.some(s=>s.id===id)) p.points+=OLD_COST[id]||1; p.skills=p.skills.filter(id=>SKILLS.some(s=>s.id===id)); return p; } }catch(e){}
  return {v:1, xp:0, level:1, points:1, skills:[], best:0, light:'day', sessions:0, voice:false, voiceV:2}; }

function spawnScripted(tpl){
  const node=placeFor(tpl);
  spawnCall({tpl, node, addr:addrOf(node), script:true});
  const c=G.calls[G.calls.length-1]; c.script=true; return c;
}
const scriptBusy = () => G.calls.some(c=>c.state==='talk' || c.state==='ring') || G.incs.some(i=>i.intake) || G.debOpen || !$('#overlay').hidden;
function stepScript(){
  const sc=G.script; if(!sc || G.mode!=='play') return;
  G.nextCall=1e9;
  if(scriptBusy()) return;
  if(sc.idx<sc.queue.length){ if(G.t>=sc.next){ spawnScripted(sc.queue[sc.idx]); sc.idx++; } return; }
  if(sc.kind==='cases' && G.incs.some(i=>i.fromCall && !(i.deb && i.deb.shown))) return;   // kazuistika beží do príchodu posádky
  if(!sc.done){ sc.done=true; scriptEnd(); }
}
/* výsledok hovoru v režime podľa scenára */
function scriptResult(d){
  const sc=G.script; if(!sc || !d || d.prank) return;
  const ok=d.tri.catOk && d.tri.lvlOk && (d.tri.opt==null || d.tri.optOk);
  sc.results.push({title:d.title, ok, d, pct:examScore(d)});

}
/* skúška: naliehavosť 40, čas do vyslania 15, TANR 15, súčinnosť 15, pokyny 15 */
function examScore(d){
  if(!d || d.prank) return 0;
  const T=d.tri, F=d.fa||{}; let p=0;
  p += (T.catOk ? 10 : 0) + (T.lvlOk && (T.opt==null || T.optOk) ? 30 : 0);
  if(d.kind==='o') return p + (T.lvlOk ? 45 : 0) + (F.rada ? (F.rada.every(x=>x.ok) ? 8 : 0) + (F.safe ? 7 : 0) : 15);
  p += (F.lvl==='K' || F.lvl==='N') ? (F.dispSec!=null && F.dispSec<=90 ? 15 : F.dispSec!=null ? 6 : 0) : (F.dispSec!=null ? 15 : 0);
  p += !F.tanr ? 15 : F.tanr.none ? 0 : F.tanr.sec<=90 && F.tanr.rate>=100 && F.tanr.rate<=120 ? 15 : 8;
  p += F.izsMiss.length || F.izsX.length ? Math.max(0, 15-8*(F.izsMiss.length+F.izsX.length)) : 15;
  p += F.must ? (F.done ? 15 : 0) : F.no ? 15 : (F.given.some(x=>!x.ok) ? 8 : 15);
  return p;
}

function audio(){
  if(!AC){
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}   // iPhone: zvuk aj v tichom režime
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; }

function tone(freq, dur, type='sine', vol=.1, when=0){
  if(muted || !AC || quiet()) return;
  try{
    const t=AC.currentTime+when, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.03);
  }catch(e){}
}

let CLIP_SET=null, CLIP_LOADING=false; const CLIPS=new Map(), CLIP_VOICES=new Set();
const clipId = key => 'v'+hashStr(key).toString(36);
function clipIndex(){

  fetch(CLIP_DIR+'zoznam.json').then(r=>r.ok ? r.json() : []).then(list=>{

      const m=String(f).match(/^(v[0-9a-z]+)(?:-([a-z0-9]{1,8}))?\.(mp3|m4a|ogg|oga|opus|wav|webm|aac)$/i); if(!m) continue;
      const id=m[1].toLowerCase(), v=(m[2]||'').toLowerCase(); if(!CLIP_SET.has(id)) CLIP_SET.set(id, new Map()); CLIP_SET.get(id).set(v, f); if(v) CLIP_VOICES.add(v);

function clipFile(key, voice){ const vs=CLIP_SET && CLIP_SET.get(clipId(key)); if(!vs) return null; return vs.get(voice||'') || vs.get('') || vs.values().next().value; }
function clipBuf(key, voice){
  if(!key || !CLIP_SET || !CLIP_SET.size || !AC) return null;
  const f=clipFile(key, voice); if(!f) return null;
  const b=CLIPS.get(f); if(b && typeof b==='object') return b; if(b) return null;
  CLIPS.set(f, 'loading');
  fetch(CLIP_DIR+f).then(r=>{ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(x=>new Promise((res, rej)=>{ const p=AC.decodeAudioData(x, res, rej); if(p && p.then) p.then(res, rej); }))   // aj staršie Safari
    .then(buf=>CLIPS.set(f, buf)).catch(()=>CLIPS.set(f, 'bad'));

}

let PHONE=null, NB=null, BB=null, CALLAMB=null, VOICE=null;
function phoneBus(){
  if(PHONE) return PHONE;
  const hp=AC.createBiquadFilter(), lp=AC.createBiquadFilter(), sh=AC.createWaveShaper(), cmp=AC.createDynamicsCompressor(), k=new Float32Array(1025);
  hp.type='highpass'; hp.frequency.value=300; lp.type='lowpass'; lp.frequency.value=3400;
  for(let i=0;i<1025;i++){ const x=i/512-1; k[i]=Math.tanh(1.8*x)/Math.tanh(1.8); } sh.curve=k;
  cmp.threshold.value=-26; cmp.knee.value=12; cmp.ratio.value=5;

  return PHONE=hp;
}
function nbuf(brown){
  if(brown ? BB : NB) return brown ? BB : NB;
  const len=AC.sampleRate*3, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0); let last=0;
  for(let i=0;i<len;i++){ const w=Math.random()*2-1; if(brown){ last=(last+.02*w)/1.02; d[i]=last*3.5; } else d[i]=w; }
  return brown ? (BB=b) : (NB=b);
}
/* stavebné prvky zvukov */
function aLoop(a, brown, type, freq, q, vol){
  const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=nbuf(brown); s.loop=true; f.type=type; f.frequency.value=freq; f.Q.value=q; g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(a.g); s.start(0, Math.random()*2); a.nodes.push(s,f,g); return {s,f,g};
}
function aLfo(a, param, rate, depth){ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=rate; g.gain.value=depth; o.connect(g); g.connect(param); o.start(); a.nodes.push(o,g); }

function aBurst(a, brown, type, freq, q, dur, vol, when=0, attack=.005){
  const t=AC.currentTime+.03+when, s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();   // malý predstih, aby zvuk nezačal v minulosti
  s.buffer=nbuf(brown); f.type=type; f.frequency.value=freq; f.Q.value=q;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(a.g); s.start(t, Math.random()*2, dur+.05); return f;
}
function aTone(a, freq, dur, type, vol, when=0, f2, bp){
  const t=AC.currentTime+.03+when, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  if(bp){ const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=bp; f.Q.value=3; o.connect(f); f.connect(g); } else o.connect(g);

function aEvery(a, min, max, fn){

  setTimeout(tick, next()*.5);
}

/* ============================================================

const wxSpeed = u => G && G.weather && !KINDS[u.kind].air ? WEATHER[G.weather].speed : 1;
const speedOf = u => KINDS[u.kind].speed/60 * (has('d_green') ? 1.15 : 1) * wxSpeed(u) * (u.noLights ? .88 : 1);          // km za minútu hry; k M sa ide bez majákov
/* dopravná špička v Košiciach spomalí cesty v okolí mesta */
const KE_EDGES=new Set(EDGES.filter(e=>[e.a,e.b].every(id=>Math.hypot(NODES[id].x-NODES.ke.x, NODES[id].z-NODES.ke.z)<11)));

const trailSpeed = u => (KINDS[u.kind].trail||8)/60 * (has('s_quad') ? 1.5 : 1);
function edgeSpeed(u, e){ return e.t==='T' ? trailSpeed(u) : speedOf(u)*(e.t==='M' ? 1.15 : 1)*(rushOn() && KE_EDGES.has(e) ? .6 : 1); }
const canUse = (u, e) => e.t!=='T' || u.kind==='HZS';

function dijkstraFrom(init, u){

    let best=null, bv=Infinity;
    for(const id in d) if(!done.has(id) && d[id]<bv){ bv=d[id]; best=id; }
    if(best==null) break;
    done.add(best);
    for(const [v,e] of ADJ[best]) if(canUse(u,e)){ const nd=d[best]+e.len/edgeSpeed(u,e); if(nd<d[v]){ d[v]=nd; prev[v]=best; } }

function pathFor(u, from, to){
  if(from===to) return [];
  const {d,prev}=dijkstra(from, u);

function setStatus(u, s){ u.status=s; u.since=G.t; if(s!==3) u.noLights=false; dirty(); }
/* trasa k uzlu a prípadne ďalej mimo cesty k presnému miestu */
function routeTo(u, node, dest){

function goHome(u){ u.inc=null; setStatus(u,1); routeTo(u, u.post || u.home); }
/* pokrytie: za koľko minút dorazí najbližšia voľná záchranka do každej obce */
const COV={}; let COVPCT=100, covAt=-9, covShow=false;
const AMB_KINDS=['RZP','RLP','LZS'];
function computeCoverage(){
  const free=G.units.filter(u=>AMB_KINDS.includes(u.kind) && (u.status===1 || u.status===2) && !u.temp);
  const init={}, ground=free.filter(u=>!KINDS[u.kind].air);

    let t=d[n.id]===undefined ? Infinity : d[n.id];

/* najhoršie pokryté obce – návrhy na presun posádky do zálohy */
function standbyTargets(u){
  return Object.values(NODES).filter(n=>n.type==='town' && n.id!==u.node && n.id!==u.post && COV[n.id]>11)
    .sort((a,b)=>(COV[b.id]-10)*Math.sqrt(b.pop)-(COV[a.id]-10)*Math.sqrt(a.pop)).slice(0,3);

function postUnit(u, node){

const LAUNCH=4;
const heliOK = () => !G || !G.weather || WEATHER[G.weather].heli;   // vrtuľník potrebuje pár minút na štart
function moveUnit(u, dt){
  const air=KINDS[u.kind].air;
  if(air && u.launch && G.t<u.launch) return;
  let rem=dt;
  while(rem>1e-6){
    let tx, tz, sp;
    if(u.path.length){
      const n=NODES[u.path[0]]; tx=n.x; tz=n.z;

/* zostávajúci čas jazdy (minúty hry) */
function etaPath(u){

/* odhad dojazdu posádky k udalosti */
function etaTo(u, inc, cache){

  if(!cache[key]) cache[key]=dijkstra(inc.node, u).d;

  return Math.hypot(NODES[from].x-u.x, NODES[from].z-u.z)/speedOf(u) + d + Math.hypot(inc.x-n.x, inc.z-n.z)/(speedOf(u)*.6);

function arrived(u){

/* hľadanie volajúceho na mape */

/* režim jednej udalosti: prípad je otvorený, kým trvá hovor, udalosť alebo čaká pacient na nemocnicu */
const caseOpen = () => G.calls.length>0 || G.incs.length>0 || G.units.some(u=>u.status===5 && !u.hospId) || !!(G.recalls && G.recalls.length);
function step(dt){

  }

  const P=patience();
  for(const c of [...G.calls]){
    if(c.state==='ring' && G.t-c.t0>RING*P){
      dropCall(c);

      else if(!c.prank){ G.rep-=repLoss(8); G.stats.hung++; comboBreak(); say('Volajúci zložil, nikto nezdvihol. −8 dôvery', 'bad'); SND.bad(); checkRep(); }
    } else if(c.state==='talk' && G.t-c.talkAt>(c.kind==='repeat' ? TALK_R : TALK)*P){

      if(!c.prank && c.kind!=='repeat'){ G.rep-=repLoss(5); G.stats.hung++; say('Volajúci to vzdal, príjem hovoru trval príliš dlho. −5 dôvery', 'bad'); if((c.lvlTrue||c.tpl.lvl)!=='O') scheduleRecall(c); checkRep(); }

    G.covCheck=G.t+30;
    if(COVPCT>=90){ G.score+=50; G.rep=Math.min(100,G.rep+2); say('Kraj je dobre pokrytý záchrankami ('+COVPCT+' %). +50', 'good'); }
    else if(COVPCT<65){ G.rep-=repLoss(3); say('Veľká časť kraja nemá záchranku do 15 minút ('+COVPCT+' %). Presuň posádky do zálohy. −3 dôvery', 'bad'); checkRep(); }

    if(info.met){

function buildTerrain(){
  const W=330, D=230, SX=330, SZ=230;   // vrcholy presne na mriežke výškových dát (1 km)
  const geo=new THREE.PlaneGeometry(W, D, SX, SZ); geo.rotateX(-Math.PI/2);
  geo.translate(-2, 0, 2);
  const pos=geo.attributes.position, col=new Float32Array(pos.count*3), c=new THREE.Color();
  /* svetlé výškové odtiene: nížiny, pahorkatiny, lesnaté vrchy, skaly a štíty Tatier */
  const st=[[0,0xEEF1E7],[.25,0xE4EBDA],[.55,0xD2DEC6],[.95,0xC3CFB8],[1.45,0xC9CCC6],[1.9,0xF1F2F4]].map(([h,v])=>[h,new THREE.Color(v)]);
  /* farba okraja = pozadie po osvetlení (rovina dostane asi 0,98-násobok), aby terén splynul s oparom bez hrany */
  const water=new THREE.Color(0xB9D3EA), pv=new THREE.Color(0xE6EAE6), out=new THREE.Color(0xE4E8ED), bg=new THREE.Color(MAP_BG).multiplyScalar(1/.98);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i), h=heightKm(x,z);
    /* na okraji výškových dát sa terén stráca v opare – nevznikne odseknutá hrana */
    const edge=clamp(Math.min(x+167, 163-x, z+113, 117-z)/34, 0, 1);
    pos.setY(i, h*EXAG*(.25+.75*edge));
    let k=0; while(k<st.length-2 && h>st[k+1][0]) k++;
    c.copy(st[k][1]).lerp(st[k+1][1], clamp((h-st[k][0])/(st[k+1][0]-st[k][0]),0,1));
    if(riverDist(x,z)<.5) c.lerp(water,.6);
    if(inRegion(x,z)){} else if(inPoly(PVXZ,x,z)) c.lerp(pv,.22); else c.lerp(out,.6);
    c.lerp(bg, (1-edge)*.97);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  geo.computeVertexNormals();
  terrain=new THREE.Mesh(geo, new THREE.MeshLambertMaterial({vertexColors:true}));
  terrain.receiveShadow=true; scene.add(terrain);
}

/* pás (rieka, cesta, hranica) kopírujúci terén */
function ribbon(pts, width, lift, step=.5){
  const dense=[];
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i], n=Math.max(1, Math.ceil(Math.hypot(b.x-a.x,b.z-a.z)/step));
    for(let k=(i===1?0:1);k<=n;k++) dense.push({x:lerp(a.x,b.x,k/n), z:lerp(a.z,b.z,k/n)});
  }
  const v=[], idx=[];
  dense.forEach((p,i)=>{
    const q=dense[Math.min(i+1,dense.length-1)], o=dense[Math.max(i-1,0)];
    let dx=q.x-o.x, dz=q.z-o.z; const l=Math.hypot(dx,dz)||1; dx/=l; dz/=l;
    const nx=-dz*width/2, nz=dx*width/2;
    v.push(p.x+nx, groundY(p.x+nx,p.z+nz)+lift, p.z+nz, p.x-nx, groundY(p.x-nx,p.z-nz)+lift, p.z-nz);
    /* trojuholníky otočené lícom nahor, nech je pás vidno zhora */
    if(i>0){ const b=(i-1)*2; idx.push(b,b+2,b+1, b+1,b+2,b+3); }
  });
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v,3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function mergeGeos(list){
  let total=0, itotal=0; for(const g of list){ total+=g.attributes.position.count; itotal+=g.index.count; }
  const pos=new Float32Array(total*3), idx=new Uint32Array(itotal); let o=0, io=0;
  for(const g of list){ pos.set(g.attributes.position.array, o*3); const ix=g.index.array; for(let i=0;i<ix.length;i++) idx[io+i]=ix[i]+o; o+=g.attributes.position.count; io+=ix.length; }
  const m=new THREE.BufferGeometry(); m.setAttribute('position', new THREE.BufferAttribute(pos,3)); m.setIndex(new THREE.BufferAttribute(idx,1)); m.computeVertexNormals();
  return m;
}
function buildWater(){
  /* rieky a jazerá */
  waterGroup=new THREE.Group(); scene.add(waterGroup);
  const wm=new THREE.MeshBasicMaterial({color:0x9CC3E6, polygonOffset:true, polygonOffsetFactor:-2});
  waterGroup.add(new THREE.Mesh(mergeGeos(RIVERS_XZ.map(r=>ribbon(r.pts, r.name==='Hornád'||r.name==='Bodrog'||r.name==='Tisa' ? .55 : .4, .05))), wm));
  for(const l of LAKES_XZ){
    const sh=new THREE.Shape(); sh.absellipse(0,0,l.rx,l.rz,0,Math.PI*2,false,0);
    const g=new THREE.ShapeGeometry(sh,48); g.rotateX(-Math.PI/2); g.rotateY(-l.rot);
    const m=new THREE.Mesh(g, wm); m.position.set(l.x, groundY(l.x,l.z)+.08, l.z); waterGroup.add(m);
  }
}
/* hranice: Košický kraj plnou modrou, susedné kraje čiarkovane */
function dashed(P, on, off){
  const out=[]; let cur=[], acc=0, draw=true;
  for(let i=1;i<P.length;i++){
    const a=P[i-1], b=P[i], n=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.z-a.z)/.5));
    for(let k=0;k<n;k++){
      const x=lerp(a.x,b.x,k/n), z=lerp(a.z,b.z,k/n);
      if(draw) cur.push({x,z});
      acc+=Math.hypot(b.x-a.x,b.z-a.z)/n;
      if(acc>=(draw ? on : off)){ acc=0; if(draw && cur.length>1) out.push(cur); cur=[]; draw=!draw; }
    }
  }
  if(cur.length>1) out.push(cur);
  return out;
}
function buildBorder(){
  const m=(c,op)=>new THREE.MeshBasicMaterial({color:c, transparent:true, opacity:op, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-4, side:THREE.DoubleSide});
  scene.add(new THREE.Mesh(ribbon([...BXZ, BXZ[0]], .62, .3, .6), m(0x0F5FA8, .9)));
  for(const [P,c,op] of [[PVXZ,0x7C8A9A,.85],[BCXZ,0x9AA5B1,.7]]) if(P.length>2) scene.add(new THREE.Mesh(mergeGeos(dashed([...P, P[0]], 1.6, 1.1).map(seg=>ribbon(seg, .32, .25, .5))), m(c, op)));
}
function buildRoads(){
  const N=id=>NODES[id];
  const main=[], road=[], trail=[];
  for(const e of EDGES){ const pts=[N(e.a),N(e.b)]; (e.t==='M' ? main : e.t==='R' ? road : trail).push(pts); }
  /* trasy posádok: na satelitnej snímke len jemné priesvitné pásy */
  const mat=(c,op)=>new THREE.MeshBasicMaterial({color:c, transparent:true, opacity:op, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-3, side:THREE.DoubleSide});
  /* cesty ako na papierovej mape: hlavné oranžové s bielym lemom, ostatné sivé; cesty okolo kraja tlmenejšie */
  const ctx=[];
  for(const [a,b] of CTX_ROADS){ const A=NODES[a]||CTX_TOWNS.find(t=>t.name===a), B=NODES[b]||CTX_TOWNS.find(t=>t.name===b); if(A && B) ctx.push([A,B]); }
  scene.add(new THREE.Mesh(mergeGeos(ctx.map(p=>ribbon(p,.42,.18))), mat(0xD7B07A, .8)));
  scene.add(new THREE.Mesh(mergeGeos(main.map(p=>ribbon(p,.85,.2))), mat(0xffffff, .75)));
  scene.add(new THREE.Mesh(mergeGeos(main.map(p=>ribbon(p,.5,.24))), mat(0xDE9F4E, .95)));
  scene.add(new THREE.Mesh(mergeGeos(road.map(p=>ribbon(p,.3,.2))), mat(0xA9B4C0, .9)));
  for(const p of trail){
    const g=new THREE.BufferGeometry().setFromPoints(ribbonLine(p));
    const l=new THREE.Line(g, new THREE.LineDashedMaterial({color:0x8E9AA8, dashSize:.5, gapSize:.4})); l.computeLineDistances(); scene.add(l);
  }
}
function ribbonLine([a,b]){ const n=Math.ceil(Math.hypot(b.x-a.x,b.z-a.z)/.4), out=[]; for(let k=0;k<=n;k++){ const x=lerp(a.x,b.x,k/n), z=lerp(a.z,b.z,k/n); out.push(new THREE.Vector3(x, groundY(x,z)+.25, z)); } return out; }
function buildTowns(){
  const R=rng(42), mats=[];
  const towns=Object.values(NODES).filter(n=>n.type==='town');
  let count=0; for(const n of towns) count+=Math.round(clamp(Math.sqrt(n.pop)/2.2, 8, 230));
  const geo=new THREE.BoxGeometry(1,1,1); geo.translate(0,.5,0);
  buildingsMat=new THREE.MeshStandardMaterial({color:0xffffff, roughness:.85, emissive:0xffb35a, emissiveIntensity:0});
  const im=new THREE.InstancedMesh(geo, buildingsMat, count);
  im.castShadow=true; im.receiveShadow=true;
  const m=new THREE.Matrix4(), q=new THREE.Quaternion(), s=new THREE.Vector3(), p=new THREE.Vector3(), col=new THREE.Color();
  const palette=[0xd9d4c7,0xc9c2b4,0xe6dfcf,0xb9b4aa,0xd0c6b8,0xe9e3d6].map(h=>new THREE.Color(h)), roofRed=new THREE.Color(0xa8553a);
  let i=0;
  for(const n of towns){
    const k=Math.round(clamp(Math.sqrt(n.pop)/2.2, 8, 230)), big=n.pop>30000;
    for(let j=0;j<k;j++){
      const a=R()*Math.PI*2, d=Math.pow(R(),.7)*n.r;
      const x=n.x+Math.cos(a)*d, z=n.z+Math.sin(a)*d;
      const panel=big && R()<.45 && d>n.r*.25;
      const w=panel ? .18+R()*.12 : .12+R()*.14, l=panel ? .5+R()*.5 : .12+R()*.16;
      const h=panel ? .35+R()*.55 : (big && d<n.r*.3 ? .15+R()*.25 : .08+R()*.12);
      q.setFromAxisAngle(new THREE.Vector3(0,1,0), R()*Math.PI); s.set(w,h,l); p.set(x, groundY(x,z)-.02, z);
      m.compose(p,q,s); im.setMatrixAt(i,m);
      col.copy(panel ? palette[Math.floor(R()*3)] : (R()<.4 ? roofRed : palette[Math.floor(R()*palette.length)])); im.setColorAt(i,col);
      i++;
    }
    const g=glowSprite(0xffb35a, n.r*4.2, .0); g.position.set(n.x, groundY(n.x,n.z)+.6, n.z); g.userData.base=clamp(.35+n.pop/400000,.35,.9); scene.add(g); townGlows.push(g);
  }
  im.count=i; im.instanceMatrix.needsUpdate=true; if(im.instanceColor) im.instanceColor.needsUpdate=true;
  scene.add(im);
}

function buildStaticLabels(){
  for(const n of Object.values(NODES)){
    if(n.type==='town'){ const L=mkLabel('town'+(n.pop>30000?' big':''), esc(n.name), n.x, n.y+1.6, n.z, null, n.pop>=30000 ? 0 : n.pop>=6000 ? 300 : 190); L.pop=n.pop; staticLabels.push(L); }
    else if(n.type==='poi') staticLabels.push(mkLabel('poi '+n.poi, esc(n.name), n.x, n.y+.8, n.z, null, 165));
    else if(n.poi==='border') staticLabels.push(mkLabel('poi border', esc(n.name.replace(' – hraničný priechod','')), n.x, n.y+.8, n.z, null, 165));
  }
  for(const h of HOSPITALS){ const n=NODES[h]; const L=mkLabel('hosp','H', n.x+n.r*.7, n.y+2, n.z-n.r*.4, null, 230); L.keep=true; staticLabels.push(L); }
  for(const id of Object.keys(AED_PTS)){ const n=NODES[id]; if(!n) continue; const r=n.r||.5; const L=mkLabel('aed','AED', n.x-r*.75, n.y+1.8, n.z+r*.35, null, 170); L.keep=true; staticLabels.push(L); }
  /* okolie kraja: mestá a názvy krajov a krajín (len na orientáciu) */
  for(const t of CTX_TOWNS){ const L=mkLabel('town ctx'+(t.big?' big':''), esc(t.name), t.x, groundY(t.x,t.z)+1.4, t.z, null, t.big ? 0 : 240); L.pop=t.big ? 20000 : 3000; staticLabels.push(L); }
  for(const [name,x,z] of CTX_LABELS){ const L=mkLabel('region', esc(name.toUpperCase()), x, groundY(x,z)+2, z, null, 0); L.pop=1; staticLabels.push(L); }
  /* dôležitejšie popisky (väčšie mestá) majú prednosť pri prekrytí */
  const rank = L => L.keep ? 0 : L.el.classList.contains('ctx') ? 2+1/(1+(L.pop||0)) : L.el.classList.contains('town') ? 1+1/(1+(L.pop||0)) : L.el.classList.contains('region') ? 4 : 3;
  staticLabels.sort((a,b)=>rank(a)-rank(b));
}
/* popisky, ktoré by sa prekrývali s dôležitejšími, sa skryjú */
function declutter(){
  const placed=[];
  for(const L of staticLabels){
    if(L.keep || L.el.style.display==='none') continue;
    if(!L.w){ L.w=L.el.offsetWidth; L.h=L.el.offsetHeight; }
    const r=[L.sx-L.w/2-4, L.sy-L.h-2, L.sx+L.w/2+4, L.sy+2];
    const hide=placed.some(q=>r[0]<q[2] && r[2]>q[0] && r[1]<q[3] && r[3]>q[1]);
    const v=hide ? 'hidden' : '';
    if(L.el.style.visibility!==v) L.el.style.visibility=v;
    if(!hide) placed.push(r);
  }
}

function examQueue(){
  const pool=TPL.filter(t=>!t.caseOnly && t.cat!=='mimo'), pick=[], by=L=>pool.filter(t=>t.lvl===L && !pick.includes(t));

  for(let i=pick.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pick[i],pick[j]]=[pick[j],pick[i]]; }

  if(a==='menu'){ restartDemo(); showMenu(); return dirty(); }
  if(a==='tab') return setTab(el.dataset.tab);
  if(a==='grip'){ const app=$('#app'); app.dataset.sheet = app.dataset.sheet==='half' ? 'full' : 'half'; return syncTabs(); }
  if(a==='more'){ const app=$('#app'), on=app.dataset.more!=='1'; app.dataset.more=on ? '1' : ''; el.setAttribute('aria-expanded', String(on)); return; }
  if(a==='uf'){ UF=el.dataset.id; return dirty(); }
  if(a==='mute'){ muted=!muted; el.textContent=muted ? 'Zvuk vyp.' : 'Zvuk'; if(muted){ stopVoice(); stopAmb(); } return; }
  if(a==='view') return viewAll();
  if(a==='cov'){ covShow=!covShow; return dirty(); }
  if(a==='skills') return showSkills();
  if(a==='closeSkills') return closeSkills();
  if(a==='log') return showLog();
  if(a==='debrief'){ const d=(G.debriefs||[])[+id]; if(d) showDebrief(d); return; }
  if(a==='closeDeb'){ G.debOpen=false; const d=G.debCase; G.debCase=null; if(d) d.shown=true;
    if(G.mode==='over' && G.script && G.script.endHTML){ const ov=$('#overlay'); ov.innerHTML=G.script.endHTML; ov.scrollTop=0; return; }
    return closeSkills(); }
  if(a==='lesson') return showLesson(+id);
  if(a==='skipcourse'){ PROG.course=PROG.course||{best:{}, open:1}; PROG.course.open=LESSONS.length; saveProg(); return showMenu('course'); }
  if(a==='lstart') return startScript('course', +id);
  if(a==='exam') return startScript('exam');
  if(a==='case') return showCase(id);
  if(a==='cstart') return startScript('cases', id);
  if(a==='buy') return buySkill(id);
  if(a==='reset'){
    if(Date.now()-resetArmed>4000){ resetArmed=Date.now(); el.textContent='Naozaj vymazať? Klikni znova.'; return; }
    PROG={v:1, xp:0, level:1, points:1, skills:[], best:0, light:PROG.light, sessions:0}; saveProg(); restartDemo(); showMenu(); return dirty();
  }
  if(a==='pause' || a==='resume') return togglePause();
  if(a==='quit'){ G.mode='play'; if(G.script && !G.script.done){ G.script.done=true; G.script.quit=true; return scriptEnd(); } return endGame(); }
  if(a==='speed'){ if(G.mode!=='play') return; G.speed = G.speed===1 ? 2 : G.speed===2 ? 4 : 1; el.textContent='×'+G.speed; return; }
  if(G.mode!=='play') return;
  if(a==='answer') answer(callById(id));
  else if(a==='ask') ask(callById(id), el.dataset.type);
  else if(a==='interp') interp(callById(id));
  else if(a==='autoloc'){ const inc=incById(id); if(inc && inc.lost && !inc.lost.auto){ inc.lost.auto=G.t+4; dirty(); } }
  else if(a==='zoomlost'){ const inc=incById(id); if(inc && inc.lost) focusAt(inc.lost.x, inc.lost.z, inc.lost.r*7); }
  else if(a==='cat') pickCat(callById(id), el.dataset.type);
  else if(a==='lvl') pickLvl(callById(id), el.dataset.type);
  else if(a==='oopt') resolveO(callById(id), el.dataset.type);
  else if(a==='izs') izsRequest(incById(id), el.dataset.type);
  else if(a==='tanr') tanrStart(incById(id));
  else if(a==='tanrskip') tanrSkip(incById(id));
  else if(a==='tanrc') tanrChoose(incById(id), +el.dataset.type);
  else if(a==='tanrtap') tanrTap(incById(id));
  else if(a==='aed') aedSend(incById(id));
  else if(a==='defer') deferInc(incById(id));
  else if(a==='undefer'){ const inc=incById(id); if(inc){ inc.defer=false; dirty(); } }
  else if(a==='consult') askConsult(callById(id));
  else if(a==='endintake') endIntakeBtn(incById(id));
  else if(a==='hmark') markH(callById(id), +el.dataset.type);
  else if(a==='cq') askCq(callById(id), el.dataset.type);
  else if(a==='trap') askTrap(callById(id), +el.dataset.type);
  else if(a==='kontakt') askContact(callById(id));
  else if(a==='cb') callBack(callById(id));
  else if(a==='rada') radaToggle(callById(id), +el.dataset.type);
  else if(a==='radadone') radaDone(callById(id));
  else if(a==='istep'){ G.istep=+el.dataset.type; dirty(); }
  else if(a==='inc') select(G.sel.inc===id ? null : id);
  else if(a==='desel'){ G.sel.inc=null; dirty(); }
  else if(a==='send') dispatch(unitById(el.dataset.unit), incById(id));
  else if(a==='hosp') chooseHosp(unitById(el.dataset.unit), id);
  else if(a==='aid') callAid();
  else if(a==='calm') calmCaller(callById(id));
  else if(a==='post') postUnit(unitById(el.dataset.unit), id);
  else if(a==='sendall') sendRecommended(incById(id));
  else if(a==='fa') giveAid(incById(id), +el.dataset.type);
  else if(a==='fq') askFq(callById(id), +el.dataset.type);
  else if(a==='rask') askRepeat(callById(id), +el.dataset.type);
  else if(a==='rfa') repeatAid(callById(id), +el.dataset.type);
  else if(a==='faopen'){ const inc=incById(id); if(inc && inc.fa){ inc.fa.open=!inc.fa.open; dirty(); } }
  else if(a==='unit') unitClick(unitById(id));
}
function unitClick(u){
  if(!u) return;
  const inc=incById(G.sel.inc);
  if(inc && !isIzs(u) && dispatchable(u, inc)) return dispatch(u, inc);
  G.sel.unit = G.sel.unit===u.id ? null : u.id; dirty();
  if(G.sel.unit){ focusOn(u.x, u.z); openSheet('units'); }
}
/* akcia sa vykoná pri pustení prsta/myši na tom istom prvku */
let down=null;
const keyOf = el => ['act','id','type','unit','tempo','tab'].map(k=>el.dataset[k]||'').join('|');
document.addEventListener('pointerdown', e=>{
  audio();
  const el=e.target.closest('[data-act]');
  down = el && !el.disabled ? {key:keyOf(el), x:e.clientX, y:e.clientY} : null;
});
document.addEventListener('pointerup', e=>{
  if(!down) return;
  const d=down; down=null;
  if(Math.hypot(e.clientX-d.x, e.clientY-d.y)>12) return;
  const t=document.elementFromPoint(e.clientX, e.clientY), el=t && t.closest('[data-act]');
  if(el && !el.disabled && keyOf(el)===d.key){ e.preventDefault(); act(el); }
});
document.addEventListener('pointercancel', ()=>{ down=null; });
document.addEventListener('click', e=>{ if(e.detail!==0) return; const el=e.target.closest('[data-act]'); if(el && !el.disabled) act(el); });
document.addEventListener('keydown', e=>{
  if(!G) return;
  const onBtn=e.target.closest && e.target.closest('button');
  if(e.key===' '){ if(onBtn) return; e.preventDefault(); if(G.mode==='play' || (G.mode==='pause' && !$('#overlay').dataset.resume)) togglePause(); return; }
  if(G.mode!=='play' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k=e.key.toLowerCase();
  const talk=G.calls.find(c=>c.state==='talk');
  if(k==='a'){ answer(G.calls.find(c=>c.state==='ring')); }
  else if(talk && talk.kind==='repeat'){ if('qwe'.includes(k) && k.length===1) askRepeat(talk, 'qwe'.indexOf(k)); else if(k==='r') calmCaller(talk); }
  else if(talk && 'zxc'.includes(k) && k.length===1){ askFq(talk, 'zxc'.indexOf(k)); }
  else if(talk && k.length===1 && k>='1' && k<='9'){ ask(talk, Q_ORDER[+k-1]); }
  else if(talk && 'knmo'.includes(k) && k.length===1 && talk.cat){ pickLvl(talk, k.toUpperCase()); }
  else if(talk && k==='t'){ interp(talk); }
  else if(k==='s'){ const inc=incById(G.sel.inc) || G.incs.find(i=>i.cpr && i.cpr.step===i.cpr.n); if(inc){ if(!inc.cpr && inc.lvl==='K') tanrStart(inc); else if(inc.cpr && inc.cpr.step===inc.cpr.n) tanrTap(inc); } }
  else if(k==='enter' && !onBtn && has('d_rec')){ const inc=incById(G.sel.inc); if(inc){ e.preventDefault(); sendRecommended(inc); } }
  else if(k==='escape'){ G.sel.inc=null; G.sel.unit=null; dirty(); }
});
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && G && G.mode==='play') togglePause(); });

/* ---------- slučka ---------- */
const TIME_SCALE=.5;   // minúty hry za sekundu pri ×1 – pokojnejšie tempo
/* príjem hovoru (rozhovor, vyslanie, TANR) beží takmer v reálnom čase: 2 sekundy hry za sekundu */
const INTAKE_RATE=2/60;
const intakeActive = () => !!G && !quiet() && (G.calls.some(c=>c.state==='talk' && c.kind!=='repeat') || G.incs.some(i=>i.intake));
let last=performance.now(), lastUI=0;
function frame(now){
  const dt=Math.min(.1, (now-last)/1000); last=now;
  if(running()){
    let left=dt*(intakeActive() ? (G.script && G.script.kind!=='course' ? INTAKE_RATE/2 : INTAKE_RATE) : G.speed*TIME_SCALE);
    while(left>0 && running()){ const s=Math.min(.05,left); step(s); left-=s; }
    const ia=intakeActive(), app=$('#app'), ip = !ia ? '' : G.calls.some(c=>c.state==='talk' && c.kind!=='repeat') ? 'call' : 'inc';
    app.classList.toggle('intake', ia); if(app.dataset.ip!==ip) app.dataset.ip=ip;
  }
  syncCallAudio();
  render3D(now);
  if(uiDirty || (running() && now-lastUI>450)){ uiDirty=false; lastUI=now; renderUI(); }
  updateTimers();
  requestAnimationFrame(frame);
}

/* ---------- štart ---------- */
$('#btnVoice').textContent=PROG.voice ? 'Hlas zap.' : 'Hlas';
$('#legend').innerHTML=[1,2,3,4,5,6].map(s=>`<span style="--sc:var(--s${s})">${s} ${STATUS[s]}</span>`).join('');
buildSprites();
G=newGame('normal','demo');
init3D();
if(document.fonts && document.fonts.load){
  Promise.race([Promise.all([document.fonts.load('800 40px "Barlow Condensed"'), document.fonts.load('700 20px "Barlow Condensed"')]), new Promise(r=>setTimeout(r,2500))])
    .then(()=>{ buildSprites(); if(G && G.mode==='demo' && !$('#overlay').hidden && $('#overlay').classList.contains('menu')) showMenu(); }).catch(()=>{});
}
new ResizeObserver(()=>{ resize3D(); }).observe($('#mapbox'));
showMenu();
renderUI();
requestAnimationFrame(frame);
</script>
