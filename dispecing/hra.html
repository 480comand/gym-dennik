          const own=has(s.id), reqOk=s.req.every(has), can=!own && reqOk && PROG.points>=s.cost;
          const reqTxt=s.req.length && !reqOk ? 'Najprv: '+s.req.map(r=>SKILLS.find(x=>x.id===r).name).join(', ') : '';
          return `<div class="sk${own?' own':''}${!own && !reqOk?' lock':''}"><b>${esc(s.name)}</b><p>${esc(s.desc)}</p>
            <div class="row">${own ? '<span class="ok">Odomknuté</span>' : `<span class="cost">${s.cost} ${s.cost===1?'bod':'body'}</span>`}<span class="grow"></span>
            ${own ? '' : `<button class="btn${can?' go':''}" data-act="buy" data-id="${s.id}" ${can?'':'disabled'}>Odomknúť</button>`}</div>
            ${reqTxt ? `<p>${esc(reqTxt)}</p>` : ''}</div>`;
        }).join('')}</div>`).join('')}</div>
    </div>`;
  };
  showSkills.draw=draw; draw();
}
function buySkill(id){
  const s=SKILLS.find(x=>x.id===id);
  if(!s || has(id) || !s.req.every(has) || PROG.points<s.cost) return;
  PROG.points-=s.cost; PROG.skills.push(id); saveProg();
  for(const d of UNITS_DEF) if(d[3]===id && !G.units.some(u=>u.id===d[0])){ G.units.push(makeUnit(d)); }
  SND.level(); dirty(); if(showSkills.draw) showSkills.draw();
}
function closeSkills(){
  const ov=$('#overlay');
  if(ov.dataset.resume){ ov.dataset.resume=''; G.mode='play'; pauseBtn(false); ov.hidden=true; }
  else if(G.mode==='demo') showMenu();
  else if(G.mode==='over') showSummary();
  else if(G.mode==='pause') showPause();
  else ov.hidden=true;
  dirty();
}
function showPause(){
  const ov=$('#overlay'); ov.hidden=false; ov.classList.remove('menu');
  ov.innerHTML=`<div class="sheet" style="max-width:440px">
    <h2 class="grade">Pauza</h2>
    <p class="lead">Služba trvá ${clockOf(G.t)}. Volajúci počkajú.</p>
    <div class="acts"><button class="btn go" data-act="resume">Pokračovať</button><button class="btn" data-act="skills">Schopnosti${PROG.points?` <span class="badge">${PROG.points}</span>`:''}</button><button class="btn" data-act="quit">Ukončiť službu</button></div>
  </div>`;
}
function endGame(){
  if(G.mode==='over') return;
  if(G.mode==='demo'){ restartDemo(); return; }
  G.mode='over'; PROG.sessions++;
  if(G.score>PROG.best){ PROG.best=G.score; G.newBest=true; }
  G.newMedals=earnedMedals(); PROG.medals=PROG.medals||{}; for(const m of G.newMedals) PROG.medals[m]=(PROG.medals[m]||0)+1;
  if(G.ch){
    G.goalRes=G.ch.goals.map(g=>({g, ok:goalOk(g)}));
    G.stars = G.done && G.rep>0 ? G.goalRes.filter(r=>r.ok).length : 0;
    if(G.ch.id==='daily'){ if(!PROG.daily || PROG.daily.day!==G.ch.day || G.score>PROG.daily.best){ PROG.daily={day:G.ch.day, best:G.score}; G.dailyBest=true; } }
    else { PROG.stars=PROG.stars||{}; PROG.stars[G.ch.id]=Math.max(PROG.stars[G.ch.id]||0, G.stars); }
  }
  saveProg(); showSummary(); (G.rep<=0 ? SND.bad : SND.ok)(); dirty();
}
function decReport(){
  const s=G.stats, d=s.dec||{}, rows=DEC_L.filter(([k])=>d[k]);
  if(!rows.length && !s.harmed && !s.died && !s.fqBad) return s.resolved ? `<p class="keys">Rozbor vysielania: žiadne chybné rozhodnutie – posádky išli vždy tam, kam mali.${s.faOk ? ' Dobré rady prvej pomoci: '+s.faOk+'.' : ''}</p>` : '';
  return `<div><div class="k" style="margin-bottom:6px">Rozbor vysielania</div><ul class="declist">${rows.map(([k,l])=>`<li><b>${d[k]}×</b> ${l}</li>`).join('')}</ul>
    <p class="keys">${s.fqOk ? 'Dôležité informácie z hovorov: '+s.fqOk+'. ' : ''}${s.fqBad ? 'Zbytočné otázky: '+s.fqBad+'. ' : ''}${s.faOk ? 'Dobré rady prvej pomoci: '+s.faOk+'. ' : ''}${s.lateMin ? 'Pomoc kvôli tomu prišla spolu o '+Math.round(s.lateMin)+' min neskôr. ' : ''}${s.harmed ? 'Udalosti s následkami: '+s.harmed+'. ' : ''}${s.died ? 'Nezachránení pre zdržanie: '+s.died+'.' : ''}</p></div>`;
}
function showSummary(){
  const s=G.stats, avg=s.resp.length ? Math.round(s.resp.reduce((a,b)=>a+b,0)/s.resp.length) : null;
  const ov=$('#overlay'); ov.hidden=false; ov.classList.remove('menu');
  ov.innerHTML=`<div class="sheet">
    <div><div class="k">${G.ch ? esc(G.ch.name)+' · ' : G.single ? 'Jedna udalosť naraz · ' : ''}Služba trvala ${clockOf(G.t)}</div><h2 class="grade" style="margin-top:6px">${G.rep<=0 ? 'Vedúci ťa vystriedal' : G.ch && !G.done ? 'Výzva nedokončená' : 'Služba ukončená'}</h2></div>
    ${G.ch ? `<div class="row" style="gap:16px; flex-wrap:wrap">${STAR(G.stars)}<ul class="goallist">${G.goalRes.map(r=>`<li class="${r.ok?'ok':''}">${GOAL_TXT[r.g[0]](r.g[1])}</li>`).join('')}</ul></div>` : ''}
    <p class="lead">${G.rep<=0 ? 'Dôvera klesla na nulu – príliš veľa ľudí nedostalo pomoc včas. Postup a schopnosti ti ostávajú.' : G.ch && !G.done ? 'Hviezdičky dostaneš, len keď výzvu dohráš do konca.' : 'Dobrá práca. Skúsenosti sa pripísali k tvojmu postupu.'}${G.dailyBest ? ' Nový dnešný rekord v dennej výzve!' : ''}</p>
    <div class="sumgrid">
      <div><b>${G.score}</b><span class="k">Skóre</span></div>
      <div><b>${s.resolved}</b><span class="k">Vyriešené</span></div>
      <div><b>${s.failed+s.hung}</b><span class="k">Bez pomoci</span></div>
      <div><b>${avg==null ? '—' : avg+' min'}</b><span class="k">Ø do príchodu</span></div>
      <div><b>+${s.xp}</b><span class="k">Skúsenosti</span></div>
      <div><b>${PROG.level}</b><span class="k">Úroveň</span></div>
    </div>
    <p class="keys">${G.newBest ? 'Nový rekord!' : 'Rekord: '+PROG.best+' b.'} · Najdlhšia séria: ${G.comboMax||0}${s.precise ? ' · Presné vyslania: '+s.precise : ''}${s.wrong ? ' · Nesprávne určené hovory: '+s.wrong : ''}${s.missed ? ' · Prehliadnuté komplikácie: '+s.missed : ''}${s.esc ? ' · Zhoršené udalosti: '+s.esc : ''}${s.wasted ? ' · Plané výjazdy: '+s.wasted : ''}${s.pranks ? ' · Odhalené zneužitia: '+s.pranks : ''}</p>
    ${decReport()}
    ${G.newMedals.length ? `<div><div class="k" style="margin-bottom:6px">Nové medaily</div><div class="medals">${G.newMedals.map(id=>{ const m=MEDALS.find(x=>x[0]===id); return `<span class="medal new" title="${esc(m[2])}"><b>${esc(m[1])}</b></span>`; }).join('')}</div></div>` : ''}
    <div class="acts"><button class="btn go" data-act="again">${G.ch ? 'Hrať znova' : 'Nová služba'}</button><button class="btn" data-act="skills">Schopnosti${PROG.points?` <span class="badge">${PROG.points}</span>`:''}</button><button class="btn" data-act="menu">Hlavné menu</button></div>
  </div>`;
}
function clearWorld(){ for(const id of [...incObj.keys()]) dropIncMesh(id); for(const L of FX) L.el.remove(); FX.length=0; if(addP){ addP.list.length=0; norP.list.length=0; } }
function restartDemo(){ clearWorld(); G=newGame('normal','demo'); applyWeatherFx(); }
function start(tempo, mode){
  audio(); clearWorld(); clipIndex();
  CR=Math.random; WR=Math.random;
  let ch=null;
  if(mode && mode.daily){ const day=todayKey(); CR=rng(hashStr(day)); WR=rng(hashStr(day)+1); ch=dailyChallenge(day); }
  else if(mode && mode.ch){ ch=JSON.parse(JSON.stringify(CHALLENGES.find(c=>c.id===mode.ch))); }
  G=newGame(ch ? ch.tempo : tempo||'normal', 'play', ch); G.modeOpt=mode||null; applyWeatherFx();
  if(!ch && mode && mode.single){ G.single=true; G.nextMajor=1e9; }
  $('#overlay').hidden=true; $('#overlay').innerHTML='';
  $('#btnSpeed').textContent='×1'; pauseBtn(false);
  lastScore=lastRep=null; $('#hints').innerHTML='';
  say(ch ? (ch.id==='daily' ? 'Denná výzva začína – rovnaké hovory dostanú dnes všetci.' : 'Výzva „'+ch.name+'“: '+ch.goals.map(g=>GOAL_TXT[g[0]](g[1])).join(' · ')) : G.single ? 'Služba začína – riešiš jeden prípad naraz. Prvý hovor je na ceste.' : 'Služba začína. Prvý hovor je na ceste.');
  dirty();
}
function pauseBtn(p){ const b=$('#btnPause'); b.querySelector('.t').textContent=p ? 'Pokračovať' : 'Pauza'; b.setAttribute('aria-label', p ? 'Pokračovať' : 'Pauza'); b.classList.toggle('paused', p); }
function togglePause(){
  if(G.mode==='play'){ G.mode='pause'; pauseBtn(true); showPause(); }
  else if(G.mode==='pause'){ G.mode='play'; pauseBtn(false); $('#overlay').hidden=true; }
  dirty();
}
/* telefón: záložky dolného panelu; ťuknutie na otvorenú záložku panel zbalí */
const isPhone = () => window.innerWidth<=860;
const wideLandscape = () => isPhone() && window.innerHeight<=520 && window.innerWidth>window.innerHeight;
function setTab(t){
  const app=$('#app');
  if(app.dataset.tab===t && app.dataset.sheet!=='min' && !wideLandscape()) app.dataset.sheet='min';
  else { app.dataset.tab=t; if(app.dataset.sheet==='min') app.dataset.sheet='half'; }
  syncTabs();
}
function openSheet(t){ if(!isPhone()) return; const app=$('#app'); app.dataset.tab=t; if(app.dataset.sheet==='min') app.dataset.sheet='half'; syncTabs(); }
function syncTabs(){
  const app=$('#app'), open=app.dataset.sheet!=='min' || wideLandscape();
  for(const [id,t] of [['tabCalls','calls'],['tabIncs','incs'],['tabUnits','units']]) $('#'+id).classList.toggle('on', open && app.dataset.tab===t);
  $('#btnGrip').textContent = app.dataset.sheet==='full' ? '▾' : '▴';
  $('#btnGrip').setAttribute('aria-label', app.dataset.sheet==='full' ? 'Zmenšiť panel' : 'Zväčšiť panel');
  dirty();
}

/* ---------- ovládanie ---------- */
let resetArmed=0;
function act(el){
  const a=el.dataset.act, id=el.dataset.id;
  if(a==='start') return start(el.dataset.tempo, PROG.single ? {single:true} : null);
  if(a==='gmode'){ PROG.single = id==='single'; saveProg(); return showMenu(); }
  if(a==='again') return start(G.tempo, G.modeOpt);
  if(a==='chal') return start('normal', {ch:id});
  if(a==='daily') return start('normal', {daily:true});
  if(a==='mtab') return showMenu(id);
  if(a==='voice'){ PROG.voice=!PROG.voice; saveProg(); el.textContent=PROG.voice ? 'Hlas zap.' : 'Hlas'; if(PROG.voice) clipIndex(); else stopVoice(); return; }
  if(a==='menu'){ restartDemo(); showMenu(); return dirty(); }
  if(a==='tab') return setTab(el.dataset.tab);
  if(a==='grip'){ const app=$('#app'); app.dataset.sheet = app.dataset.sheet==='half' ? 'full' : 'half'; return syncTabs(); }
  if(a==='more'){ const app=$('#app'), on=app.dataset.more!=='1'; app.dataset.more=on ? '1' : ''; el.setAttribute('aria-expanded', String(on)); return; }
  if(a==='uf'){ UF=el.dataset.id; return dirty(); }
  if(a==='mute'){ muted=!muted; el.textContent=muted ? 'Zvuk vyp.' : 'Zvuk'; if(muted){ stopVoice(); stopAmb(); } return; }
  if(a==='light'){ const ks=Object.keys(LIGHTS); PROG.light=ks[(ks.indexOf(PROG.light)+1)%ks.length]; saveProg(); return applyLight(); }
  if(a==='view') return viewAll();
  if(a==='cov'){ covShow=!covShow; return dirty(); }
  if(a==='skills') return showSkills();
  if(a==='closeSkills') return closeSkills();
  if(a==='buy') return buySkill(id);
  if(a==='reset'){
    if(Date.now()-resetArmed>4000){ resetArmed=Date.now(); el.textContent='Naozaj vymazať? Klikni znova.'; return; }
    PROG={v:1, xp:0, level:1, points:1, skills:[], best:0, light:PROG.light, sessions:0}; saveProg(); restartDemo(); showMenu(); return dirty();
  }
  if(a==='pause' || a==='resume') return togglePause();
  if(a==='quit'){ G.mode='play'; return endGame(); }
  if(a==='speed'){ if(G.mode!=='play') return; G.speed = G.speed===1 ? 2 : G.speed===2 ? 4 : 1; el.textContent='×'+G.speed; return; }
  if(G.mode!=='play') return;
  if(a==='answer') answer(callById(id));
  else if(a==='ask') ask(callById(id), el.dataset.type);
  else if(a==='interp') interp(callById(id));
  else if(a==='autoloc'){ const inc=incById(id); if(inc && inc.lost && !inc.lost.auto){ inc.lost.auto=G.t+4; dirty(); } }
  else if(a==='zoomlost'){ const inc=incById(id); if(inc && inc.lost) focusAt(inc.lost.x, inc.lost.z, inc.lost.r*7); }
  else if(a==='cls') classify(callById(id), el.dataset.type);
  else if(a==='inc') select(G.sel.inc===id ? null : id);
  else if(a==='desel'){ G.sel.inc=null; dirty(); }
  else if(a==='send') dispatch(unitById(el.dataset.unit), incById(id));
  else if(a==='hosp') chooseHosp(unitById(el.dataset.unit), id);
  else if(a==='aid') callAid();
  else if(a==='calm') calmCaller(callById(id));
  else if(a==='post') postUnit(unitById(el.dataset.unit), id);
  else if(a==='sendall') sendRecommended(incById(id));
  else if(a==='fa') giveAid(incById(id), +el.dataset.type);
  else if(a==='fq') askFq(callById(id), +el.dataset.type);
  else if(a==='rask') askRepeat(callById(id), +el.dataset.type);
  else if(a==='rfa') repeatAid(callById(id), +el.dataset.type);
  else if(a==='faopen'){ const inc=incById(id); if(inc && inc.fa){ inc.fa.open=!inc.fa.open; dirty(); } }
  else if(a==='unit') unitClick(unitById(id));
}
function unitClick(u){
  if(!u) return;
  const inc=incById(G.sel.inc);
  if(inc && dispatchable(u, inc)) return dispatch(u, inc);
  G.sel.unit = G.sel.unit===u.id ? null : u.id; dirty();
  if(G.sel.unit){ focusOn(u.x, u.z); openSheet('units'); }
}
/* akcia sa vykoná pri pustení prsta/myši na tom istom prvku */
let down=null;
const keyOf = el => ['act','id','type','unit','tempo','tab'].map(k=>el.dataset[k]||'').join('|');
document.addEventListener('pointerdown', e=>{
  audio();
  const el=e.target.closest('[data-act]');
  down = el && !el.disabled ? {key:keyOf(el), x:e.clientX, y:e.clientY} : null;
});
document.addEventListener('pointerup', e=>{
  if(!down) return;
  const d=down; down=null;
  if(Math.hypot(e.clientX-d.x, e.clientY-d.y)>12) return;
  const t=document.elementFromPoint(e.clientX, e.clientY), el=t && t.closest('[data-act]');
  if(el && !el.disabled && keyOf(el)===d.key){ e.preventDefault(); act(el); }
});
document.addEventListener('pointercancel', ()=>{ down=null; });
document.addEventListener('click', e=>{ if(e.detail!==0) return; const el=e.target.closest('[data-act]'); if(el && !el.disabled) act(el); });
document.addEventListener('keydown', e=>{
  if(!G) return;
  const onBtn=e.target.closest && e.target.closest('button');
  if(e.key===' '){ if(onBtn) return; e.preventDefault(); if(G.mode==='play' || (G.mode==='pause' && !$('#overlay').dataset.resume)) togglePause(); return; }
  if(G.mode!=='play' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k=e.key.toLowerCase();
  const talk=G.calls.find(c=>c.state==='talk');
  if(k==='a'){ answer(G.calls.find(c=>c.state==='ring')); }
  else if(talk && talk.kind==='repeat'){ if('qwe'.includes(k) && k.length===1) askRepeat(talk, 'qwe'.indexOf(k)); else if(k==='r') calmCaller(talk); }
  else if(talk && 'zxc'.includes(k) && k.length===1){ askFq(talk, 'zxc'.indexOf(k)); }
  else if(talk && 'qwer'.includes(k) && k.length===1){ const q=qList(talk)['qwer'.indexOf(k)]; if(q) ask(talk, q); }
  else if(talk && k==='t'){ interp(talk); }
  else if(k.length===1 && k>='1' && k<='9'){ const cats=CAT_ORDER.filter(catOpen); const c=cats[+k-1]; if(c) classify(G.calls.find(c=>c.state==='talk'), c); }
  else if(k==='enter' && !onBtn && has('d_rec')){ const inc=incById(G.sel.inc); if(inc){ e.preventDefault(); sendRecommended(inc); } }
  else if(k==='escape'){ G.sel.inc=null; G.sel.unit=null; dirty(); }
});
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && G && G.mode==='play') togglePause(); });

/* ---------- slučka ---------- */
const TIME_SCALE=.5;   // minúty hry za sekundu pri ×1 – pokojnejšie tempo
let last=performance.now(), lastUI=0;
function frame(now){
  const dt=Math.min(.1, (now-last)/1000); last=now;
  if(running()){
    let left=dt*G.speed*TIME_SCALE;
    while(left>0 && running()){ const s=Math.min(.05,left); step(s); left-=s; }
  }
  syncCallAudio();
  render3D(now);
  if(uiDirty || (running() && now-lastUI>450)){ uiDirty=false; lastUI=now; renderUI(); }
  updateTimers();
  requestAnimationFrame(frame);
}

/* ---------- štart ---------- */
$('#btnVoice').textContent=PROG.voice ? 'Hlas zap.' : 'Hlas';
$('#legend').innerHTML=[1,2,3,4,5,6].map(s=>`<span style="--sc:var(--s${s})">${s} ${STATUS[s]}</span>`).join('');
buildSprites();
G=newGame('normal','demo');
init3D();
if(document.fonts && document.fonts.load){
  Promise.race([Promise.all([document.fonts.load('800 40px "Barlow Condensed"'), document.fonts.load('700 20px "Barlow Condensed"')]), new Promise(r=>setTimeout(r,2500))])
    .then(()=>{ buildSprites(); if(G && G.mode==='demo' && !$('#overlay').hidden && $('#overlay').classList.contains('menu')) showMenu(); }).catch(()=>{});
}
new ResizeObserver(()=>{ resize3D(); }).observe($('#mapbox'));
showMenu();
renderUI();
requestAnimationFrame(frame);
</script>
