<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1222">
<title>Linka 112</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
  :root{
    /* Rozloženie: dispečerský pult – pás s postupom hore, vľavo hovory a udalosti, v strede 3D mapa Košického kraja, vpravo posádky */
    --ink:#0a1222; --panel:#101b30; --card:#16233c; --line:#243450;
    --text:#e8edf6; --muted:#8e9bb4;
    --sodium:#f2b33d; --on-sodium:#1c1405;
    --good:#3ddc97; --bad:#ff4d5e;
    --p1:#ff4d5e; --p2:#ff9a3c; --p3:#f4d35e;
    --s1:#3ddc97; --s2:#2aa198; --s3:#ff9a3c; --s4:#ff4d5e; --s5:#b48cff; --s6:#5aa9ff;
    --t-med:#ff6b81; --t-traffic:#f4d35e; --t-fire:#ff8a3d; --t-tech:#c9a46a; --t-hazmat:#a6e22e;
    --t-police:#5aa9ff; --t-msp:#3fd0c9; --t-mountain:#e86a4a; --t-prank:#8e9bb4;
    --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
    --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{height:100%; margin:0; background:var(--ink); color:var(--text); font-family:var(--f-body); font-size:15px; line-height:1.4;}
  body{overflow:hidden; -webkit-tap-highlight-color:transparent;}
  button{font:inherit; color:inherit;}
  kbd{font:600 10px var(--f-mono); border:1px solid currentColor; border-radius:4px; padding:0 4px; opacity:.7;}
  .ico{width:18px; height:18px; flex:none; display:inline-block; vertical-align:-3px;}

  .app{position:relative; height:100%; display:grid; gap:12px;
    grid-template-columns:minmax(290px,340px) minmax(0,1fr) minmax(250px,300px);
    grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"bar bar bar" "left map right";
    padding-block:12px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    background:radial-gradient(1200px 500px at 50% -10%, color-mix(in srgb, var(--sodium) 7%, transparent), transparent 70%), var(--ink);}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; font-weight:700; font-size:14px;
    border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text);
    padding:8px 12px; min-height:38px; cursor:pointer; user-select:none; touch-action:manipulation;}
  .btn:hover{border-color:var(--muted);}
  .btn:focus-visible{outline:2px solid var(--sodium); outline-offset:2px;}
  .btn:disabled{opacity:.4; cursor:default;}
  .btn.go{background:var(--sodium); border-color:var(--sodium); color:var(--on-sodium); box-shadow:0 0 18px color-mix(in srgb, var(--sodium) 30%, transparent);}
  .btn.ghost{background:transparent;}
  .btn.sm{min-height:30px; padding:5px 9px; font-size:13px;}
  .btn .badge{font:700 11px var(--f-mono); background:var(--bad); color:#fff; border-radius:999px; padding:0 6px; line-height:17px;}

  /* ---------- horný pás ---------- */
  .bar{grid-area:bar; display:flex; align-items:center; gap:10px 20px; flex-wrap:wrap; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:8px 14px;}
  .brand{font:800 28px/1 var(--f-display); letter-spacing:.05em; text-transform:uppercase;}
  .brand b{color:var(--sodium); text-shadow:0 0 18px color-mix(in srgb, var(--sodium) 45%, transparent);}
  .brand small{display:block; font:600 10px var(--f-mono); letter-spacing:.12em; color:var(--muted); margin-top:4px;}
  .k{font:600 10px var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
  .clock{font:800 30px/1 var(--f-display); font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:8px;}
  .live{width:9px; height:9px; border-radius:50%; background:var(--bad); box-shadow:0 0 10px var(--bad); animation:blink 1.2s steps(2,start) infinite;}
  .app:not([data-mode="play"]) .live{visibility:hidden;}
  @keyframes blink{to{opacity:.25;}}
  .track{height:6px; background:var(--line); border-radius:3px; overflow:hidden;}
  .track i{display:block; height:100%; width:0; background:var(--sodium); border-radius:3px; transition:width .3s;}
  .lvl{display:grid; gap:5px; width:150px;}
  .lvl .v{font:800 18px/1 var(--f-display); letter-spacing:.04em; text-transform:uppercase;}
  .stat .v{font:800 26px/1.05 var(--f-display); font-variant-numeric:tabular-nums;}
  .rep{width:120px; display:grid; gap:6px;}
  .rep .track{height:9px;}
  .rep .track i{background:var(--good); box-shadow:0 0 10px var(--good);}
  .rep.low .track i{background:var(--bad); box-shadow:0 0 10px var(--bad);}
  .spacer{flex:1;}
  .ctrl{display:flex; gap:6px; flex-wrap:wrap;}

  /* ---------- bočné panely ---------- */
  .rail{background:var(--panel); border:1px solid var(--line); border-radius:12px; min-height:0; overflow:auto;
    padding:12px; display:flex; flex-direction:column; gap:16px; overscroll-behavior:contain;}
  .rail-left{grid-area:left;} .rail-right{grid-area:right;}
  .sec{display:grid; gap:8px; min-width:0;}
  .sec h2{font:800 17px/1 var(--f-display); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0; display:flex; align-items:center; gap:8px;}
  .count{font:600 11px var(--f-mono); letter-spacing:0; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--text);}
  .empty{margin:0; color:var(--muted); font-size:14px;}
  .row{display:flex; align-items:center; gap:8px; min-width:0;}
  .grow{flex:1; min-width:0;}

  .call{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; display:grid; gap:9px;}
  .call.ring{border-color:var(--sodium); animation:ring 1s ease-in-out infinite;}
  .call.ring .phone{color:var(--sodium); animation:wiggle .5s ease-in-out infinite; display:inline-flex;}
  @keyframes ring{50%{box-shadow:0 0 0 3px color-mix(in srgb, var(--sodium) 30%, transparent), 0 0 24px color-mix(in srgb, var(--sodium) 25%, transparent);}}
  @keyframes wiggle{25%{transform:rotate(-14deg);}75%{transform:rotate(14deg);}}
  .call.talk{border-color:var(--sodium); background:linear-gradient(180deg, color-mix(in srgb, var(--sodium) 9%, var(--card)), var(--card));}
  .call.shake{animation:shake .35s;}
  @keyframes shake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .lbl{font:600 11px var(--f-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--sodium); display:flex; align-items:center; gap:7px;}
  .wave{display:inline-flex; align-items:center; gap:2px; height:14px;}
  .wave i{width:3px; height:100%; background:var(--sodium); border-radius:2px; animation:wave .9s ease-in-out infinite;}
  .wave i:nth-child(2){animation-delay:-.2s;} .wave i:nth-child(3){animation-delay:-.45s;} .wave i:nth-child(4){animation-delay:-.65s;} .wave i:nth-child(5){animation-delay:-.3s;}
  @keyframes wave{0%,100%{transform:scaleY(.25);}50%{transform:scaleY(1);}}
  .quote{margin:0; font-size:16px; line-height:1.45;}
  .quote::before{content:"„";} .quote::after{content:"“";}
  .addr{font:500 12px var(--f-mono); color:var(--muted);}
  .call>.row>.lbl{flex:0 0 auto; white-space:nowrap;} .call>.row>.addr{flex:1 1 0; min-width:0; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* rozhovor s volajúcim */
  .log{display:grid; gap:6px; max-height:230px; overflow:auto; overscroll-behavior:contain;}
  .m{margin:0; padding:7px 10px; border-radius:10px; font-size:15px; line-height:1.4; max-width:92%;}
  .m.c{justify-self:start; background:color-mix(in srgb, var(--sodium) 9%, var(--ink)); border:1px solid color-mix(in srgb, var(--sodium) 28%, transparent);}
  .m.op{justify-self:end; background:var(--line); color:#c7d1e3; font-size:13px;}
  .m.sys{justify-self:center; padding:0; font:600 11px var(--f-mono); color:var(--muted);}
  .m.typing{display:flex; gap:4px; align-items:center; padding:10px 12px;}
  .m.typing i{width:6px; height:6px; border-radius:50%; background:var(--sodium); animation:dot 1s infinite;}
  .m.typing i:nth-child(2){animation-delay:.15s;} .m.typing i:nth-child(3){animation-delay:.3s;}
  @keyframes dot{50%{opacity:.25; transform:translateY(-2px);}}
  .qs{display:flex; flex-wrap:wrap; gap:6px;}
  .qs .btn{font-size:13px; font-weight:600; padding:6px 9px; min-height:34px; border-style:dashed;}
  .qs .btn kbd{margin-left:2px;}
  .qs .btn:disabled{opacity:.35;}
  .qs .btn.hint{border-color:var(--sodium); box-shadow:0 0 12px color-mix(in srgb, var(--sodium) 30%, transparent);}
  .qs .btn.interp{border-style:solid; border-color:var(--s6); color:var(--s6);}
  .chip{font:600 10px var(--f-mono); letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:999px; background:var(--s6); color:var(--ink); white-space:nowrap;}
  .chip.warn{background:var(--p2);}
  .locate{display:grid; gap:8px; padding:10px; border-radius:10px; border:1px dashed var(--sodium); background:color-mix(in srgb, var(--sodium) 7%, transparent);}
  .locate p{margin:0;}
  /* prevoz pacienta */
  .trans{background:var(--card); border:1px solid var(--s5); border-left:5px solid var(--s5); border-radius:10px; padding:9px 10px; display:grid; gap:7px;}
  .trans .hosps{display:grid; gap:5px;}
  .trans .hosps .btn{justify-content:space-between; font-size:13px; padding:6px 9px; min-height:36px; text-align:left;}
  .trans .hosps .btn .sub{font:600 11px var(--f-mono);}
  .trans .hosps .btn.rec{border-color:var(--sodium); box-shadow:0 0 12px color-mix(in srgb, var(--sodium) 25%, transparent);}
  /* vybraná posádka */
  .usel{background:var(--card); border:1px solid var(--sodium); border-radius:12px; padding:10px; display:grid; gap:8px;}
  .usel .acts .btn{font-size:12px; min-height:32px; padding:5px 9px;}
  /* čipy na mape */
  .mapchips{display:none; flex-wrap:wrap; gap:6px;}
  .mchip{display:inline-flex; align-items:center; gap:6px; font:600 12px var(--f-mono); padding:5px 10px; border-radius:999px; border:1px solid var(--line);
    background:color-mix(in srgb, var(--panel) 92%, transparent); color:var(--text); cursor:pointer;}
  .mchip.on{border-color:var(--sodium); color:var(--sodium);}
  .mchip.warn{border-color:var(--p2); color:var(--p2);} .mchip.bad{border-color:var(--bad); color:var(--bad);}
  .mchip i{width:8px; height:8px; border-radius:50%; background:currentColor; display:inline-block;}
  .mchip .ico{width:14px; height:14px;}
  .major{background:color-mix(in srgb, var(--bad) 12%, var(--card)); border:1px solid var(--bad); border-radius:12px; padding:10px; display:grid; gap:8px;}
  .major .grade{font-size:20px; color:var(--bad);}
  .inc .chip.mu, .disp .chip.mu{background:var(--bad); color:#fff;}
  .call.repeat{border-color:var(--p2);}
  /* rádio */
  .mapfoot{position:absolute; left:10px; bottom:44px; z-index:3; display:grid; gap:6px; justify-items:start; max-width:min(62%,520px); pointer-events:none;}
  .mapfoot .mapchips{pointer-events:auto;}
  .radio{display:grid; gap:4px;}
  .barchips{display:flex; flex-wrap:wrap; gap:6px; max-width:420px;}
  .rm{background:color-mix(in srgb, var(--panel) 92%, transparent); border:1px solid var(--line); border-left:3px solid var(--s6); border-radius:8px; padding:5px 9px; font-size:12px; animation:hin .2s ease-out;}
  .rm b{font:700 11px var(--f-mono); color:var(--s6); margin-right:4px;}
  .rm.bad{border-left-color:var(--bad);} .rm.bad b{color:var(--bad);}
  .rm.good{border-left-color:var(--good);} .rm.good b{color:var(--good);}
  .cls{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .cls .btn{justify-content:flex-start; text-align:left; border-left:4px solid var(--tc); font-size:13px; padding:7px 8px; gap:6px;}
  .cls .btn .ico{color:var(--tc);}
  .cls .btn kbd{margin-left:auto;}
  .cls .btn.hint{box-shadow:inset 0 0 0 1px var(--tc), 0 0 14px color-mix(in srgb, var(--tc) 35%, transparent);}

  .inc{background:var(--card); border:1px solid var(--line); border-left:5px solid var(--pc); border-radius:10px; padding:9px 10px; cursor:pointer; display:grid; gap:6px;}
  .inc:hover{border-color:var(--muted); border-left-color:var(--pc);}
  .inc.sel{border-color:var(--sodium); border-left-color:var(--pc); box-shadow:0 0 16px color-mix(in srgb, var(--sodium) 18%, transparent);}
  .inc .ico, .disp .ico{color:var(--pc);}
  .prio{font:700 11px var(--f-mono); padding:1px 6px; border-radius:5px; background:var(--pc); color:var(--ink); flex:none;}
  .ttl{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .timer{font:600 12px var(--f-mono); font-variant-numeric:tabular-nums; flex:none;}
  .needs{display:flex; flex-wrap:wrap; gap:4px;}
  .need{font:600 11px var(--f-mono); padding:1px 7px; border-radius:999px; border:1px dashed var(--muted); color:var(--muted);}
  .need.way{border-style:solid; border-color:var(--s3); color:var(--s3);}
  .need.on{border-style:solid; border-color:var(--good); background:var(--good); color:var(--ink);}
  .tbar{height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
  .tbar i{display:block; height:100%; background:var(--pc, var(--sodium));}
  .tbar.work i{background:var(--good);}

  .disp{background:var(--card); border:1px solid var(--sodium); border-radius:12px; padding:12px; display:grid; gap:10px; box-shadow:0 0 22px color-mix(in srgb, var(--sodium) 14%, transparent);}
  .disp .quote{font-size:14px; color:var(--muted);}
  .cand{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center; gap:8px; font-size:14px;}
  .tag{font:700 11px var(--f-mono); padding:2px 6px; border-radius:5px; background:var(--sc); color:var(--ink); white-space:nowrap;}
  .eta{font:600 12px var(--f-mono); color:var(--muted); white-space:nowrap;}
  .sub{font-size:12px; color:var(--muted); font-weight:400;}
  .keys{margin:0; font-size:12px; color:var(--muted);}

  .unit{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:3px 10px; align-items:center; padding:8px 10px;
    background:var(--card); border:1px solid var(--line); border-left:4px solid var(--sc); border-radius:10px; cursor:pointer;}
  .unit:hover{border-color:var(--muted); border-left-color:var(--sc);}
  .unit.sel{border-color:var(--sodium); border-left-color:var(--sc);}
  .unit .veh{width:30px; height:30px; display:grid; place-items:center; border-radius:8px; background:color-mix(in srgb, var(--sc) 18%, transparent); color:var(--sc);}
  .unit .veh .ico{width:22px; height:22px;}
  .unit .nm{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .unit .st{font:600 11px var(--f-mono); color:var(--sc); white-space:nowrap;}
  .unit .what{grid-column:1/-1; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .unit .send{font:700 11px var(--f-mono); color:var(--on-sodium); background:var(--sodium); border-radius:5px; padding:1px 6px;}

  /* ---------- 3D mapa ---------- */
  .mapbox{grid-area:map; position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#070d19; min-height:0;}
  #map{display:block; width:100%; height:100%; touch-action:none; outline:none;}
  .labels{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  .l3{position:absolute; left:0; top:0; white-space:nowrap; will-change:transform;}
  .l3.town{font:800 13px/1 var(--f-display); letter-spacing:.08em; text-transform:uppercase; color:var(--text);
    text-shadow:0 1px 3px #000, 0 0 8px #000; transform-origin:50% 100%;}
  .l3.town.big{font-size:18px; color:var(--sodium);}
  .l3.poi{font:600 10px var(--f-mono); color:#d9e3f2; text-shadow:0 1px 2px #000, 0 0 6px #000;}
  .l3.poi::before{content:"▲ "; color:var(--t-mountain);}
  .l3.poi.lake::before{content:"≈ "; color:var(--s6);} .l3.poi.industry::before{content:"■ "; color:var(--t-hazmat);} .l3.poi.border::before{content:"⬥ "; color:var(--muted);}
  .l3.hosp{font:800 11px/1 var(--f-display); background:#fff; color:var(--bad); border-radius:3px; padding:2px 3px; box-shadow:0 0 10px color-mix(in srgb, var(--bad) 60%, transparent);}
  .l3.unit{pointer-events:auto; cursor:pointer; font:700 10px/1 var(--f-mono); color:var(--ink); background:var(--sc); border-radius:4px; padding:2px 5px; box-shadow:0 1px 4px rgba(0,0,0,.6);}
  .l3.unit.sel{outline:2px solid var(--sodium);}
  .l3.inc{pointer-events:auto; cursor:pointer; display:flex; align-items:center; gap:5px; font:700 11px/1 var(--f-mono); color:var(--text);
    background:color-mix(in srgb, var(--ink) 88%, transparent); border:1px solid var(--pc); border-radius:6px; padding:3px 6px; box-shadow:0 0 14px color-mix(in srgb, var(--pc) 45%, transparent);}
  .l3.inc .ico{width:14px; height:14px; color:var(--pc);}
  .l3.inc.sel{outline:2px solid var(--sodium);}
  .l3.inc.met{border-color:var(--good);}
  .l3.inc.lost{border-style:dashed; border-color:var(--sodium); box-shadow:0 0 14px color-mix(in srgb, var(--sodium) 45%, transparent);}
  .l3.fx{font:800 22px/1 var(--f-display); text-shadow:0 2px 6px #000; animation:rise 1.6s ease-out forwards;}
  .l3.fx.good{color:var(--good);} .l3.fx.bad{color:var(--bad);}
  @keyframes rise{to{margin-top:-46px; opacity:0;}}
  .hints{position:absolute; top:10px; left:50%; transform:translateX(-50%); display:grid; gap:6px; justify-items:center; pointer-events:none; width:min(92%,560px); z-index:3;}
  .hint{background:color-mix(in srgb, var(--panel) 94%, transparent); border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:13px; font-weight:700; text-align:center; animation:hin .2s ease-out; box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .hint.good{border-color:var(--good);} .hint.bad{border-color:var(--bad);}
  @keyframes hin{from{opacity:0; transform:translateY(-6px);}}
  .mapbtns{position:absolute; right:10px; bottom:10px; display:grid; gap:6px; z-index:3;}
  .mapbtns .btn{background:color-mix(in srgb, var(--panel) 90%, transparent); min-height:34px; padding:6px 10px; font-size:13px;}
  .legend{position:absolute; left:10px; bottom:10px; display:flex; flex-wrap:wrap; gap:4px 10px; max-width:calc(100% - 20px); z-index:3;
    background:color-mix(in srgb, var(--panel) 88%, transparent); border:1px solid var(--line); border-radius:8px; padding:5px 9px; font:500 11px var(--f-mono); color:var(--muted); pointer-events:none;}
  .legend span::before{content:""; display:inline-block; width:8px; height:8px; border-radius:2px; background:var(--sc); margin-right:5px;}
  .nogl{position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:20px; color:var(--muted);}

  /* ---------- prekryvné okná ---------- */
  .overlay{position:absolute; inset:0; z-index:20; display:grid; justify-items:center; align-items:start; overflow:auto;
    background:radial-gradient(closest-side, color-mix(in srgb, var(--ink) 72%, transparent), color-mix(in srgb, var(--ink) 40%, transparent));
    padding-block:16px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));}
  .overlay.menu{background:linear-gradient(90deg, color-mix(in srgb, var(--ink) 84%, transparent), color-mix(in srgb, var(--ink) 40%, transparent) 60%, transparent);}
  @media (min-width:1100px){ .overlay.menu{justify-items:start; padding-left:max(48px, env(safe-area-inset-left, 0px));} .overlay.menu .sheet{max-width:600px;} }
  .sheet{margin-block:auto; width:100%; max-width:660px; background:color-mix(in srgb, var(--panel) 95%, transparent); border:1px solid var(--line); border-radius:16px;
    padding:24px; display:grid; gap:16px; box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px color-mix(in srgb, var(--sodium) 10%, transparent); backdrop-filter:blur(6px);}
  .sheet.wide{max-width:1180px;}
  .title{margin:0; font:800 clamp(52px, 10vw, 84px)/.88 var(--f-display); text-transform:uppercase; letter-spacing:.03em; text-wrap:balance;}
  .title b{color:var(--sodium); text-shadow:0 0 30px color-mix(in srgb, var(--sodium) 50%, transparent);}

      height:46vh; height:46dvh; box-shadow:0 -12px 30px rgba(0,0,0,.45); gap:12px;}
    .app[data-sheet="full"] .rail{height:calc(100vh - 210px); height:calc(100dvh - 210px);}

    .app[data-tab="units"] .rail-left, .app:not([data-tab="units"]) .rail-right{display:none;}

    .mtabs{display:flex; background:var(--panel); border-top:1px solid var(--line);
      padding:6px max(10px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));}

    .call{padding:10px;} .quote{font-size:15px;}

<div class="app" id="app" data-tab="calls" data-sheet="min" data-mode="demo">
  <header class="bar">
    <div class="brand"><span class="t">Linka </span><b>112</b><small>Košický kraj</small></div>

    <button class="btn sm" data-act="skills" id="btnSkills"><span class="t">Schopnosti</span><span class="m" id="lvlMini">Úr. 1</span> <span class="badge" id="ptsBadge">1</span></button>

    <div class="spacer"></div>
    <div class="ctrl">
      <button class="btn sm ghost" data-act="pause" id="btnPause" aria-label="Pauza"><svg class="ico pi" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg><svg class="ico pl" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg><span class="t">Pauza</span></button>
      <button class="btn sm ghost opt" data-act="speed" id="btnSpeed" title="Rýchlosť času">×1</button>
      <button class="btn sm ghost opt" data-act="light" id="btnLight" title="Osvetlenie mapy">Večer</button>
      <button class="btn sm ghost opt" data-act="mute" id="btnMute">Zvuk</button>

  <section class="rail rail-left" id="railL">

    <div id="dispatch"></div>
    <div class="sec" id="incs"></div>
  </section>

  <section class="mapbox" id="mapbox">
    <canvas id="map" aria-label="3D mapa Košického kraja s udalosťami a posádkami"></canvas>

    <div class="legend" id="legend"></div>
  </section>

  <section class="rail rail-right" id="railR">
    <div class="sec" id="units"></div>
  </section>

  <nav class="mtabs" id="mtabs">
    <button class="btn" data-act="tab" data-tab="calls" id="tabCalls">Hovory</button>
    <button class="btn" data-act="tab" data-tab="incs" id="tabIncs">Udalosti</button>
    <button class="btn" data-act="tab" data-tab="units" id="tabUnits">Posádky</button>
    <button class="btn grip" data-act="grip" id="btnGrip" aria-label="Zväčšiť panel">▴</button>
  </nav>

  <div class="overlay" id="overlay"></div>
</div>

<script>
"use strict";
/* ============================================================
   Linka 112 — Košický kraj
   Hra na dispečera integrovaného záchranného systému: zdvíhaš hovory
   na linku 112, určíš druh udalosti a riadiš posádky po 3D mape kraja.
   Za zásahy získavaš skúsenosti a odomykáš nové posádky a schopnosti.
   1 sekunda hry = 1 minúta.
   ============================================================ */

/* ---------- pomocné funkcie ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a+(b-a)*t;
const rand = (a,b) => a+Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const pad = n => String(n).padStart(2,'0');
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
/* náhoda pre hovory a udalosti – v dennej výzve má pevné semienko, aby všetci dostali rovnaké hovory */
let CR=Math.random, WR=Math.random;   // CR: hovory, WR: počasie a mimoriadne udalosti
const cr=(a,b)=>a+CR()*(b-a), cpick=a=>a[Math.floor(CR()*a.length)];
const wr=(a,b)=>a+WR()*(b-a), wpick=a=>a[Math.floor(WR()*a.length)];
const hashStr = t => { let h=2166136261; for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; };
function rng(seed){ return () => { seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15, 1|seed); t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- ikony ---------- */
const svg = (body, fill) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="${fill?'currentColor':'none'}" stroke="${fill?'none':'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
const ICON={
  med:     svg('<path d="M9.5 3.5h5v6h6v5h-6v6h-5v-6h-6v-5h6z"/>', true),
  traffic: svg('<path d="M4 16.5h16M5.5 16.5l1.8-5.5h9.4l1.8 5.5"/><circle cx="8" cy="17.5" r="1.7"/><circle cx="16" cy="17.5" r="1.7"/><path d="M3 7l3 2M21 7l-3 2M12 4v3"/>'),
  fire:    svg('<path d="M12 2.5c.8 3.6 5.5 5.3 5.5 10.6a5.5 5.5 0 0 1-11 0c0-3.2 2-4.4 2.4-7.2 1.5 1.1 2.1 2.3 2.2 3.4 1.2-1.4 1.6-3.8.9-6.8z"/>', true),
  tech:    svg('<path d="M14.6 5.4a4.2 4.2 0 0 0-5.3 5.3L3.8 16.2a2 2 0 0 0 2.9 2.9l5.5-5.5a4.2 4.2 0 0 0 5.3-5.3l-2.6 2.6-2.4-.5-.5-2.4z"/>'),
  hazmat:  svg('<circle cx="12" cy="7.8" r="3.6"/><circle cx="7.4" cy="15.6" r="3.6"/><circle cx="16.6" cy="15.6" r="3.6"/><circle cx="12" cy="12.6" r="1.4" fill="currentColor"/>'),
  police:  svg('<path d="M12 2.8l7.5 3v5.6c0 5.2-3.3 8.4-7.5 10.4-4.2-2-7.5-5.2-7.5-10.4V5.8z"/><path d="M12 8.2l1.2 2.5 2.7.3-2 1.9.6 2.7-2.5-1.4-2.5 1.4.6-2.7-2-1.9 2.7-.3z" fill="currentColor" stroke="none"/>'),
  msp:     svg('<path d="M12 2.8l7.5 3v5.6c0 5.2-3.3 8.4-7.5 10.4-4.2-2-7.5-5.2-7.5-10.4V5.8z"/><path d="M8.6 15.2V9l3.4 3.6L15.4 9v6.2"/>'),
  mountain:svg('<path d="M2.5 19.5l6.5-11 3.5 5 2.5-3.5 6.5 9.5z"/><path d="M15 3.5v5M12.5 6h5"/>'),
  prank:   svg('<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>'),
  mass:    svg('<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>'),
  phone:   svg('<path d="M6.5 3h3l2 5-2.2 1.4a11 11 0 0 0 5.3 5.3L16 12.5l5 2v3a2 2 0 0 1-2 2A16.5 16.5 0 0 1 4.5 5a2 2 0 0 1 2-2z"/>'),
  RZP:     svg('<path d="M2.5 7h11v9.5h-11zM13.5 10h4.2l3.3 3.5v3h-7.5z"/><circle cx="6.5" cy="17.5" r="1.7"/><circle cx="17" cy="17.5" r="1.7"/><path d="M8 9.5v4.5M5.8 11.75h4.4"/>'),

/* šum terénu */
const NR=rng(7); const NG=new Float32Array(64*64).map(()=>NR());
const nget=(i,j)=>NG[((j&63)<<6)|(i&63)];
function vnoise(x,y){ const i=Math.floor(x), j=Math.floor(y), fx=x-i, fy=y-j, sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy);
  return lerp(lerp(nget(i,j),nget(i+1,j),sx), lerp(nget(i,j+1),nget(i+1,j+1),sx), sy); }
const fbm=(x,y)=>vnoise(x,y)*.55+vnoise(x*2.1,y*2.1)*.3+vnoise(x*4.3,y*4.3)*.15;
const HILLS_XZ=HILLS.map(([lo,la,rx,rz,h])=>({...proj(lo,la), rx, rz, h}));
const LAKES_XZ=LAKES.map(([lo,la,rx,rz,rot])=>({...proj(lo,la), rx, rz, rot}));
const RIVERS_XZ=RIVERS.map(([n,pts])=>({name:n, pts:pts.map(([lo,la])=>proj(lo,la))}));
const LOW=proj(21.95,48.55);   // Východoslovenská nížina
function segDist(px,pz,a,b){ const vx=b.x-a.x, vz=b.z-a.z, t=clamp(((px-a.x)*vx+(pz-a.z)*vz)/(vx*vx+vz*vz||1),0,1); return Math.hypot(px-a.x-vx*t, pz-a.z-vz*t); }
function riverDist(x,z){ let d=1e9; for(const r of RIVERS_XZ) for(let i=1;i<r.pts.length;i++) d=Math.min(d, segDist(x,z,r.pts[i-1],r.pts[i])); return d; }
function inLake(x,z,l){ const c=Math.cos(l.rot), s=Math.sin(l.rot), dx=x-l.x, dz=z-l.z, u=dx*c+dz*s, v=-dx*s+dz*c; return (u*u)/(l.rx*l.rx)+(v*v)/(l.rz*l.rz); }
/* výška terénu v km (pred prevýšením) */
function heightKm(x,z){
  let h=.12;
  for(const m of HILLS_XZ){ const dx=(x-m.x)/m.rx, dz=(z-m.z)/m.rz; h+=m.h*Math.exp(-(dx*dx+dz*dz)*1.4); }
  const low=Math.exp(-((x-LOW.x)**2+(z-LOW.z)**2)/(2*28*28));
  h += (fbm(x*.07+11, z*.07+5)-.45)*.38*(1-low*.85) + (fbm(x*.25, z*.25)-.5)*.06;
  h = lerp(h, .08, low*.75);
  const rd=riverDist(x,z); h -= .09*Math.exp(-((rd/1.6)**2));
  for(const l of LAKES_XZ){ const q=inLake(x,z,l); if(q<1.6) h=lerp(h, Math.min(h,.06), clamp(1.6-q,0,1)); }
  return Math.max(.02, h);
}
function groundY(x,z){ return heightKm(x,z)*EXAG; }

function tone(freq, dur, type='sine', vol=.1, when=0){
  if(muted || !AC || quiet()) return;
  try{
    const t=AC.currentTime+when, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.03);
  }catch(e){}
}

function noise(dur, vol, freq, when=0){
  if(muted || !AC || quiet()) return;
  try{
    const len=Math.max(1,Math.floor(AC.sampleRate*dur)), buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);

const wxSpeed = u => G && G.weather && !KINDS[u.kind].air ? WEATHER[G.weather].speed : 1;
const speedOf = u => KINDS[u.kind].speed/60 * (has('d_green') ? 1.15 : 1) * wxSpeed(u);          // km za minútu hry
/* dopravná špička v Košiciach spomalí cesty v okolí mesta */
const KE_EDGES=new Set(EDGES.filter(e=>[e.a,e.b].every(id=>Math.hypot(NODES[id].x-NODES.ke.x, NODES[id].z-NODES.ke.z)<11)));
const rushOn = () => G && G.rush && G.t<G.rush;
const trailSpeed = u => (KINDS[u.kind].trail||8)/60 * (has('s_quad') ? 1.5 : 1);
function edgeSpeed(u, e){ return e.t==='T' ? trailSpeed(u) : speedOf(u)*(e.t==='M' ? 1.15 : 1)*(rushOn() && KE_EDGES.has(e) ? .6 : 1); }
const canUse = (u, e) => e.t!=='T' || u.kind==='HZS';
/* najrýchlejšie cesty pre daný druh posádky (čas v minútach hry) */
function dijkstra(src, u){ return dijkstraFrom({[src]:0}, u); }
function dijkstraFrom(init, u){
  const d={}, prev={}, done=new Set();
  for(const id in NODES) d[id]=init[id]===undefined ? Infinity : init[id];
  for(;;){
    let best=null, bv=Infinity;
    for(const id in d) if(!done.has(id) && d[id]<bv){ bv=d[id]; best=id; }
    if(best==null) break;
    done.add(best);
    for(const [v,e] of ADJ[best]) if(canUse(u,e)){ const nd=d[best]+e.len/edgeSpeed(u,e); if(nd<d[v]){ d[v]=nd; prev[v]=best; } }
  }
  return {d, prev};
}
function pathFor(u, from, to){
  if(from===to) return [];
  const {d,prev}=dijkstra(from, u);
  if(d[to]===Infinity) return null;
  const p=[]; for(let v=to; v!==from; v=prev[v]) p.push(v);
  return p.reverse();
}
function setStatus(u, s){ u.status=s; u.since=G.t; dirty(); }
/* trasa k uzlu a prípadne ďalej mimo cesty k presnému miestu */
function routeTo(u, node, dest){
  const n=NODES[node];
  if(KINDS[u.kind].air){ u.path=[]; u.dest=dest || {x:n.x, z:n.z}; u.destNode=node; u.moving=true; return; }
  const from = u.path.length ? u.path[0] : u.node;
  const rest = pathFor(u, from, node) || [];
  u.path = (u.path.length || u.off) ? [from, ...rest] : rest;
  u.dest = dest || null; u.destNode=node;
  u.moving = u.path.length>0 || !!u.dest;
  if(!u.moving) arrived(u);
}

const COV={}; let COVPCT=100, covAt=-9, covShow=false;
const AMB_KINDS=['RZP','RLP','LZS'];
function computeCoverage(){
  const free=G.units.filter(u=>AMB_KINDS.includes(u.kind) && (u.status===1 || u.status===2) && !u.temp);
  const init={}, ground=free.filter(u=>!KINDS[u.kind].air);
  for(const u of ground){ const from=u.path.length ? u.path[0] : u.node, t=Math.hypot(NODES[from].x-u.x, NODES[from].z-u.z)/speedOf(u); if(init[from]===undefined || t<init[from]) init[from]=t; }
  const d=ground.length ? dijkstraFrom(init, ground[0]).d : {};
  const air=free.filter(u=>KINDS[u.kind].air && heliOK());
  let all=0, ok=0;

/* najhoršie pokryté obce – návrhy na presun posádky do zálohy */
function standbyTargets(u){

function postUnit(u, node){

const LAUNCH=4;
const heliOK = () => !G || !G.weather || WEATHER[G.weather].heli;   // vrtuľník potrebuje pár minút na štart
function moveUnit(u, dt){
  const air=KINDS[u.kind].air;
  if(air && u.launch && G.t<u.launch) return;
  let rem=dt;
  while(rem>1e-6){
    let tx, tz, sp;
    if(u.path.length){
      const n=NODES[u.path[0]]; tx=n.x; tz=n.z;
      const from=u.node, e=ADJ[from] && ADJ[from].find(([v])=>v===u.path[0]);
      sp = e ? edgeSpeed(u, e[1]) : speedOf(u);
    } else if(u.dest){ tx=u.dest.x; tz=u.dest.z; sp=air ? speedOf(u) : speedOf(u)*.6; }
    else break;
    if(u.status===1) sp*=.8;
    const dx=tx-u.x, dz=tz-u.z, d=Math.hypot(dx,dz), step=sp*rem;
    if(d>1e-4) u.ang=Math.atan2(dx,dz);
    if(d<=step){

      if(u.path.length){ u.node=u.path.shift(); u.off=false; }
      else { u.dest=null; u.off=!air; if(air) u.node=u.destNode; }
    } else { u.x+=dx/d*step; u.z+=dz/d*step; rem=0; if(!u.path.length && u.dest && !air) u.off=true; }

/* zostávajúci čas jazdy (minúty hry) */
function etaPath(u){

  if(u.dest) t+=Math.hypot(u.dest.x-px,u.dest.z-pz)/(KINDS[u.kind].air ? speedOf(u) : speedOf(u)*.6);

function etaTo(u, inc, cache){

  return Math.hypot(NODES[from].x-u.x, NODES[from].z-u.z)/speedOf(u) + d + Math.hypot(inc.x-n.x, inc.z-n.z)/(speedOf(u)*.6);

/* zodpovedá posádka danej potrebe? (napr. 'RZP|LZS') */

function dispatch(u, inc){

  if(!dispatchable(u, inc)){ say(u.inc===inc.id ? u.name+' už ide na túto udalosť.' : u.name+' je teraz obsadená ('+STATUS[u.status].toLowerCase()+').'); return; }

  if(!KINDS[u.kind].air && pathFor(u, u.path.length ? u.path[0] : u.node, inc.node)===null){ say(u.name+' sa tam nedostane – vedie tam len chodník pre horskú službu.','bad'); return; }
  judgeDispatch(u, inc);
  if(u.inc){ const old=incById(u.inc); if(old) old.units=old.units.filter(x=>x!==u.id); }
  u.inc=inc.id; if(!inc.units.includes(u.id)) inc.units.push(u.id);

/* hodnotenie vyslania: posádka navyše, ďalšia ako najbližšia vhodná, lekár na drobnosť */
function judgeDispatch(u, inc){
  if(quiet() || inc.prank) return;
  const miss=needInfo(inc).missing, fit=miss.filter(n=>fits(u,n));
  if(!fit.length){ inc.extra=(inc.extra||0)+1; G.score-=15; say(u.name+' je navyše – udalosť ju nepotrebuje. −15', 'bad'); return; }
  const cache={}, mine=etaTo(u, inc, cache);
  let best=null;
  for(const c of candidates(inc)) if(c.free && c.u!==u && fit.some(n=>fits(c.u,n)) && (!best || c.eta<best.eta)) best=c;
  if(best && mine>best.eta+3){ inc.precise=false; if(mine>best.eta+5) say('Tip: bližšie bola '+best.u.name+' ('+fmtMin(best.eta)+' namiesto '+fmtMin(mine)+').'); }

function needInfo(inc){
  const assigned=inc.units.map(unitById).filter(u=>u && u.inc===inc.id && (u.status===3 || u.status===4));

  const used=new Set(), slots=new Array(inc.needs.length);

  for(const st of [4,3]){
    for(const [need,i] of order){
      if(slots[i]) continue;
      const u=assigned.find(u=>u.status===st && !used.has(u.id) && fits(u,need));
      if(u){ used.add(u.id); slots[i]={need, st: st===4 ? 'on' : 'way', u}; }
    }
    shareDoc(inc, slots, shared);
  }
  for(let i=0;i<slots.length;i++) if(!slots[i]) slots[i]={need:inc.needs[i], st:'miss'};

}
/* RLP a vrtuľník majú lekára aj prepravu: jedna posádka pokryje potrebu lekára aj jednej sanitky */
const BOTH=new Set(['RLP','LZS']);
function shareDoc(inc, slots, shared){
  for(let i=0;i<slots.length;i++) if(!slots[i]){
    const need=inc.needs[i], doc=need===DOC;
    const j=slots.findIndex((s,j)=>s && j!==i && BOTH.has(s.u.kind) && !shared.has(s.u.id) && (doc ? s.need!==DOC : s.need===DOC && fits(s.u, need)));

}

  return G.units.filter(u=>kinds.has(u.kind) && dispatchable(u, inc) && !(KINDS[u.kind].air && u.status===2 && !heliOK()))
    .map(u=>({u, eta:etaTo(u, inc, cache), free:u.status!==3})).filter(c=>c.eta<Infinity)

    /* k drobnostiam (P3) radšej RZP než lekára, ak je RZP len o chvíľu ďalej */

    let c=null; for(const x of cands) if(!taken.has(x.u.id) && fits(x.u, need) && (!c || cost(x)<cost(c))) c=x;

function createIncident(c, cat){
  c.cx=c.cx||[]; c.asked=c.asked||[]; c.lang=c.lang||'sk';
  const tpl=c.tpl, prank=c.prank, prio=prank ? 3 : tpl.prio, n=NODES[c.node];
  let needs = prank ? [PRANK_UNIT[cat]] : tpl.needs.slice();
  if(prank && !G.units.some(u=>u.kind===needs[0])) needs=['PZ'];
  const rv = prank ? [] : revealedCx(c);
  for(const x of rv) needs.push(x.need);
  const jr = n.type==='town' ? n.r*.55 : 0, ja=Math.random()*6.28, jd=Math.sqrt(Math.random())*jr;
  const inc={id:'I'+(++G.seq), no:G.seq, cat, title: prank ? CATS[cat].label : tpl.title, prio, needs, prank,
    work: prank ? 5 : tpl.work, tr: !prank && !!tpl.tr, search: !prank && !!tpl.search,
    node:c.node, x:n.x+Math.cos(ja)*jd, z:n.z+Math.sin(ja)*jd, addr:c.addr, text:c.lang!=='sk' && !c.interp && c.asked.includes('what') ? tpl.fx[c.lang] : c.text,

      const ghost={...u, x:NODES[u.home].x, z:NODES[u.home].z, node:u.home, path:[], status:2};
      best=Math.min(best, etaTo(ghost, inc, {}));

    if(e && (!e.need || canAdd(needs.concat(inc.hidden.map(x=>x.need)), e.need)) && !(e.need===DOC && needs.includes(DOC)) && Math.random()<e.p) inc.esc={...e, at:G.t+.45*(inc.deadline-G.t)};
  }

  }

  if(G.mode==='demo') demoBot();

  for(const u of G.units){
    if(u.moving) moveUnit(u, dt);

    const info=needInfo(inc);
    if(info.met){
      if(!inc.metAt){ inc.metAt=G.t; inc.frac=clamp((inc.deadline-G.t)/(inc.deadline-inc.created),0,1); dirty(); }

    else if(inc.esc && !inc.metAt && G.t>=inc.esc.at) escalate(inc);

function ribbon(pts, width, lift, step=.5){
  const dense=[];
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i], n=Math.max(1, Math.ceil(Math.hypot(b.x-a.x,b.z-a.z)/step));
    for(let k=(i===1?0:1);k<=n;k++) dense.push({x:lerp(a.x,b.x,k/n), z:lerp(a.z,b.z,k/n)});
  }
  const v=[], idx=[];
  dense.forEach((p,i)=>{
    const q=dense[Math.min(i+1,dense.length-1)], o=dense[Math.max(i-1,0)];
    let dx=q.x-o.x, dz=q.z-o.z; const l=Math.hypot(dx,dz)||1; dx/=l; dz/=l;
    const nx=-dz*width/2, nz=dx*width/2;
    v.push(p.x+nx, groundY(p.x+nx,p.z+nz)+lift, p.z+nz, p.x-nx, groundY(p.x-nx,p.z-nz)+lift, p.z-nz);
    if(i>0){ const b=(i-1)*2; idx.push(b,b+1,b+2, b+1,b+3,b+2); }
  });
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v,3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function mergeGeos(list){

  const pos=new Float32Array(total*3), idx=new Uint32Array(itotal); let o=0, io=0;
  for(const g of list){ pos.set(g.attributes.position.array, o*3); const ix=g.index.array; for(let i=0;i<ix.length;i++) idx[io+i]=ix[i]+o; o+=g.attributes.position.count; io+=ix.length; }
  const m=new THREE.BufferGeometry(); m.setAttribute('position', new THREE.BufferAttribute(pos,3)); m.setIndex(new THREE.BufferAttribute(idx,1)); m.computeVertexNormals();
  return m;
}

let addP=null, norP=null;
function particleSystem(n, additive){
  const g=new THREE.BufferGeometry();
  const pos=new Float32Array(n*3), col=new Float32Array(n*3), al=new Float32Array(n), sz=new Float32Array(n);
  g.setAttribute('position', new THREE.BufferAttribute(pos,3)); g.setAttribute('pcolor', new THREE.BufferAttribute(col,3));
  g.setAttribute('alpha', new THREE.BufferAttribute(al,1)); g.setAttribute('size', new THREE.BufferAttribute(sz,1));
  const mat=new THREE.ShaderMaterial({
    uniforms:{map:{value:glowTex}, scale:{value:400}},
    vertexShader:'attribute vec3 pcolor; attribute float alpha; attribute float size; uniform float scale; varying vec3 vC; varying float vA;'+
      'void main(){ vC=pcolor; vA=alpha; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=min(size*scale/max(1.0,-mv.z),70.0); gl_Position=projectionMatrix*mv; }',
    fragmentShader:'uniform sampler2D map; varying vec3 vC; varying float vA; void main(){ vec4 t=texture2D(map, gl_PointCoord); gl_FragColor=vec4(vC, t.a*vA); if(gl_FragColor.a<.01) discard; }',
    transparent:true, depthWrite:false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
  });
  const pts=new THREE.Points(g, mat); pts.frustumCulled=false; scene.add(pts);
  return {pts, n, pos, col, al, sz, list:[], g};
}
function buildParticles(){ addP=particleSystem(700, true); norP=particleSystem(300, false); }

function burst(x,z,hex){ if(!addP) return; const c=new THREE.Color(hex), y=groundY(x,z)+1; for(let i=0;i<40;i++){ const a=Math.random()*6.28, v=rand(1,4); emit(addP, x,y,z, Math.cos(a)*v, rand(1,5), Math.sin(a)*v, rand(.6,1.2), rand(.8,1.6), c.r,c.g,c.b); } }
function stepParticles(S, dt){
  let j=0;
  for(const p of S.list){
    p.life+=dt; if(p.life>=p.max) continue;
    p.vy-= S===addP ? .6*dt : -.1*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    const k=p.life/p.max;
    S.pos[j*3]=p.x; S.pos[j*3+1]=p.y; S.pos[j*3+2]=p.z;
    S.col[j*3]=p.r; S.col[j*3+1]=p.g*(S===addP ? 1-k*.6 : 1); S.col[j*3+2]=p.b*(1-k*.5);

function updateTimers(){
  const demo=G.mode==='demo';
  $('#clock').textContent=demo ? '0:00' : clockOf(G.t);
  const sc=demo ? 0 : G.score;
  if(sc!==lastScore){ lastScore=sc; $('#score').textContent=sc; }
  const rep=demo ? 100 : Math.max(0,Math.round(G.rep));
  if(rep!==lastRep){ lastRep=rep; $('#repBar').style.width=rep+'%'; $('#repTxt').textContent=rep+' %'; $('#repBox').classList.toggle('low', rep<35); }
  for(const el of document.querySelectorAll('.rail [data-to]')){
    const to=+el.dataset.to;
    if(el.dataset.txt) el.textContent=fmtMin(to-G.t);
    else { const from=+el.dataset.from; el.style.width=(clamp((to-G.t)/(to-from),0,1)*100)+'%'; }
  }
  for(const el of document.querySelectorAll('[data-full]')){
    const full=el.dataset.full, n=Math.floor((performance.now()-(+el.dataset.t0))/24);
    if(n>=full.length){ el.textContent=full; delete el.dataset.full; } else el.textContent=full.slice(0, Math.max(0,n))+'▍';
  }
  for(const el of document.querySelectorAll('[data-work]')){ const inc=incById(el.dataset.work); if(inc) el.style.width=(clamp(inc.progress/inc.work,0,1)*100)+'%'; }
}

function showSkills(){
  const wasPlay=G.mode==='play'; if(wasPlay){ G.mode='pause'; pauseBtn(true); }
  const ov=$('#overlay'); ov.hidden=false; ov.classList.remove('menu'); ov.dataset.resume=wasPlay ? '1' : '';
  const draw=()=>{
    ov.innerHTML=`<div class="sheet wide">
      <div class="row"><div class="grow"><h2 class="grade">Schopnosti</h2><p class="keys" style="margin-top:6px">Úroveň ${PROG.level} · voľné body: <b style="color:var(--sodium)">${PROG.points}</b>. Nové posádky sa objavia hneď na svojej základni.</p></div>
        <button class="btn go" data-act="closeSkills">${G.mode==='pause' && ov.dataset.resume ? 'Pokračovať v službe' : 'Hotovo'}</button></div>
      <div class="tree">${BRANCHES.map(b=>`<div class="branch" style="--bc:${b.color}"><h3>${ICON[b.icon]}${b.name}</h3>
        ${SKILLS.filter(s=>s.b===b.id).map(s=>{
          const own=has(s.id), reqOk=s.req.every(has), can=!own && reqOk && PROG.points>=s.cost;
          const reqTxt=s.req.length && !reqOk ? 'Najprv: '+s.req.map(r=>SKILLS.find(x=>x.id===r).name).join(', ') : '';
          return `<div class="sk${own?' own':''}${!own && !reqOk?' lock':''}"><b>${esc(s.name)}</b><p>${esc(s.desc)}</p>
            <div class="row">${own ? '<span class="ok">Odomknuté</span>' : `<span class="cost">${s.cost} ${s.cost===1?'bod':'body'}</span>`}<span class="grow"></span>
            ${own ? '' : `<button class="btn${can?' go':''}" data-act="buy" data-id="${s.id}" ${can?'':'disabled'}>Odomknúť</button>`}</div>
            ${reqTxt ? `<p>${esc(reqTxt)}</p>` : ''}</div>`;
        }).join('')}</div>`).join('')}</div>
    </div>`;
  };
  showSkills.draw=draw; draw();
}
function buySkill(id){
  const s=SKILLS.find(x=>x.id===id);
  if(!s || has(id) || !s.req.every(has) || PROG.points<s.cost) return;
  PROG.points-=s.cost; PROG.skills.push(id); saveProg();
  for(const d of UNITS_DEF) if(d[3]===id && !G.units.some(u=>u.id===d[0])){ G.units.push(makeUnit(d)); }
  SND.level(); dirty(); if(showSkills.draw) showSkills.draw();
}
function closeSkills(){
  const ov=$('#overlay');
  if(ov.dataset.resume){ ov.dataset.resume=''; G.mode='play'; pauseBtn(false); ov.hidden=true; }
  else if(G.mode==='demo') showMenu();
  else if(G.mode==='over') showSummary();
  else if(G.mode==='pause') showPause();
  else ov.hidden=true;
  dirty();
}
function showPause(){
  const ov=$('#overlay'); ov.hidden=false; ov.classList.remove('menu');
  ov.innerHTML=`<div class="sheet" style="max-width:440px">
    <h2 class="grade">Pauza</h2>
    <p class="lead">Služba trvá ${clockOf(G.t)}. Volajúci počkajú.</p>
    <div class="acts"><button class="btn go" data-act="resume">Pokračovať</button><button class="btn" data-act="skills">Schopnosti${PROG.points?` <span class="badge">${PROG.points}</span>`:''}</button><button class="btn" data-act="quit">Ukončiť službu</button></div>
  </div>`;
}
function endGame(){
  if(G.mode==='over') return;
  if(G.mode==='demo'){ restartDemo(); return; }
  G.mode='over'; PROG.sessions++;
  if(G.score>PROG.best){ PROG.best=G.score; G.newBest=true; }
  G.newMedals=earnedMedals(); PROG.medals=PROG.medals||{}; for(const m of G.newMedals) PROG.medals[m]=(PROG.medals[m]||0)+1;
  if(G.ch){
    G.goalRes=G.ch.goals.map(g=>({g, ok:goalOk(g)}));
    G.stars = G.done && G.rep>0 ? G.goalRes.filter(r=>r.ok).length : 0;
    if(G.ch.id==='daily'){ if(!PROG.daily || PROG.daily.day!==G.ch.day || G.score>PROG.daily.best){ PROG.daily={day:G.ch.day, best:G.score}; G.dailyBest=true; } }
    else { PROG.stars=PROG.stars||{}; PROG.stars[G.ch.id]=Math.max(PROG.stars[G.ch.id]||0, G.stars); }
  }
  saveProg(); showSummary(); (G.rep<=0 ? SND.bad : SND.ok)(); dirty();
}
function showSummary(){
  const s=G.stats, avg=s.resp.length ? Math.round(s.resp.reduce((a,b)=>a+b,0)/s.resp.length) : null;

  ov.innerHTML=`<div class="sheet">
    <div><div class="k">${G.ch ? esc(G.ch.name)+' · ' : ''}Služba trvala ${clockOf(G.t)}</div><h2 class="grade" style="margin-top:6px">${G.rep<=0 ? 'Vedúci ťa vystriedal' : G.ch && !G.done ? 'Výzva nedokončená' : 'Služba ukončená'}</h2></div>
    ${G.ch ? `<div class="row" style="gap:16px; flex-wrap:wrap">${STAR(G.stars)}<ul class="goallist">${G.goalRes.map(r=>`<li class="${r.ok?'ok':''}">${GOAL_TXT[r.g[0]](r.g[1])}</li>`).join('')}</ul></div>` : ''}
    <p class="lead">${G.rep<=0 ? 'Dôvera klesla na nulu – príliš veľa ľudí nedostalo pomoc včas. Postup a schopnosti ti ostávajú.' : G.ch && !G.done ? 'Hviezdičky dostaneš, len keď výzvu dohráš do konca.' : 'Dobrá práca. Skúsenosti sa pripísali k tvojmu postupu.'}${G.dailyBest ? ' Nový dnešný rekord v dennej výzve!' : ''}</p>
    <div class="sumgrid">
      <div><b>${G.score}</b><span class="k">Skóre</span></div>
      <div><b>${s.resolved}</b><span class="k">Vyriešené</span></div>
      <div><b>${s.failed+s.hung}</b><span class="k">Bez pomoci</span></div>
      <div><b>${avg==null ? '—' : avg+' min'}</b><span class="k">Ø do príchodu</span></div>
      <div><b>+${s.xp}</b><span class="k">Skúsenosti</span></div>
      <div><b>${PROG.level}</b><span class="k">Úroveň</span></div>
    </div>
    <p class="keys">${G.newBest ? 'Nový rekord!' : 'Rekord: '+PROG.best+' b.'} · Najdlhšia séria: ${G.comboMax||0}${s.precise ? ' · Presné vyslania: '+s.precise : ''}${s.wrong ? ' · Nesprávne určené hovory: '+s.wrong : ''}${s.missed ? ' · Prehliadnuté komplikácie: '+s.missed : ''}${s.esc ? ' · Zhoršené udalosti: '+s.esc : ''}${s.wasted ? ' · Plané výjazdy: '+s.wasted : ''}${s.pranks ? ' · Odhalené zneužitia: '+s.pranks : ''}</p>
    ${G.newMedals.length ? `<div><div class="k" style="margin-bottom:6px">Nové medaily</div><div class="medals">${G.newMedals.map(id=>{ const m=MEDALS.find(x=>x[0]===id); return `<span class="medal new" title="${esc(m[2])}"><b>${esc(m[1])}</b></span>`; }).join('')}</div></div>` : ''}
    <div class="acts"><button class="btn go" data-act="again">${G.ch ? 'Hrať znova' : 'Nová služba'}</button><button class="btn" data-act="skills">Schopnosti${PROG.points?` <span class="badge">${PROG.points}</span>`:''}</button><button class="btn" data-act="menu">Hlavné menu</button></div>
  </div>`;
}
function clearWorld(){ for(const id of [...incObj.keys()]) dropIncMesh(id); for(const L of FX) L.el.remove(); FX.length=0; if(addP){ addP.list.length=0; norP.list.length=0; } }
function restartDemo(){ clearWorld(); G=newGame('normal','demo'); applyWeatherFx(); }
function start(tempo, mode){
  audio(); clearWorld();
  CR=Math.random; WR=Math.random;
  let ch=null;
  if(mode && mode.daily){ const day=todayKey(); CR=rng(hashStr(day)); WR=rng(hashStr(day)+1); ch=dailyChallenge(day); }
  else if(mode && mode.ch){ ch=JSON.parse(JSON.stringify(CHALLENGES.find(c=>c.id===mode.ch))); }
  G=newGame(ch ? ch.tempo : tempo||'normal', 'play', ch); G.modeOpt=mode||null; applyWeatherFx();
  $('#overlay').hidden=true; $('#overlay').innerHTML='';
  $('#btnSpeed').textContent='×1'; pauseBtn(false);
  lastScore=lastRep=null; $('#hints').innerHTML='';
  say(ch ? (ch.id==='daily' ? 'Denná výzva začína – rovnaké hovory dostanú dnes všetci.' : 'Výzva „'+ch.name+'“: '+ch.goals.map(g=>GOAL_TXT[g[0]](g[1])).join(' · ')) : 'Služba začína. Prvý hovor je na ceste.');
  dirty();
}
function pauseBtn(p){ const b=$('#btnPause'); b.querySelector('.t').textContent=p ? 'Pokračovať' : 'Pauza'; b.setAttribute('aria-label', p ? 'Pokračovať' : 'Pauza'); b.classList.toggle('paused', p); }
function togglePause(){
  if(G.mode==='play'){ G.mode='pause'; pauseBtn(true); showPause(); }
  else if(G.mode==='pause'){ G.mode='play'; pauseBtn(false); $('#overlay').hidden=true; }
  dirty();
}
/* telefón: záložky dolného panelu; ťuknutie na otvorenú záložku panel zbalí */
const isPhone = () => window.innerWidth<=860;
const wideLandscape = () => isPhone() && window.innerHeight<=520 && window.innerWidth>window.innerHeight;
function setTab(t){
  const app=$('#app');
  if(app.dataset.tab===t && app.dataset.sheet!=='min' && !wideLandscape()) app.dataset.sheet='min';
  else { app.dataset.tab=t; if(app.dataset.sheet==='min') app.dataset.sheet='half'; }
  syncTabs();
}
function openSheet(t){ if(!isPhone()) return; const app=$('#app'); app.dataset.tab=t; if(app.dataset.sheet==='min') app.dataset.sheet='half'; syncTabs(); }
function syncTabs(){
  const app=$('#app'), open=app.dataset.sheet!=='min' || wideLandscape();
  for(const [id,t] of [['tabCalls','calls'],['tabIncs','incs'],['tabUnits','units']]) $('#'+id).classList.toggle('on', open && app.dataset.tab===t);
  $('#btnGrip').textContent = app.dataset.sheet==='full' ? '▾' : '▴';
  $('#btnGrip').setAttribute('aria-label', app.dataset.sheet==='full' ? 'Zmenšiť panel' : 'Zväčšiť panel');
  dirty();
}

/* ---------- ovládanie ---------- */
let resetArmed=0;
function act(el){
  const a=el.dataset.act, id=el.dataset.id;
  if(a==='start') return start(el.dataset.tempo);
  if(a==='again') return start(G.tempo, G.modeOpt);
  if(a==='chal') return start('normal', {ch:id});
  if(a==='daily') return start('normal', {daily:true});
  if(a==='mtab') return showMenu(id);
  if(a==='voice'){ PROG.voice=!PROG.voice; saveProg(); el.textContent=PROG.voice ? 'Hlas zap.' : 'Hlas'; if(!PROG.voice && window.speechSynthesis) speechSynthesis.cancel(); return; }
  if(a==='menu'){ restartDemo(); showMenu(); return dirty(); }
  if(a==='tab') return setTab(el.dataset.tab);
  if(a==='grip'){ const app=$('#app'); app.dataset.sheet = app.dataset.sheet==='half' ? 'full' : 'half'; return syncTabs(); }
  if(a==='more'){ const app=$('#app'), on=app.dataset.more!=='1'; app.dataset.more=on ? '1' : ''; el.setAttribute('aria-expanded', String(on)); return; }
  if(a==='uf'){ UF=el.dataset.id; return dirty(); }
  if(a==='mute'){ muted=!muted; el.textContent=muted ? 'Zvuk vyp.' : 'Zvuk'; return; }
  if(a==='light'){ const ks=Object.keys(LIGHTS); PROG.light=ks[(ks.indexOf(PROG.light)+1)%ks.length]; saveProg(); return applyLight(); }
  if(a==='view') return viewAll();
  if(a==='cov'){ covShow=!covShow; return dirty(); }
  if(a==='skills') return showSkills();
  if(a==='closeSkills') return closeSkills();
  if(a==='buy') return buySkill(id);
  if(a==='reset'){
    if(Date.now()-resetArmed>4000){ resetArmed=Date.now(); el.textContent='Naozaj vymazať? Klikni znova.'; return; }
    PROG={v:1, xp:0, level:1, points:1, skills:[], best:0, light:PROG.light, sessions:0}; saveProg(); restartDemo(); showMenu(); return dirty();
  }
  if(a==='pause' || a==='resume') return togglePause();
  if(a==='quit'){ G.mode='play'; return endGame(); }
  if(a==='speed'){ if(G.mode!=='play') return; G.speed = G.speed===1 ? 2 : G.speed===2 ? 4 : 1; el.textContent='×'+G.speed; return; }
  if(G.mode!=='play') return;
  if(a==='answer') answer(callById(id));
  else if(a==='ask') ask(callById(id), el.dataset.type);
  else if(a==='interp') interp(callById(id));
  else if(a==='autoloc'){ const inc=incById(id); if(inc && inc.lost && !inc.lost.auto){ inc.lost.auto=G.t+4; dirty(); } }
  else if(a==='zoomlost'){ const inc=incById(id); if(inc && inc.lost) focusAt(inc.lost.x, inc.lost.z, inc.lost.r*7); }
  else if(a==='cls') classify(callById(id), el.dataset.type);
  else if(a==='inc') select(G.sel.inc===id ? null : id);
  else if(a==='desel'){ G.sel.inc=null; dirty(); }
  else if(a==='send') dispatch(unitById(el.dataset.unit), incById(id));
  else if(a==='hosp') chooseHosp(unitById(el.dataset.unit), id);
  else if(a==='aid') callAid();
  else if(a==='calm') calmCaller(callById(id));
  else if(a==='post') postUnit(unitById(el.dataset.unit), id);
  else if(a==='sendall') sendRecommended(incById(id));
  else if(a==='unit') unitClick(unitById(id));
}
function unitClick(u){
  if(!u) return;
  const inc=incById(G.sel.inc);
  if(inc && dispatchable(u, inc)) return dispatch(u, inc);
  G.sel.unit = G.sel.unit===u.id ? null : u.id; dirty();
  if(G.sel.unit){ focusOn(u.x, u.z); openSheet('units'); }
}
/* akcia sa vykoná pri pustení prsta/myši na tom istom prvku */
let down=null;
const keyOf = el => ['act','id','type','unit','tempo','tab'].map(k=>el.dataset[k]||'').join('|');
document.addEventListener('pointerdown', e=>{
  audio();
  const el=e.target.closest('[data-act]');
  down = el && !el.disabled ? {key:keyOf(el), x:e.clientX, y:e.clientY} : null;
});
document.addEventListener('pointerup', e=>{
  if(!down) return;
  const d=down; down=null;
  if(Math.hypot(e.clientX-d.x, e.clientY-d.y)>12) return;
  const t=document.elementFromPoint(e.clientX, e.clientY), el=t && t.closest('[data-act]');
  if(el && !el.disabled && keyOf(el)===d.key){ e.preventDefault(); act(el); }
});
document.addEventListener('pointercancel', ()=>{ down=null; });
document.addEventListener('click', e=>{ if(e.detail!==0) return; const el=e.target.closest('[data-act]'); if(el && !el.disabled) act(el); });
document.addEventListener('keydown', e=>{
  if(!G) return;
  const onBtn=e.target.closest && e.target.closest('button');
  if(e.key===' '){ if(onBtn) return; e.preventDefault(); if(G.mode==='play' || (G.mode==='pause' && !$('#overlay').dataset.resume)) togglePause(); return; }
  if(G.mode!=='play' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k=e.key.toLowerCase();
  const talk=G.calls.find(c=>c.state==='talk');
  if(k==='a'){ answer(G.calls.find(c=>c.state==='ring')); }
  else if(talk && talk.kind==='repeat' && k==='q'){ calmCaller(talk); }
  else if(talk && 'qwer'.includes(k) && k.length===1){ const q=qList(talk)['qwer'.indexOf(k)]; if(q) ask(talk, q); }
  else if(talk && k==='t'){ interp(talk); }
  else if(k.length===1 && k>='1' && k<='9'){ const cats=CAT_ORDER.filter(catOpen); const c=cats[+k-1]; if(c) classify(G.calls.find(c=>c.state==='talk'), c); }
  else if(k==='enter' && !onBtn && has('d_rec')){ const inc=incById(G.sel.inc); if(inc){ e.preventDefault(); sendRecommended(inc); } }
  else if(k==='escape'){ G.sel.inc=null; G.sel.unit=null; dirty(); }
});
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && G && G.mode==='play') togglePause(); });

/* ---------- slučka ---------- */
let last=performance.now(), lastUI=0;
function frame(now){
  const dt=Math.min(.1, (now-last)/1000); last=now;
  if(running()){
    let left=dt*G.speed;
    while(left>0 && running()){ const s=Math.min(.05,left); step(s); left-=s; }
  }
  render3D(now);
  if(uiDirty || (running() && now-lastUI>450)){ uiDirty=false; lastUI=now; renderUI(); }
  updateTimers();
  requestAnimationFrame(frame);
}
