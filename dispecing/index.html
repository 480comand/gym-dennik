<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dispečing">
<title>Dispečing</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span>Dispečing</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="hspacer"></div>
  <button class="shiftinfo" id="shiftinfo" title="Zmena a odovzdanie"></button>
  <div class="clock" id="clock"></div>
  <button class="btn primary" id="btnNew" title="Nová udalosť (N)">+<span class="lbl"> Nová udalosť</span></button>
</header>

<main>
  <section class="view" id="view-board" data-sub="inc">
    <div class="boardtabs" id="boardtabs"></div>
    <div class="col col-inc">
      <div class="colhead"><b>Udalosti</b><span class="cnt" id="incCount"></span></div>
      <div class="colbody" id="incList"></div>
    </div>
    <div class="col col-map">
      <div class="mapwrap">
        <div id="map"></div>
        <div class="mapbtns">
          <button class="btn sm" id="btnFit" title="Zobraziť všetky udalosti a jednotky">⤢</button>
          <button class="btn sm" id="btnMapWin" title="Otvoriť mapu v samostatnom okne (napr. na druhý monitor)">⧉</button>
        </div>
      </div>
    </div>
    <div class="col col-units">
      <div class="colhead"><b>Jednotky</b><div class="hspacer"></div>
        <button class="btn sm ghost" id="btnAddUnit" title="Pridať jednotku">+ Jednotka</button></div>
      <div class="filters" id="unitFilters"></div>
      <div class="colbody" id="unitList"></div>
      <div class="colfoot"><div class="legend" id="legend"></div></div>
    </div>
  </section>
  <section class="view" id="view-log"><div class="page" id="logPage"></div></section>
  <section class="view" id="view-shift"><div class="page" id="shiftPage"></div></section>
  <section class="view" id="view-settings"><div class="page" id="settingsPage"></div></section>
</main>

<div id="modalRoot"></div>
<div id="dialogRoot"></div>
<div id="pickBanner"></div>
<div class="toast" id="toast"></div>
<div id="print"></div>
<noscript>Aplikácia potrebuje zapnutý JavaScript.</noscript>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
