<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Denník">
<title>Gym Denník</title>
<style>
  :root{
    --bg:#0f1115; --bg2:#171a21; --bg3:#20242e; --line:#2b303b;
    --txt:#eef1f6; --mut:#9aa3b2; --acc:#4f8cff; --acc2:#37d39b;
    --warn:#ffb23e; --pr:#ffd23e; --dang:#ff5d6c; --radius:14px;
  }
  body.light{
    --bg:#f3f5f9; --bg2:#ffffff; --bg3:#e9edf4; --line:#d7dde7;
    --txt:#16202f; --mut:#647082; --pr:#f5c211;
  }
  body.light .exitem.sel{background:#e4edff;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.4;}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom));}
  h1,h2,h3{margin:0 0 .4em;}
  button{font-family:inherit; font-size:16px; cursor:pointer; border:none; color:inherit;}
  input,select,textarea{font-family:inherit; font-size:16px;}
  .app{max-width:680px; margin:0 auto; padding:14px 14px 0;}
  header.top{position:sticky; top:0; z-index:20; background:linear-gradient(var(--bg),var(--bg) 70%,rgba(15,17,21,0));
    padding-top:env(safe-area-inset-top); display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:52px;}
  header.top h1{font-size:21px; letter-spacing:.2px; display:flex; align-items:center; gap:8px;}
  header.top h1 .logo{color:var(--acc2);}
  .muted{color:var(--mut);}
  .small{font-size:13px;}
  .card{background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
  .row{display:flex; gap:8px; align-items:center;}
  .row.wrap{flex-wrap:wrap;}
  .grow{flex:1;}
  .btn{background:var(--bg3); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--acc); border-color:var(--acc); color:#fff;}
  .btn.good{background:var(--acc2); border-color:var(--acc2); color:#06231a;}
  .btn.ghost{background:transparent;}
  .btn.danger{background:transparent; border-color:#5a2a30; color:var(--dang);}
  .btn.block{width:100%;}
  .btn.sm{min-height:40px; padding:8px 12px; font-size:14px; border-radius:10px;}
  .btn.lg{min-height:58px; font-size:18px;}
  .iconbtn{background:transparent; border:none; padding:8px; min-height:40px; min-width:40px; color:var(--mut); font-size:20px;}
  input.fld,select.fld,textarea.fld{width:100%; background:var(--bg3); border:1px solid var(--line);
    color:var(--txt); border-radius:10px; padding:12px; outline:none;}
  input.fld:focus,select.fld:focus,textarea.fld:focus{border-color:var(--acc);}
  label.lbl{display:block; font-size:12px; color:var(--mut); margin:0 0 4px 2px; text-transform:uppercase; letter-spacing:.5px;}
  .num{width:100%; text-align:center; font-variant-numeric:tabular-nums; font-weight:700; font-size:18px;}
  .pill{display:inline-flex; align-items:center; gap:6px; background:var(--bg3); border:1px solid var(--line);
    border-radius:999px; padding:6px 12px; font-size:13px; color:var(--mut); white-space:nowrap;}
  .pill.on{background:var(--acc); border-color:var(--acc); color:#fff;}
  .tag{font-size:11px; padding:2px 8px; border-radius:999px; background:var(--bg3); border:1px solid var(--line); color:var(--mut); white-space:nowrap;}
  .tag.eq{color:#bcd0ff;}
  .tag.ms{color:#bfead9;}
  .badge-pr{background:var(--pr); color:#3a2e00; border-color:var(--pr); font-weight:800;}
  .scroll-x{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .scroll-x::-webkit-scrollbar{display:none;}
  .center{text-align:center;}
  .empty{text-align:center; color:var(--mut); padding:40px 16px;}
  .empty .big{font-size:40px; margin-bottom:8px;}
  .divider{height:1px; background:var(--line); margin:10px 0;}
  .setrow{display:grid; grid-template-columns:34px 1fr 1fr 46px; gap:8px; align-items:center; margin-bottom:8px;}
  .setrow .idx{width:34px; height:34px; border-radius:9px; background:var(--bg3); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--mut);}
  .setrow.done .idx{background:var(--acc2); color:#06231a;}
  .setrow.done input{opacity:.65;}
  .setrow .chk{min-height:44px; border-radius:10px; background:var(--bg3); border:1px solid var(--line); font-size:20px;}
  .setrow .chk.on{background:var(--acc2); border-color:var(--acc2); color:#06231a;}
  .exhead{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .exhead .name{font-weight:700; font-size:17px;}
  /* bottom nav */
  nav.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--bg2);
    border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom);}
  nav.tabbar button{flex:1; background:transparent; border:none; color:var(--mut); padding:9px 4px 8px;
    display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; font-weight:600;}
  nav.tabbar button .ic{font-size:21px; line-height:1;}
  nav.tabbar button.on{color:var(--acc);}
  /* sticky workout bar */
  .activebar{position:fixed; left:0; right:0; bottom:calc(64px + env(safe-area-inset-bottom)); z-index:25;
    display:flex; justify-content:center; pointer-events:none;}
  .activebar .inner{pointer-events:auto; max-width:680px; width:calc(100% - 20px); background:var(--acc);
    color:#fff; border-radius:14px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 8px 24px rgba(0,0,0,.4); gap:10px;}
  .activebar .inner .t{font-weight:700;}
  /* rest timer */
  #resttimer{position:fixed; left:0; right:0; bottom:calc(64px + env(safe-area-inset-bottom)); z-index:26; display:flex; justify-content:center; pointer-events:none;}
  .resttimer .inner{pointer-events:auto; position:relative; overflow:hidden; max-width:680px; width:calc(100% - 20px);
    background:var(--bg3); border:1px solid var(--acc2); border-radius:14px; padding:10px 12px;
    display:flex; align-items:center; gap:8px; box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .resttimer .bar{position:absolute; left:0; top:0; bottom:0; background:rgba(55,211,155,.18); transition:width 1s linear; z-index:0;}
  .resttimer .rt-time{position:relative; z-index:1; font-weight:800; font-variant-numeric:tabular-nums; font-size:18px; flex:1; color:var(--acc2);}
  .resttimer .rt-btn{position:relative; z-index:1; background:var(--bg2); border:1px solid var(--line); color:var(--txt); border-radius:9px; min-height:38px; padding:0 12px; font-weight:700;}
  .resttimer .rt-btn.wide{min-width:52px; font-size:13px;}
  /* segmented control */
  .seg{display:flex; background:var(--bg3); border:1px solid var(--line); border-radius:12px; padding:4px; gap:4px; margin-bottom:12px;}
  .seg button{flex:1; background:transparent; color:var(--mut); border:none; border-radius:9px; padding:9px 4px; font-weight:700; font-size:14px;}
  .seg button.on{background:var(--acc); color:#fff;}
  /* horizontal volume bars */
  .vbar{margin-bottom:10px;}
  .vbar .vtop{display:flex; justify-content:space-between; font-size:14px; margin-bottom:4px;}
  .vbar .vtop b{font-weight:600;} .vbar .vtop span{color:var(--mut);}
  .vbar .track{height:10px; background:var(--bg3); border-radius:6px; overflow:hidden;}
  .vbar .fill{height:100%; background:linear-gradient(90deg,var(--acc),var(--acc2)); border-radius:6px;}
  /* template chip */
  .tplcard{display:flex; align-items:center; gap:10px; background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
  .tplcard .tnm{font-weight:700;}
  /* modal */
  .modal{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55); display:flex; flex-direction:column; justify-content:flex-end;}
  .modal .sheet{background:var(--bg); border-top-left-radius:18px; border-top-right-radius:18px;
    max-height:92vh; display:flex; flex-direction:column; border-top:1px solid var(--line);}
  .modal .sheet .shead{padding:14px 14px 8px; position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line);}
  .modal .sheet .sbody{overflow-y:auto; padding:12px 14px calc(20px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch;}
  .grab{width:40px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 8px;}
  .exitem{display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; background:var(--bg2);}
  /* SVG piktogramy cvikov */
  .exart{width:48px; height:48px; flex:none; background:var(--bg3); border:1px solid var(--line); border-radius:11px; padding:4px;}
  .exart.lg{width:62px; height:62px; border-radius:14px;}
  .exart svg{width:100%; height:100%; display:block;}
  .exart .fig{stroke:var(--txt); stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round;}
  .exart .hd{fill:var(--txt); stroke:none;}
  .exart .gear{stroke:var(--acc); stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round;}
  .exart .gearf{fill:var(--acc); stroke:none;}
  .exitem .nm{font-weight:600;}
  .exitem.sel{border-color:var(--acc); background:#16243f;}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(140px + env(safe-area-inset-bottom));
    background:var(--pr); color:#3a2e00; font-weight:800; padding:12px 18px; border-radius:12px; z-index:60;
    box-shadow:0 8px 24px rgba(0,0,0,.4); opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .stat{background:var(--bg3); border:1px solid var(--line); border-radius:12px; padding:12px;}
  .stat .v{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;}
  .stat .k{font-size:12px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px;}
  canvas{width:100%; display:block;}
  .hist-day .d{font-weight:700;}
  .hist-ex{display:flex; justify-content:space-between; gap:8px; font-size:14px; padding:3px 0; color:var(--mut);}
  .hist-ex b{color:var(--txt); font-weight:600;}
  a{color:var(--acc);}
  .hidden{display:none !important;}
  select.fld{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
    background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px; background-size:5px 5px,5px 5px; background-repeat:no-repeat;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<div id="activebar"></div>
<div id="resttimer"></div>
<nav class="tabbar" id="tabbar"></nav>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   Gym Denník — jednosúborová appka na zaznamenávanie tréningov
   Dáta: localStorage (offline). Grafy: vlastný canvas renderer.
   ============================================================ */

/* ---------- Pomocné funkcie ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
const el = (tag, props={}, ...kids) => {
  const n = document.createElement(tag);
  for(const k in props){
    if(k==='class') n.className = props[k];
    else if(k==='html') n.innerHTML = props[k];
    else if(k.startsWith('on') && typeof props[k]==='function') n.addEventListener(k.slice(2), props[k]);
    else if(props[k]!==false && props[k]!=null) n.setAttribute(k, props[k]);
  }
  for(const c of kids){ if(c==null) continue; n.append(c.nodeType?c:document.createTextNode(c)); }
  return n;
};
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);
const round = (n,d=1)=>{ const f=10**d; return Math.round(n*f)/f; };
function fmtDate(iso){
  const d=new Date(iso+'T00:00:00'); const days=['Ne','Po','Ut','St','Št','Pi','So'];
  return days[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear();
}
function relDay(iso){
  const a=new Date(iso+'T00:00:00'), b=new Date(todayISO()+'T00:00:00');
  const diff=Math.round((b-a)/86400000);
  if(diff===0) return 'Dnes'; if(diff===1) return 'Včera'; if(diff>1&&diff<7) return 'pred '+diff+' dňami';
  return fmtDate(iso);
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function epley1RM(w,r){ return r<=1? w : w*(1+r/30); }
function mmss(sec){ const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function beep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const a=new AC();
    [0,0.25].forEach((t,i)=>{
      const o=a.createOscillator(), g=a.createGain();
      o.connect(g); g.connect(a.destination);
      o.frequency.value=i?1175:880; o.type='sine';
      o.start(a.currentTime+t); g.gain.setValueAtTime(0.0001,a.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.25,a.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t+0.2);
      o.stop(a.currentTime+t+0.22);
    });
  }catch(e){}
}

/* ---------- Časovač oddychu (v pamäti, nie v úložisku) ---------- */
let rest={remaining:0,total:0,timer:null};
function startRest(sec){
  if(!sec || sec<=0) return;
  rest.remaining=sec; rest.total=sec;
  clearInterval(rest.timer);
  rest.timer=setInterval(()=>{
    rest.remaining--;
    if(rest.remaining<=0){
      clearInterval(rest.timer); rest.timer=null; rest.remaining=0;
      beep(); if(navigator.vibrate) navigator.vibrate([200,80,200]);
      renderRestTimer(); toast('⏱️ Oddych hotový — poď na to!');
      return;
    }
    renderRestTimer();
  },1000);
  renderRestTimer();
}
function addRest(sec){ if(rest.remaining>0){ rest.remaining=Math.max(1,rest.remaining+sec); rest.total=Math.max(rest.total,rest.remaining); renderRestTimer(); } }
function stopRest(){ clearInterval(rest.timer); rest.timer=null; rest.remaining=0; renderRestTimer(); }
function renderRestTimer(){
  const root=$('#resttimer'); if(!root) return; root.innerHTML='';
  if(rest.remaining<=0) return;
  const pct=rest.total? (rest.remaining/rest.total)*100 : 0;
  root.append(el('div',{class:'resttimer'},
    el('div',{class:'inner'},
      el('div',{class:'bar', style:'width:'+pct+'%'}),
      el('button',{class:'rt-btn', onclick:stopRest},'✕'),
      el('div',{class:'rt-time'}, '⏱️ '+mmss(rest.remaining)),
      el('button',{class:'rt-btn wide', onclick:()=>addRest(15)},'+15s'),
      el('button',{class:'rt-btn wide', onclick:()=>addRest(30)},'+30s'))));
}

/* ---------- Typy cvikov ----------
   strength  = váha (kg) × opakovania
   bodyweight= opakovania (+ voliteľná pridaná váha)
   cardio    = vzdialenosť (km) + čas (min)
*/
const EQUIP = ['Veľká činka','Jednoručky','Stroj','Kladka','Vlastná váha','Kettlebell','Gumy','Kardio','Iné'];
const MUSCLE = ['Hrudník','Chrbát','Ramená','Biceps','Triceps','Nohy','Sedacie','Brucho','Predlaktie','Lýtka','Celé telo','Kardio'];

/* ---------- Prednastavené cviky ---------- */
const DEFAULT_EXERCISES = [

  ['fly-db','Rozpažky s jednoručkami','Jednoručky','Hrudník','strength'],
  ['fly-cable','Sťahovanie kladiek (fly)','Kladka','Hrudník','strength'],
  ['chest-press-machine','Tlaky na stroji (hrudník)','Stroj','Hrudník','strength'],
  ['pec-deck','Peck-deck (motýlik)','Stroj','Hrudník','strength'],
  ['dips-chest','Dipy na bradlách (hrudník)','Vlastná váha','Hrudník','bodyweight'],
  ['pushup','Kliky','Vlastná váha','Hrudník','bodyweight'],
  // Chrbát
  ['deadlift','Mŕtvy ťah','Veľká činka','Chrbát','strength'],
  ['deadlift-romanian','Rumunský mŕtvy ťah','Veľká činka','Sedacie','strength'],
  ['row-bb','Príťahy v predklone (činka)','Veľká činka','Chrbát','strength'],
  ['row-db','Príťahy jednoručkou','Jednoručky','Chrbát','strength'],
  ['row-tbar','T-bar príťahy','Stroj','Chrbát','strength'],
  ['row-cable','Príťahy na spodnej kladke','Kladka','Chrbát','strength'],
  ['lat-pulldown','Sťahovanie hornej kladky','Kladka','Chrbát','strength'],

  ['chinup','Zhyby podhmatom','Vlastná váha','Chrbát','bodyweight'],
  ['row-machine','Veslovanie na stroji','Stroj','Chrbát','strength'],
  ['pullover-db','Pullover s jednoručkou','Jednoručky','Chrbát','strength'],
  ['hyperextension','Hyperextenzie','Vlastná váha','Chrbát','bodyweight'],
  // Ramená
  ['ohp-bb','Tlaky nad hlavu (činka)','Veľká činka','Ramená','strength'],
  ['ohp-db','Tlaky s jednoručkami nad hlavu','Jednoručky','Ramená','strength'],
  ['lateral-raise','Upažovanie s jednoručkami','Jednoručky','Ramená','strength'],
  ['front-raise','Predpažovanie','Jednoručky','Ramená','strength'],
  ['rear-delt-fly','Obrátené rozpažky (zadné delty)','Jednoručky','Ramená','strength'],
  ['shoulder-press-machine','Tlaky na ramená (stroj)','Stroj','Ramená','strength'],
  ['upright-row','Príťahy k brade','Veľká činka','Ramená','strength'],
  ['facepull','Face pull','Kladka','Ramená','strength'],
  ['shrug','Sťahy ramien (trapézy)','Jednoručky','Chrbát','strength'],
  // Biceps
  ['curl-bb','Bicepsový zdvih (činka)','Veľká činka','Biceps','strength'],
  ['curl-db','Bicepsový zdvih (jednoručky)','Jednoručky','Biceps','strength'],
  ['curl-hammer','Kladivkové zdvihy','Jednoručky','Biceps','strength'],
  ['curl-preacher','Zdvih na Scottovej lavici','Stroj','Biceps','strength'],
  ['curl-cable','Bicepsový zdvih na kladke','Kladka','Biceps','strength'],
  ['curl-concentration','Koncentrovaný zdvih','Jednoručky','Biceps','strength'],
  // Triceps
  ['tricep-pushdown','Sťahovanie kladky (triceps)','Kladka','Triceps','strength'],
  ['tricep-overhead','Francúzsky tlak nad hlavu','Jednoručky','Triceps','strength'],
  ['skullcrusher','Skull crusher','Veľká činka','Triceps','strength'],
  ['dips-triceps','Dipy (triceps)','Vlastná váha','Triceps','bodyweight'],
  ['bench-close-grip','Bench úzkym úchopom','Veľká činka','Triceps','strength'],
  ['tricep-kickback','Zákopy (kickback)','Jednoručky','Triceps','strength'],
  // Nohy
  ['squat','Drep s činkou','Veľká činka','Nohy','strength'],
  ['squat-front','Predný drep','Veľká činka','Nohy','strength'],
  ['leg-press','Leg press','Stroj','Nohy','strength'],
  ['leg-extension','Predkopávanie','Stroj','Nohy','strength'],
  ['leg-curl','Zakopávanie','Stroj','Nohy','strength'],
  ['lunge','Výpady','Jednoručky','Nohy','strength'],
  ['bulgarian-split','Bulharský drep','Jednoručky','Nohy','strength'],
  ['hack-squat','Hack drep','Stroj','Nohy','strength'],
  ['goblet-squat','Goblet drep','Kettlebell','Nohy','strength'],
  ['calf-raise','Výpony na lýtka','Stroj','Lýtka','strength'],
  ['hip-thrust','Hip thrust','Veľká činka','Sedacie','strength'],
  ['squat-bw','Drepy s vlastnou váhou','Vlastná váha','Nohy','bodyweight'],
  // Brucho / core
  ['plank','Plank (výdrž)','Vlastná váha','Brucho','cardio'],

const GOAL_LABEL={muscle:'Naberanie svalov', strength:'Sila', fatloss:'Chudnutie', fitness:'Kondícia'};

const GOAL_PARAMS={muscle:{sets:3,reps:'8–12',rest:90}, strength:{sets:4,reps:'4–6',rest:150},
  fatloss:{sets:3,reps:'12–15',rest:60}, fitness:{sets:3,reps:'10–15',rest:75}};
const LEVEL_COUNT={beg:4,int:5,adv:6};
const PLAN_POOLS={
  gym:{
    push:['bench-bb','ohp-db','bench-incline-db','fly-cable','lateral-raise','tricep-pushdown'],
    pull:['deadlift','lat-pulldown','row-bb','facepull','curl-bb','curl-hammer'],

    fullC:['leg-press','bench-db','row-cable','lateral-raise','leg-raise'],

    upperA:['bench-db','row-db','ohp-db','curl-db','tricep-overhead'],
    lowerA:['goblet-squat','lunge','kb-swing','bulgarian-split','plank'],
    upperB:['bench-incline-db','pullup','lateral-raise','curl-hammer','tricep-kickback'],
    lowerB:['bulgarian-split','kb-swing','squat-bw','leg-raise','crunch'],
    fullA:['goblet-squat','bench-db','row-db','plank'],
    fullB:['lunge','ohp-db','pullup','crunch'],
    fullC:['kb-swing','fly-db','curl-db','leg-raise'],
  },
  bw:{
    push:['pushup','dips-chest','dips-triceps','plank'],
    pull:['pullup','chinup','hyperextension','hanging-knee-raise'],

    lowerB:['lunge','squat-bw','burpee','leg-raise'],
    fullA:['squat-bw','pushup','pullup','plank'],
    fullB:['burpee','dips-chest','hyperextension','crunch'],
    fullC:['lunge','pushup','chinup','leg-raise'],
  },
};
function genPlan(goal, level, days, equip){
  const P=PLAN_POOLS[equip]||PLAN_POOLS.gym;
  const g=GOAL_PARAMS[goal]||GOAL_PARAMS.muscle;
  const n=LEVEL_COUNT[level]||5;
  let split;
  if(days<=2) split=[['Celé telo A',P.fullA],['Celé telo B',P.fullB]];
  else if(days===3) split= level==='beg'
    ? [['Celé telo A',P.fullA],['Celé telo B',P.fullB],['Celé telo C',P.fullC]]
    : [['Push (tlaky)',P.push],['Pull (ťahy)',P.pull],['Nohy',P.legs]];
  else if(days===4) split=[['Vrch tela A',P.upperA],['Spodok tela A',P.lowerA],['Vrch tela B',P.upperB],['Spodok tela B',P.lowerB]];
  else if(days===5) split=[['Push (tlaky)',P.push],['Pull (ťahy)',P.pull],['Nohy',P.legs],['Vrch tela',P.upperA],['Spodok tela',P.lowerA]];
  else split=[['Push A',P.push],['Pull A',P.pull],['Nohy A',P.legs],['Push B',P.push],['Pull B',P.pull],['Nohy B',P.legs]];
  const week=split.map(([name,pool])=>{
    const items=pool.slice(0,n).map(id=>({exerciseId:id, sets:g.sets, reps:g.reps}));
    if(goal==='fatloss'||goal==='fitness')
      items.push({exerciseId: equip==='gym'?'run':'jump-rope', sets:1, reps:'10 min'});
    return {name, items};
  });
  return {goal, level, days, equip, created:todayISO(), lastDayIdx:null, week};
}

/* ---------- Stav / úložisko ---------- */
const STORE_KEY = 'gymdennik.v1';
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const s = JSON.parse(raw); return normalize(s); }
  }catch(e){ console.error('load fail',e); }
  return normalize({});
}
function normalize(s){
  s.customExercises = s.customExercises || [];
  s.hiddenDefaults  = s.hiddenDefaults  || [];
  s.workouts        = s.workouts        || [];   // dokončené tréningy
  s.active          = s.active          || null; // prebiehajúci tréning
  s.templates       = s.templates       || [];   // šablóny tréningov
  s.bodylog         = s.bodylog         || [];   // telesná váha a miery
  s.settings        = s.settings        || {};
  if(!s.settings.unit) s.settings.unit='kg';
  if(s.settings.restEnabled==null) s.settings.restEnabled=true;
  if(s.settings.restDefault==null) s.settings.restDefault=90;
  if(s.settings.theme==null) s.settings.theme='dark';
  if(s.settings.weeklyGoal==null) s.settings.weeklyGoal=3;
  // predvolený plán na mieru: naberanie svalov · 4 dni · pokročilý · fitko
  if(!('plan' in s)){ s.plan=genPlan('muscle','adv',4,'gym'); s.settings.weeklyGoal=4; }
  return s;
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ alert('Nepodarilo sa uložiť dáta: '+e.message); }
}

/* zoznam všetkých dostupných cvikov (default mínus skryté + vlastné) */
function allExercises(){
  const defs = DEFAULT_EXERCISES.filter(e=>!state.hiddenDefaults.includes(e.id));
  return [...defs, ...state.customExercises];
}
function exById(id){ return allExercises().find(e=>e.id===id) || DEFAULT_EXERCISES.find(e=>e.id===id) || null; }

function applyTheme(){
  const t=state.settings.theme;
  const light = t==='light' || (t==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
  document.body.classList.toggle('light', light);
}
function render(){
  applyTheme();
  renderTabs();
  renderActiveBar();
  renderRestTimer();
  const app = $('#app'); app.innerHTML='';
  if(route==='train') app.append(viewTrain());
  else if(route==='history') app.append(viewHistory());
  else if(route==='progress') app.append(viewProgress());
  else if(route==='exercises') app.append(viewExercises());
  else if(route==='more') app.append(viewMore());
}

function renderTabs(){
  const bar=$('#tabbar'); bar.innerHTML='';
  for(const t of TABS){
    bar.append(el('button',{class:route===t.id?'on':'', onclick:()=>go(t.id)},
      el('span',{class:'ic'},t.ic), el('span',{},t.label)));
  }
}

  }

  // prebiehajúci tréning

        for(const l of LOCATIONS) s.append(el('option',{value:l, selected:a.location===l?'selected':false},l));
        return s; })())));
  head.append(el('div',{style:'height:8px'}));
  head.append(el('input',{class:'fld', placeholder:'Názov tréningu (napr. Push, Nohy)…', value:a.name||'',
    oninput:e=>{a.name=e.target.value; save();}}));
  wrap.append(head);

  // cviky
  for(const entry of a.entries){
    wrap.append(exerciseCard(entry));
  }

  wrap.append(el('button',{class:'btn block', style:'margin-bottom:12px', onclick:openExercisePicker},'➕  Pridať cvik'));

  if(a.entries.length){

      oninput:e=>{a.note=e.target.value; save();}}));

    wrap.append(el('button',{class:'btn good lg block', onclick:finishWorkout},'✓  Dokončiť a uložiť'));

  }
  wrap.append(el('div',{style:'height:8px'}));
  wrap.append(el('button',{class:'btn danger block', onclick:cancelWorkout},'Zrušiť tréning'));
  return wrap;
}

function homeStats(){
  const ws=state.workouts;
  const last7=ws.filter(w=>{
    const d=(new Date(todayISO())-new Date(w.date))/86400000; return d>=0 && d<7;
  }).length;
  const totalVol = ws.reduce((t,w)=>t+workoutVolume(w),0);
  const streak = computeStreakWeeks();
  const c=el('div',{class:'card'});
  c.append(el('div',{class:'statgrid'},
    stat(ws.length,'Tréningov'),
    stat(last7,'Za 7 dní'),
    stat(round(totalVol/1000,1)+'t','Nazdvíhané'),
    stat(streak,'Týždne v rade')));
  const goal=state.settings.weeklyGoal;
  if(goal>0){
    const monISO=isoOf(mondayOf(new Date(todayISO()+'T00:00:00')));
    const n=ws.filter(w=>w.date>=monISO).length;
    const hit=n>=goal;
    c.append(el('div',{class:'vbar', style:'margin:12px 0 2px'},
      el('div',{class:'vtop'},
        el('b',{},'Cieľ týždňa'+(hit?' ✅':'')),
        el('span',{}, n+' / '+goal+' tréningov')),
      el('div',{class:'track'},
        el('div',{class:'fill', style:'width:'+Math.min(100,n/goal*100)+'%'+(hit?';background:var(--acc2)':'')}))));
  }
  return c;
}
function stat(v,k){ return el('div',{class:'stat'}, el('div',{class:'v'},String(v)), el('div',{class:'k'},k)); }

function exerciseCard(entry){
  const ex=exById(entry.exerciseId) || {name:'?',type:'strength',equip:'',muscle:''};
  const card=el('div',{class:'card'});
  const head=el('div',{class:'exhead'});
  head.append(el('div',{class:'row grow'},
    artEl(ex),
    el('div',{},
      el('div',{class:'name'}, ex.name),
      el('div',{class:'row wrap', style:'margin-top:4px'},
        el('span',{class:'tag eq'}, ex.equip), el('span',{class:'tag ms'}, ex.muscle),
        entry.target? el('span',{class:'tag', style:'color:var(--pr);border-color:var(--pr)'},'🎯 '+entry.target):null))));
  head.append(el('button',{class:'iconbtn', onclick:()=>{ removeEntry(entry); }},'🗑'));
  card.append(head);

  // hlavička stĺpcov podľa typu
  card.append(setHeader(ex.type));
  entry.sets.forEach((s,i)=>card.append(setRow(entry,ex,s,i)));
  card.append(el('button',{class:'btn ghost sm block', style:'margin-top:4px', onclick:()=>{ addSet(entry,ex); }},'➕ Séria'));

}

function setHeader(type){
  const mk=(a,b,c)=>el('div',{class:'setrow', style:'margin-bottom:2px'},
    el('div',{class:'small muted center'},'#'),
    el('div',{class:'small muted center'},a),
    el('div',{class:'small muted center'},b),
    el('div',{class:'small muted center'},c));
  if(type==='cardio') return mk('km','min','✓');
  if(type==='bodyweight') return mk('opak.','+kg','✓');
  return mk('kg','opak.','✓');
}

function setRow(entry,ex,s,i){
  const row=el('div',{class:'setrow'+(s.done?' done':'')});
  row.append(el('div',{class:'idx'}, String(i+1)));
  const f1=ex.type==='cardio'?'dist':(ex.type==='bodyweight'?'reps':'weight');
  const f2=ex.type==='cardio'?'dur':(ex.type==='bodyweight'?'addw':'reps');
  const ph1=ex.type==='cardio'?'km':(ex.type==='bodyweight'?'opak':'kg');
  const ph2=ex.type==='cardio'?'min':(ex.type==='bodyweight'?'+kg':'opak');
  const step1=ex.type==='cardio'?'0.1':(ex.type==='bodyweight'?'1':'0.5');
  row.append(el('input',{class:'fld num', type:'number', inputmode:'decimal', step:step1, placeholder:ph1,
    value:s[f1]??'', onfocus:e=>e.target.select(), oninput:e=>{ s[f1]=e.target.value===''?null:parseFloat(e.target.value); save(); }}));
  row.append(el('input',{class:'fld num', type:'number', inputmode:'decimal', step:'1', placeholder:ph2,
    value:s[f2]??'', onfocus:e=>e.target.select(), oninput:e=>{ s[f2]=e.target.value===''?null:parseFloat(e.target.value); save(); }}));
  row.append(el('button',{class:'chk'+(s.done?' on':''), onclick:()=>toggleSetDone(entry,ex,s,row)}, s.done?'✓':'○'));
  return row;
}

/* prefill ďalšej série z predošlej / z histórie */
function lastSetFor(exerciseId){
  // posledná séria daného cviku z dokončených tréningov
  const ws=[...state.workouts].sort((a,b)=>b.date.localeCompare(a.date));
  for(const w of ws){
    const e=w.entries.find(x=>x.exerciseId===exerciseId);
    if(e && e.sets.length) return e.sets[e.sets.length-1];
  }
  return null;
}
function addSet(entry,ex){
  let base=entry.sets.length? entry.sets[entry.sets.length-1] : lastSetFor(entry.exerciseId);
  const s={done:false};
  if(ex.type==='cardio'){ s.dist=base?.dist??null; s.dur=base?.dur??null; }
  else if(ex.type==='bodyweight'){ s.reps=base?.reps??null; s.addw=base?.addw??null; }
  else { s.weight=base?.weight??null; s.reps=base?.reps??null; }
  entry.sets.push(s); save(); render();
}
function removeEntry(entry){
  const a=state.active; a.entries=a.entries.filter(e=>e!==entry); save(); render();
}
function toggleSetDone(entry,ex,s,row){
  s.done=!s.done; save();
  row.classList.toggle('done',s.done);
  $('.chk',row).classList.toggle('on',s.done);
  $('.chk',row).textContent=s.done?'✓':'○';
  if(s.done){
    checkLivePR(entry.exerciseId,ex,s);
    if(state.settings.restEnabled && ex.type!=='cardio') startRest(state.settings.restDefault);
  }
}

/* štart / dokončenie */
function startWorkout(){
  state.active={ id:uid(), date:todayISO(), location:'Fitko', name:'', note:'', entries:[] };
  save(); openExercisePicker();
}
function cancelWorkout(){
  if(confirm('Naozaj zrušiť prebiehajúci tréning? Neuloží sa.')){ state.active=null; save(); render(); }
}
function finishWorkout(){
  const a=state.active;
  // odstráň prázdne série a prázdne cviky
  a.entries.forEach(e=>{ e.sets=e.sets.filter(s=>setHasData(s)); });
  a.entries=a.entries.filter(e=>e.sets.length);
  if(!a.entries.length){ alert('Tréning je prázdny — pridaj aspoň jednu sériu s hodnotami.'); return; }
  a.finishedAt=Date.now();
  if(a.planDay!=null && state.plan) state.plan.lastDayIdx=a.planDay;
  state.workouts.push(a);
  const prs=detectWorkoutPRs(a);
  state.active=null; save();
  go('train');
  if(prs.length) toast('🏆 '+prs.length+' nový osobný rekord'+(prs.length>1?'y!':'!'));
  else toast('✓ Tréning uložený');
}
function setHasData(s){
  return ['weight','reps','dist','dur','addw'].some(k=>s[k]!=null && s[k]!=='' && !(k==='addw'));
    // addw je voliteľné, samo o sebe netvorí dáta
}

function planHome(){
  const c=el('div');
  c.append(el('h3',{style:'margin:18px 2px 8px'},'🗓️ Môj tréningový plán'));
  if(!state.plan){
    c.append(el('div',{class:'card center'},
      el('div',{class:'muted small', style:'margin-bottom:10px'},'Vygeneruj si plán podľa cieľa, dní a vybavenia.'),
      el('button',{class:'btn primary block', onclick:openPlanWizard},'✨ Vytvoriť plán na mieru')));
    return c;
  }
  const p=state.plan;
  const next=((p.lastDayIdx==null?-1:p.lastDayIdx)+1)%p.week.length;
  const card=el('div',{class:'card'});
  card.append(el('div',{class:'muted small', style:'margin-bottom:8px'},
    GOAL_LABEL[p.goal]+' · '+p.days+'× týždenne · '+LEVEL_LABEL[p.level].toLowerCase()+' · '+PEQUIP_LABEL[p.equip]));
  p.week.forEach((d,i)=>{
    const names=d.items.slice(0,3).map(it=>exById(it.exerciseId)?.name).filter(Boolean).join(', ');
    card.append(el('div',{class:'tplcard', style:i===next?'border-color:var(--acc2)':''},
      el('div',{class:'grow'},
        el('div',{class:'tnm'}, d.name,
          i===next? el('span',{class:'tag', style:'margin-left:6px;color:var(--acc2);border-color:var(--acc2)'},'ďalší na rade'):''),
        el('div',{class:'muted small'}, d.items.length+' cvikov · '+names+'…')),
      el('button',{class:'btn good sm', onclick:()=>startPlanDay(i)},'▶')));
  });
  card.append(el('div',{class:'row', style:'margin-top:6px'},
    el('button',{class:'btn sm grow', onclick:openPlanWizard},'⚙ Zmeniť plán'),
    el('button',{class:'btn danger sm', onclick:()=>{ if(confirm('Vymazať tréningový plán?')){ state.plan=null; save(); render(); } }},'🗑')));
  c.append(card);
  return c;
}
function startPlanDay(idx){
  const p=state.plan, d=p&&p.week[idx]; if(!d) return;
  if(state.active && !confirm('Máš rozrobený tréning — prepísať ho?')) return;
  state.active={ id:uid(), date:todayISO(), location:p.equip==='gym'?'Fitko':'Doma',
    name:d.name, note:'', entries:[], planDay:idx };
  for(const it of d.items){
    const ex=exById(it.exerciseId); if(!ex) continue;
    const base=lastSetFor(it.exerciseId);
    const entry={exerciseId:it.exerciseId, target:it.sets+'×'+it.reps, sets:[]};
    for(let i=0;i<it.sets;i++){
      const s={done:false};
      if(ex.type==='cardio'){ s.dist=base?.dist??null; s.dur=base?.dur??null; }
      else if(ex.type==='bodyweight'){ s.reps=base?.reps??null; s.addw=base?.addw??null; }
      else { s.weight=base?.weight??null; s.reps=base?.reps??null; }
      entry.sets.push(s);
    }
    state.active.entries.push(entry);
  }
  save(); go('train'); toast('Tréning podľa plánu pripravený');
}

    const s=el('select',{class:'fld'});
    opts.forEach(([v,l])=>s.append(el('option',{value:v, selected:String(curVal)===String(v)?'selected':false},l)));

  const eSel=mkSel('Vybavenie', [['gym','Plne vybavené fitko'],['db','Činky / jednoručky doma'],['bw','Len vlastná váha']], cur.equip);

  const modal=el('div',{class:'modal', onclick:e=>{ if(e.target===modal) closeModal(); }}, sheet);

function startFromTemplate(id){
  const t=state.templates.find(x=>x.id===id); if(!t) return;

  state.active={ id:uid(), date:todayISO(), location:'Fitko', name:t.name, note:'', entries:[] };

    const ex=exById(exId); if(!ex) continue;
    const entry={exerciseId:exId, sets:[]}; state.active.entries.push(entry); addSet(entry,ex);
  }
  save(); go('train'); toast('Šablóna načítaná');
}

let pickerState={q:'',equip:'',muscle:''};
function openExercisePicker(){
  pickerState={q:'',equip:'',muscle:''};
  const root=$('#modalRoot');
  const sheet=el('div',{class:'sheet'});
  const shead=el('div',{class:'shead'});
  shead.append(el('div',{class:'grab'}));
  shead.append(el('div',{class:'row'},
    el('div',{class:'grow', style:'font-weight:700;font-size:18px'},'Pridať cvik'),
    el('button',{class:'iconbtn', onclick:closeModal},'✕')));
  shead.append(el('input',{class:'fld', placeholder:'Hľadať cvik…', id:'pickerSearch',
    oninput:e=>{ pickerState.q=e.target.value.toLowerCase(); refreshPickerList(); }}));
  // filtre
  const fEquip=el('div',{class:'scroll-x', style:'margin-top:8px'});
  fEquip.append(pickPill('Všetko vybavenie','',()=>pickerState.equip,'equip'));
  for(const x of EQUIP) fEquip.append(pickPill(x,x,()=>pickerState.equip,'equip'));
  shead.append(fEquip);
  const fMus=el('div',{class:'scroll-x', style:'margin-top:6px'});
  fMus.append(pickPill('Všetky partie','',()=>pickerState.muscle,'muscle'));
  for(const x of MUSCLE) fMus.append(pickPill(x,x,()=>pickerState.muscle,'muscle'));
  shead.append(fMus);
  sheet.append(shead);
  const body=el('div',{class:'sbody', id:'pickerBody'});
  sheet.append(body);
  const modal=el('div',{class:'modal', onclick:e=>{ if(e.target===modal) closeModal(); }}, sheet);
  root.innerHTML=''; root.append(modal);
  refreshPickerList();
}
function pickPill(label,val,getter,key){
  const on=getter()===val;
  return el('button',{class:'pill'+(on?' on':''), onclick:()=>{ pickerState[key]=val; rebuildPickerPills(); refreshPickerList(); }},label);
}
function rebuildPickerPills(){ // jednoduché – prerender celého modalu by stratil scroll; len prepneme triedy
  $$('.pill', $('#modalRoot')).forEach(p=>{});
  // jednoduchšie: znova vykresliť zoznam aj pilulky cez reopen by resetol search → namiesto toho ručne:
  const root=$('#modalRoot');
  $$('.scroll-x', root).forEach(bar=>{
    [...bar.children].forEach(btn=>{
      const label=btn.textContent;
      let active=false;
      if(bar===$$('.scroll-x',root)[0]) active = (pickerState.equip===''&&label==='Všetko vybavenie')||pickerState.equip===label;
      else active = (pickerState.muscle===''&&label==='Všetky partie')||pickerState.muscle===label;
      btn.classList.toggle('on',active);
    });
  });
}
const $$=(s,e=document)=>[...e.querySelectorAll(s)];
function refreshPickerList(){
  const body=$('#pickerBody'); if(!body) return; body.innerHTML='';
  let list=allExercises();
  if(pickerState.equip) list=list.filter(e=>e.equip===pickerState.equip);
  if(pickerState.muscle) list=list.filter(e=>e.muscle===pickerState.muscle);
  if(pickerState.q) list=list.filter(e=>e.name.toLowerCase().includes(pickerState.q));
  list.sort((a,b)=>a.name.localeCompare(b.name,'sk'));
  const already=new Set((state.active?.entries||[]).map(e=>e.exerciseId));
  if(!list.length){ body.append(el('div',{class:'empty'},'Nič sa nenašlo.')); }
  for(const ex of list){
    const inUse=already.has(ex.id);
    body.append(el('div',{class:'exitem'+(inUse?' sel':''), onclick:()=>{ addExerciseToWorkout(ex.id); }},
      artEl(ex),
      el('div',{class:'grow'},
        el('div',{class:'nm'}, ex.name),
        el('div',{class:'row wrap', style:'margin-top:3px'},
          el('span',{class:'tag eq'},ex.equip), el('span',{class:'tag ms'},ex.muscle),
          el('span',{class:'tag'},TYPE_LABEL[ex.type]))),
      el('span',{style:'font-size:22px;color:'+(inUse?'var(--acc2)':'var(--mut)')}, inUse?'✓':'＋')));
  }
}
function addExerciseToWorkout(exId){
  if(!state.active){ state.active={id:uid(),date:todayISO(),location:'Fitko',name:'',note:'',entries:[]}; }
  const a=state.active;
  if(a.entries.find(e=>e.exerciseId===exId)){ toast('Cvik už je v tréningu'); return; }
  const ex=exById(exId);
  const entry={exerciseId:exId, sets:[]};
  a.entries.push(entry);
  addSet(entry,ex); // pridá prvú sériu (prefill z histórie)
  closeModal(); save(); render();
  toast('Pridané: '+ex.name);
}

function summarizeEntry(e,ex){
  if(!ex) return e.sets.length+'×';
  if(ex.type==='cardio'){
    const d=e.sets.reduce((t,s)=>t+(s.dist||0),0), m=e.sets.reduce((t,s)=>t+(s.dur||0),0);
    return (d?round(d,1)+' km ':'')+(m?round(m)+' min':'') || e.sets.length+' série';
  }
  if(ex.type==='bodyweight'){
    const best=Math.max(...e.sets.map(s=>s.reps||0));
    return e.sets.length+'×'+(best?' · max '+best+' op.':'');
  }
  const top=Math.max(...e.sets.map(s=>s.weight||0));
  return e.sets.length+' sérií · '+(top?top+' kg':'');
}

function usedExerciseIds(){

function chartTitle(ex){
  if(!ex) return 'Vývoj';
  if(ex.type==='cardio') return 'Vzdialenosť za tréning (km)';
  if(ex.type==='bodyweight') return 'Max. opakovania';
  return 'Odhad 1RM (kg)';
}
/* hodnota na graf za každý tréning */
function progressSeries(exId,ex){
  const pts=[];
  const ws=[...state.workouts].sort((a,b)=>a.date.localeCompare(b.date));
  for(const w of ws){
    const e=w.entries.find(x=>x.exerciseId===exId); if(!e||!e.sets.length) continue;
    let v=0;
    if(ex.type==='cardio') v=e.sets.reduce((t,s)=>t+(s.dist||0),0);
    else if(ex.type==='bodyweight') v=Math.max(...e.sets.map(s=>s.reps||0));
    else v=Math.max(...e.sets.map(s=> s.weight? epley1RM(s.weight, s.reps||1):0));
    if(v>0) pts.push({date:w.date, value:round(v,1)});
  }
  return pts;
}
function prStats(pr,ex){
  if(!ex) return [];
  if(ex.type==='cardio') return [
    stat(pr.maxDist!=null?round(pr.maxDist,2)+' km':'—','Najdlhšia'),
    stat(pr.maxDur!=null?round(pr.maxDur)+' min':'—','Najdlhší čas'),
    stat(pr.totalDist!=null?round(pr.totalDist,1)+' km':'—','Spolu km'),
    stat(pr.bestPace||'—','Najlepšie tempo')];
  if(ex.type==='bodyweight') return [
    stat(pr.maxReps??'—','Max opak.'),
    stat(pr.maxAdded!=null?'+'+pr.maxAdded+' kg':'—','Max prídavok'),
    stat(pr.totalReps??'—','Spolu opak.'),
    stat(pr.sessions??'—','Tréningov')];
  return [
    stat(pr.maxWeight!=null?pr.maxWeight+' kg':'—','Max váha'),
    stat(pr.best1RM!=null?round(pr.best1RM)+' kg':'—','Odhad 1RM'),
    stat(pr.maxVol!=null?round(pr.maxVol)+' kg':'—','Najťažšia séria'),
    stat(pr.sessions??'—','Tréningov')];
}
function computePR(exId,ex){
  const r={sessions:0};
  const sessions=new Set();
  for(const w of state.workouts){
    const e=w.entries.find(x=>x.exerciseId===exId); if(!e) continue;
    let counts=false;
    for(const s of e.sets){
      if(ex.type==='cardio'){
        if(s.dist!=null){ r.maxDist=Math.max(r.maxDist??0,s.dist); r.totalDist=(r.totalDist??0)+s.dist; counts=true; }
        if(s.dur!=null){ r.maxDur=Math.max(r.maxDur??0,s.dur); counts=true; }
        if(s.dist&&s.dur){ const pace=s.dur/s.dist; if(r._pace==null||pace<r._pace){ r._pace=pace; r.bestPace=fmtPace(pace); } }
      } else if(ex.type==='bodyweight'){
        if(s.reps!=null){ r.maxReps=Math.max(r.maxReps??0,s.reps); r.totalReps=(r.totalReps??0)+s.reps; counts=true; }
        if(s.addw!=null) r.maxAdded=Math.max(r.maxAdded??0,s.addw);
      } else {
        if(s.weight!=null){ r.maxWeight=Math.max(r.maxWeight??0,s.weight); counts=true;
          const orm=epley1RM(s.weight,s.reps||1); r.best1RM=Math.max(r.best1RM??0,orm);
          if(s.reps!=null) r.maxVol=Math.max(r.maxVol??0, s.weight*s.reps); }
      }
    }
    if(counts) sessions.add(w.id);
  }
  r.sessions=sessions.size;
  return r;
}
function fmtPace(minPerKm){ const m=Math.floor(minPerKm), s=Math.round((minPerKm-m)*60); return m+':'+String(s).padStart(2,'0')+'/km'; }

/* PR detekcia pri ukladaní tréningu (porovná s predošlými) */
function detectWorkoutPRs(workout){
  const found=[];
  for(const e of workout.entries){
    const ex=exById(e.exerciseId); if(!ex) continue;
    // PR pred týmto tréningom
    const before=computePRExcluding(e.exerciseId,ex,workout.id);
    for(const s of e.sets){
      if(ex.type==='strength' && s.weight!=null){
        if(before.maxWeight==null || s.weight>before.maxWeight){ found.push(ex.name); break; }
      } else if(ex.type==='bodyweight' && s.reps!=null){
        if(before.maxReps==null || s.reps>before.maxReps){ found.push(ex.name); break; }
      } else if(ex.type==='cardio' && s.dist!=null){
        if(before.maxDist==null || s.dist>before.maxDist){ found.push(ex.name); break; }
      }
    }
  }
  return found;
}
function computePRExcluding(exId,ex,skipId){
  const saved=state.workouts;
  const r={};
  for(const w of saved){
    if(w.id===skipId) continue;
    const e=w.entries.find(x=>x.exerciseId===exId); if(!e) continue;
    for(const s of e.sets){
      if(ex.type==='cardio'){ if(s.dist!=null) r.maxDist=Math.max(r.maxDist??-1,s.dist); }
      else if(ex.type==='bodyweight'){ if(s.reps!=null) r.maxReps=Math.max(r.maxReps??-1,s.reps); }
      else { if(s.weight!=null) r.maxWeight=Math.max(r.maxWeight??-1,s.weight); }
    }
  }
  return r;
}
/* živá PR notifikácia počas tréningu pri odškrtnutí série */
function checkLivePR(exId,ex,s){
  const before=computePRExcluding(exId,ex,state.active?.id);
  let isPR=false;
  if(ex.type==='strength'&&s.weight!=null && (before.maxWeight==null||s.weight>before.maxWeight)) isPR=true;
  if(ex.type==='bodyweight'&&s.reps!=null && (before.maxReps==null||s.reps>before.maxReps)) isPR=true;
  if(ex.type==='cardio'&&s.dist!=null && (before.maxDist==null||s.dist>before.maxDist)) isPR=true;
  if(isPR) toast('🏆 Osobný rekord — '+ex.name+'!');
}

let volOffset=0;
function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mondayOf(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function volumeView(){
  const wrap=el('div');

  const end=new Date(start); end.setDate(end.getDate()+6);

  nav.append(el('button',{class:'btn sm', onclick:()=>{ volOffset++; render(); }},'‹'));

    start.getDate()+'.'+(start.getMonth()+1)+'. – '+end.getDate()+'.'+(end.getMonth()+1)+'.');

    wrap.append(el('div',{class:'empty'}, el('div',{class:'big'},'📊'),
      el('div',{},'V tomto týždni žiadny tréning.')));
    return wrap;
  }
  const byMuscle={}; let totalSets=0, totalVol=0;
  ws.forEach(w=>w.entries.forEach(e=>{
    const ex=exById(e.exerciseId); if(!ex) return;
    const m=ex.muscle; (byMuscle[m]=byMuscle[m]||{sets:0,vol:0});
    e.sets.forEach(s=>{
      byMuscle[m].sets++; totalSets++;
      let v=0; if(ex.type==='bodyweight'){ if(s.reps) v=(s.addw||0)*s.reps; }
      else if(ex.type!=='cardio'){ if(s.weight&&s.reps) v=s.weight*s.reps; }
      byMuscle[m].vol+=v; totalVol+=v;
    });
  }));
  const card=el('div',{class:'card'});
  card.append(el('div',{class:'statgrid', style:'margin-bottom:14px'},
    stat(ws.length,'Tréningov'), stat(totalSets,'Sérií'),
    stat(round(totalVol).toLocaleString('sk'),'Objem kg'), stat(Object.keys(byMuscle).length,'Partií')));
  const entries=Object.entries(byMuscle).sort((a,b)=>b[1].sets-a[1].sets);
  const max=Math.max(...entries.map(([,v])=>v.sets));
  entries.forEach(([m,v])=>{
    card.append(el('div',{class:'vbar'},
      el('div',{class:'vtop'}, el('b',{},m),
        el('span',{}, v.sets+' sérií'+(v.vol?' · '+round(v.vol).toLocaleString('sk')+' kg':''))),
      el('div',{class:'track'}, el('div',{class:'fill', style:'width:'+(v.sets/max*100)+'%'}))));
  });
  wrap.append(card);
  return wrap;
}

  if(exLib.q) list=list.filter(e=>e.name.toLowerCase().includes(exLib.q));
  list.sort((a,b)=>a.name.localeCompare(b.name,'sk'));
  box.append(el('div',{class:'muted small', style:'margin:2px 2px 8px'}, list.length+' cvikov'));
  for(const ex of list){
    const row=el('div',{class:'exitem'},
      artEl(ex),
      el('div',{class:'grow'},
        el('div',{class:'nm'}, ex.name, ex.custom?el('span',{class:'tag', style:'margin-left:6px;color:var(--acc2)'},'vlastný'):''),
        el('div',{class:'row wrap', style:'margin-top:3px'},
          el('span',{class:'tag eq'},ex.equip), el('span',{class:'tag ms'},ex.muscle),
          el('span',{class:'tag'},TYPE_LABEL[ex.type]))));
    if(state.active){
      row.append(el('button',{class:'btn good sm', onclick:()=>{ addExerciseToWorkout(ex.id); go('train'); }},'＋'));
    } else if(ex.custom){
      row.append(el('button',{class:'iconbtn', onclick:()=>deleteCustom(ex.id)},'🗑'));
    } else {
      row.append(el('button',{class:'iconbtn', title:'Skryť', onclick:()=>{ state.hiddenDefaults.push(ex.id); save(); renderExLibList(); }},'🚫'));
    }
    box.append(row);
  }
  if(state.hiddenDefaults.length){
    box.append(el('button',{class:'btn ghost sm block', style:'margin-top:8px',
      onclick:()=>{ state.hiddenDefaults=[]; save(); renderExLibList(); }},
      'Obnoviť skryté cviky ('+state.hiddenDefaults.length+')'));
  }
}
function deleteCustom(id){
  if(!confirm('Vymazať tento vlastný cvik? (Záznamy v histórii ostanú.)')) return;
  state.customExercises=state.customExercises.filter(e=>e.id!==id); save(); renderExLibList();
}

  const shead=el('div',{class:'shead'});
  shead.append(el('div',{class:'grab'}));

    el('div',{class:'grow', style:'font-weight:700;font-size:18px'},'Nový vlastný cvik'),
    el('button',{class:'iconbtn', onclick:closeModal},'✕')));

  const musSel=el('select',{class:'fld'}); MUSCLE.forEach(x=>musSel.append(el('option',{value:x},x)));

/* ---------------- VIAC / nastavenia ---------------- */
function viewMore(){
  const wrap=el('div');
  wrap.append(el('header',{class:'top'}, el('h1',{},'⚙️ Viac')));

  const ws=state.workouts;
  const c=el('div',{class:'card'});
  c.append(el('h3',{},'Celkové štatistiky'));
  c.append(el('div',{class:'statgrid'},
    stat(ws.length,'Tréningov'),
    stat(ws.reduce((n,w)=>n+w.entries.reduce((m,e)=>m+e.sets.length,0),0),'Sérií spolu'),
    stat(round(ws.reduce((t,w)=>t+workoutVolume(w),0)/1000,1)+' t','Nazdvíhané'),
    stat(usedExerciseIds().length,'Cvikov v hre')));
  wrap.append(c);

  const pref=el('div',{class:'card'});
  pref.append(el('h3',{},'🎨 Vzhľad a ciele'));
  pref.append(el('label',{class:'lbl'},'Téma'));
  const themeSel=el('select',{class:'fld', onchange:e=>{ state.settings.theme=e.target.value; save(); render(); }});
  [['dark','Tmavá'],['light','Svetlá'],['auto','Podľa systému']].forEach(([v,l])=>
    themeSel.append(el('option',{value:v, selected:state.settings.theme===v?'selected':false},l)));
  pref.append(themeSel, el('div',{style:'height:10px'}));

    goalSel.append(el('option',{value:v, selected:state.settings.weeklyGoal===v?'selected':false},l)));
  pref.append(goalSel);
  wrap.append(pref);

  const setg=el('div',{class:'card'});

    el('input',{type:'checkbox', checked:state.settings.restEnabled?'checked':false, style:'width:22px;height:22px',
      onchange:e=>{ state.settings.restEnabled=e.target.checked; save(); }}),
    el('span',{class:'grow'},'Automaticky spustiť po odškrtnutí série'));
  setg.append(toggle);
  setg.append(el('label',{class:'lbl'},'Predvolený oddych'));

  opts.forEach(o=>restSel.append(el('option',{value:o, selected:state.settings.restDefault===o?'selected':false}, mmss(o)+' min')));
  if(!opts.includes(state.settings.restDefault)) restSel.append(el('option',{value:state.settings.restDefault, selected:'selected'}, mmss(state.settings.restDefault)));
  setg.append(restSel);
  setg.append(el('button',{class:'btn sm ghost block', style:'margin-top:10px', onclick:()=>startRest(state.settings.restDefault)},'▶ Vyskúšať časovač'));
  wrap.append(setg);

  const backup=el('div',{class:'card'});
  backup.append(el('h3',{},'Záloha dát'));
  backup.append(el('div',{class:'muted small', style:'margin-bottom:10px'},
    'Dáta sú uložené len v tomto prehliadači. Občas si sprav zálohu, nech o ne neprídeš.'));
  backup.append(el('button',{class:'btn block', style:'margin-bottom:8px', onclick:exportData},'⬇️ Exportovať zálohu (.json)'));

      && confirm('Naozaj? Posledné varovanie.')){

function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='gym-dennik-'+todayISO()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Záloha stiahnutá');
}
function exportCSV(){
  if(!state.workouts.length && !state.bodylog.length){ alert('Zatiaľ nie je čo exportovať.'); return; }
  const esc=v=> v==null?'':String(v).includes(';')||String(v).includes('"')? '"'+String(v).replace(/"/g,'""')+'"' : String(v);
  const num=v=> v==null?'':String(v).replace('.',','); // slovenský Excel čaká desatinnú čiarku
  const rows=[['Dátum','Tréning','Miesto','Cvik','Partia','Séria','Kg','Opakovania','Prídavná váha (kg)','Km','Min']];
  for(const w of [...state.workouts].sort((a,b)=>a.date.localeCompare(b.date))){
    for(const e of w.entries){
      const ex=exById(e.exerciseId);
      e.sets.forEach((s,i)=>rows.push([
        w.date, w.name||'Tréning', w.location, ex?ex.name:e.exerciseId, ex?ex.muscle:'',
        i+1, num(s.weight), s.reps??'', num(s.addw), num(s.dist), num(s.dur)]));
    }
  }
  if(state.bodylog.length){
    rows.push([]); rows.push(['Dátum','Váha (kg)','Pás (cm)','Hrudník (cm)','Biceps (cm)','Stehno (cm)','Boky (cm)']);
    for(const b of [...state.bodylog].sort((a,c)=>a.date.localeCompare(c.date)))
      rows.push([b.date, num(b.weight), num(b.waist), num(b.chest), num(b.arm), num(b.thigh), num(b.hips)]);
  }
  const csv='\uFEFF'+rows.map(r=>r.map(esc).join(';')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='gym-dennik-'+todayISO()+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
  toast('CSV stiahnuté');
}
function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const s=JSON.parse(r.result);
      if(!s.workouts && !s.customExercises) throw new Error('Neplatný súbor');
      if(!confirm('Nahradiť aktuálne dáta dátami zo zálohy?')) return;
      state=normalize(s); save(); render(); toast('Dáta načítané');
    }catch(err){ alert('Chyba pri importe: '+err.message); }
  };
  r.readAsText(file);
}

/* ---------------- výpočty ---------------- */
function workoutVolume(w){
  let v=0;
  for(const e of w.entries){
    const ex=exById(e.exerciseId); if(!ex||ex.type==='cardio') continue;
    for(const s of e.sets){
      if(ex.type==='bodyweight'){ if(s.reps) v+=(s.addw||0)*s.reps; }
      else if(s.weight&&s.reps) v+=s.weight*s.reps;
    }
  }
  return v;
}
function computeStreakWeeks(){
  if(!state.workouts.length) return 0;
  const weeks=new Set(state.workouts.map(w=>isoWeek(w.date)));
  let streak=0; let cur=new Date(todayISO()+'T00:00:00');
  for(let i=0;i<260;i++){
    const wk=isoWeek(cur.toISOString().slice(0,10));
    if(weeks.has(wk)){ streak++; cur.setDate(cur.getDate()-7); }
    else if(i===0){ cur.setDate(cur.getDate()-7); } // tento týždeň ešte nemusí byť odtrénovaný
    else break;
  }
  return streak;
}
function isoWeek(iso){
  const d=new Date(iso+'T00:00:00'); d.setHours(0,0,0,0);
  d.setDate(d.getDate()+3-((d.getDay()+6)%7));
  const week1=new Date(d.getFullYear(),0,4);
  return d.getFullYear()+'-'+(1+Math.round(((d-week1)/86400000-3+((week1.getDay()+6)%7))/7));
}

/* ---------------- jednoduchý čiarový graf na canvas ---------------- */
function drawChart(canvas, series){
  const dpr=window.devicePixelRatio||1;
  const cssW=canvas.clientWidth || 320, cssH=180;
  canvas.width=cssW*dpr; canvas.height=cssH*dpr;
  canvas.style.height=cssH+'px';
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,cssW,cssH);
  const padL=38, padR=12, padT=14, padB=24;
  const w=cssW-padL-padR, h=cssH-padT-padB;
  const vals=series.map(p=>p.value);
  let min=Math.min(...vals), max=Math.max(...vals);
  if(min===max){ min=Math.max(0,min-1); max=max+1; }
  const range=max-min;
  const cs=getComputedStyle(document.body);
  const cLine=(cs.getPropertyValue('--line')||'#2b303b').trim();
  const cMut=(cs.getPropertyValue('--mut')||'#9aa3b2').trim();
  const cTxt=(cs.getPropertyValue('--txt')||'#eef1f6').trim();
  // mriežka + osi
  ctx.strokeStyle=cLine; ctx.fillStyle=cMut; ctx.font='10px -apple-system,Segoe UI,sans-serif';
  ctx.lineWidth=1;
  for(let i=0;i<=3;i++){
    const y=padT+h*(i/3);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+w,y); ctx.stroke();
    const v=max-(range*i/3);
    ctx.textAlign='right'; ctx.fillText(round(v,1), padL-6, y+3);
  }
  const X=i=>padL + (series.length===1? w/2 : w*i/(series.length-1));
  const Y=v=>padT + h*(1-(v-min)/range);
  // plocha pod čiarou
  ctx.beginPath();
  series.forEach((p,i)=>{ const x=X(i),y=Y(p.value); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.lineTo(X(series.length-1),padT+h); ctx.lineTo(X(0),padT+h); ctx.closePath();
  const grad=ctx.createLinearGradient(0,padT,0,padT+h);
  grad.addColorStop(0,'rgba(79,140,255,.30)'); grad.addColorStop(1,'rgba(79,140,255,0)');
  ctx.fillStyle=grad; ctx.fill();
  // čiara
  ctx.beginPath();
  series.forEach((p,i)=>{ const x=X(i),y=Y(p.value); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.strokeStyle='#4f8cff'; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.stroke();
  // body + zvýraznenie maxima
  const maxV=Math.max(...vals);
  series.forEach((p,i)=>{
    const x=X(i),y=Y(p.value);
    ctx.beginPath(); ctx.arc(x,y,p.value===maxV?4.5:3,0,7);
    ctx.fillStyle=p.value===maxV?'#ffd23e':'#4f8cff'; ctx.fill();
  });
  // posledná hodnota popisok
  const last=series[series.length-1];
  ctx.fillStyle=cTxt; ctx.font='bold 11px -apple-system,Segoe UI,sans-serif'; ctx.textAlign='right';
  ctx.fillText(String(last.value), padL+w, Math.max(padT+10, Y(last.value)-8));
}
